[package]
name = "melo"
version = "0.3.0"
description = "Melo - Modern Windows Music Player"
authors = ["Melo Team"]
license = "GPL-3.0-only"
repository = "https://github.com/Arvanta/Melo"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.22"
base64 = "0.22"
souvlaki = { version = "0.8", optional = true }
walkdir = "2.5"
rayon = "1.10"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
