[package]
name = "melo"
version = "1.0.0"
description = "Melo - Modern Windows Music Player"
authors = ["Melo Team"]
license = "GPL-3.0-only"
repository = "https://github.com/Arvanta/Melo"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
# Restores dynamically approved dialog/asset roots across restarts.
tauri-plugin-persisted-scope = { version = "2.3.4", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.22"
walkdir = "2.5"
rusqlite = { version = "0.31", features = ["bundled"] }
crossbeam-channel = "0.5"
sha2 = "0.10"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
