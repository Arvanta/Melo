name: Build Melo

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'LICENSE'
  workflow_dispatch:

# required so tauri-action can create the draft release
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Guard — refuse to overwrite an already-published version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          Write-Host "Project version: $version (target tag: $tag)"
          $remote = git ls-remote --tags origin "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Could not read remote tags (no credentials / offline) — skipping the duplicate-tag guard."
            exit 0
          }
          if ($remote) {
            Write-Error "Tag $tag already exists on the remote. Bump the version in package.json, package-lock.json, src-tauri/Cargo.toml, src-tauri/Cargo.lock, src-tauri/tauri.conf.json, src/main.ts, src/lyrics.ts and README.md before building — refusing to rebuild or replace an existing release."
            exit 1
          }
          Write-Host "$tag is a brand-new tag — safe to build."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (Windows x64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: "Automated build of Melo for Windows"
          releaseDraft: true
          prerelease: true
          args: --target x86_64-pc-windows-msvc

      - name: Upload artifact (msi/exe)
        uses: actions/upload-artifact@v7
        with:
          name: melo-windows
          path: |
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
            dist/**

  build-linux-macos:
    if: false # فعال کنید اگر برای لینوکس/مک هم می‌خواهید
    strategy:
      matrix:
        platform: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
