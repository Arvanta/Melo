<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Melo — Bean</title>
<style>
  /*
   * Bean — compact Fluent mini-player
   *
   * All 5 stage modes paint into the COVER BANNER slot:
   *   Cover      → art only
   *   Blend     → art + visualizer overlay
   *   Visualizer → visualizer only
   *   Queue      → embedded playlist (Melo html.melo-show-playlist)
   *   Lyrics     → embedded lyrics  (Melo html.melo-show-lyrics)
   *
   * Cover / Blend / Visualizer = radios + parent data-melo=toggle-embedded-viz
   *   (click bubbles → Melo leaves Queue/Lyrics; radio drives CSS layout).
   * Queue / Lyrics = Melo embed toggles.
   */
  :root {
    --nk-bg: #e8ecf4;
    --nk-card: #f3f5fb;
    --nk-card-2: #eef1f8;
    --nk-surface: #ffffff;
    --nk-ink: #1a1d24;
    --nk-soft: #5c6573;
    --nk-mute: #8a93a3;
    --nk-line: rgba(26, 29, 36, .08);
    --nk-line-2: rgba(26, 29, 36, .14);
    --nk-wash: rgba(26, 29, 36, .055);
    --nk-scrim: linear-gradient(
      180deg,
      rgba(16, 18, 28, .12) 0%,
      rgba(16, 18, 28, .04) 30%,
      rgba(16, 18, 28, .52) 70%,
      rgba(16, 18, 28, .78) 100%);
    --nk-radius: 14px;
    --nk-shadow:
      0 18px 40px -18px rgba(32, 40, 64, .32),
      0 2px 8px rgba(32, 40, 64, .07),
      inset 0 1px 0 rgba(255, 255, 255, .72);
    --card-border: rgba(26, 29, 36, .09);
    --accent: #4f6ef7;
    --accent-hover: color-mix(in srgb, var(--accent) 82%, #0c1230);
    --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
    --accent-glow: color-mix(in srgb, var(--accent) 32%, transparent);
    --visualizer: #6f89ff;
    --track-bg: rgba(26, 29, 36, .10);
    --nk-on-art: #f5f7ff;
    --nk-on-art-soft: rgba(245, 247, 255, .78);
    --nk-on-art-mute: rgba(245, 247, 255, .55);
    --nk-play-fg: #f5f7ff;
    --nk-sheen: linear-gradient(135deg, rgba(255,255,255,.55), transparent 42%);
  }
  html[data-theme="dark"], [data-theme="dark"] {
    --nk-bg: #0b0d12;
    --nk-card: #13161e;
    --nk-card-2: #171b25;
    --nk-surface: #1c212c;
    --nk-ink: #eceef4;
    --nk-soft: #a4adbc;
    --nk-mute: #7a8496;
    --nk-line: rgba(236, 238, 244, .08);
    --nk-line-2: rgba(236, 238, 244, .14);
    --nk-wash: rgba(236, 238, 244, .06);
    --nk-scrim: linear-gradient(
      180deg,
      rgba(0, 0, 0, .22) 0%,
      rgba(0, 0, 0, .12) 30%,
      rgba(0, 0, 0, .58) 70%,
      rgba(0, 0, 0, .8) 100%);
    --nk-shadow:
      0 20px 48px rgba(0, 0, 0, .55),
      0 2px 8px rgba(0, 0, 0, .35),
      inset 0 1px 0 rgba(255, 255, 255, .05);
    --card-border: rgba(255, 255, 255, .08);
    --accent: #8fa4ff;
    --accent-hover: color-mix(in srgb, var(--accent) 86%, #fff);
    --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
    --accent-glow: color-mix(in srgb, var(--accent) 36%, transparent);
    --visualizer: #8fa4ff;
    --track-bg: rgba(236, 238, 244, .12);
    --nk-play-fg: #0e121c;
    --nk-sheen: linear-gradient(135deg, rgba(255,255,255,.08), transparent 42%);
  }

  * { box-sizing: border-box; }

  body:not(.tauri-main):has(#melo-player) {
    min-height: 100vh; margin: 0; padding: 28px;
    display: grid; place-items: center; overflow: hidden;
    background:
      radial-gradient(70% 55% at 12% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 62%),
      radial-gradient(50% 40% at 90% 100%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 55%),
      var(--nk-bg);
    color: var(--nk-ink);
    font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif;
  }

  #melo-player,
  body.tauri-main .player-card,
  body.custom-skin-active .player-card {
    width: min(460px, 100%);
    height: 250px;
    min-width: 400px;
    min-height: 190px;
    margin: 0; padding: 0;
    position: relative; overflow: hidden;
    container-type: size;
    container-name: nook;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    background:
      var(--nk-sheen),
      radial-gradient(120% 80% at 0% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 48%),
      linear-gradient(180deg, var(--nk-card) 0%, var(--nk-card-2) 100%);
    color: var(--nk-ink);
    border: 1px solid var(--card-border);
    border-radius: var(--nk-radius);
    box-shadow: var(--nk-shadow);
    font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body.tauri-main .player-card {
    width: 100% !important; height: 100vh !important;
    min-height: 0 !important; max-height: 100vh !important;
    border-radius: var(--nk-radius) !important; box-shadow: none !important;
  }

  /* soft top hairline */
  #melo-player::before,
  body.tauri-main .player-card::before,
  body.custom-skin-active .player-card::before {
    content: "";
    position: absolute; z-index: 20;
    top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, #fff 55%, transparent), transparent);
    pointer-events: none;
  }

  /* hidden mode radios — live under #melo-player so :has() works in-card too */
  .nk-mode {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0; pointer-events: none;
    margin: 0;
  }

  /* ========== BANNER = shared stage (cover slot) ========== */
  .nk-banner {
    position: relative;
    min-height: 72px;
    height: 100%;
    align-self: stretch;
    color: var(--nk-on-art);
    overflow: hidden;
    background: var(--nk-surface);
  }

  /*
   * Invisible drag strip — top chrome + a little past the lyric/title line
   * so the window can be moved without covering stage clicks below.
   * Interactive children (menu / lyric / win) keep -webkit-app-region: no-drag.
   */
  .nk-drag {
    position: absolute;
    z-index: 3;
    top: 0; left: 0; right: 0;
    height: 52px; /* ~top row 30px + gap past the chrome line */
    background: transparent;
    -webkit-app-region: drag;
    app-region: drag;
    pointer-events: auto;
  }

  .nk-art {
    position: absolute; inset: 0; z-index: 0;
  }
  .nk-art img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .nk-fallback {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background:
      radial-gradient(80% 80% at 30% 20%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 70%),
      linear-gradient(145deg, #2a3144, #1a1f2c);
    color: color-mix(in srgb, var(--accent) 70%, #fff);
  }
  .nk-fallback svg { width: 28px; height: 28px; opacity: .9; }

  .nk-scrim {
    position: absolute; inset: 0; z-index: 1;
    background: var(--nk-scrim);
    pointer-events: none;
  }

  .nk-viz {
    position: absolute; inset: 0; z-index: 2;
    /* ALWAYS laid out (not display:none) so canvas keeps a real box size.
       Cover hides via opacity/visibility; Visualizer/Blend reveal; Queue/Lyrics
       still use display:none so Melo can pause. */
    display: block;
    padding: 0;
    cursor: pointer;
    -webkit-app-region: no-drag;
    min-width: 0; min-height: 0;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .nk-viz canvas {
    width: 100% !important; height: 100% !important; display: block;
    pointer-events: none;
  }

  .nk-embed {
    position: absolute; inset: 0; z-index: 2;
    display: none;
    overflow: auto;
    padding: 34px 8px 42px;
    -webkit-app-region: no-drag;
    background: color-mix(in srgb, var(--nk-card) 94%, transparent);
    color: var(--nk-ink);
    font-size: 11px;
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--accent) 45%, transparent) transparent;
  }
  .nk-embed .embedded-playlist-row {
    min-height: 24px; padding: 2px 6px; border-radius: 5px;
    font-size: 10.5px; line-height: 1.25;
  }
  .nk-embed .embedded-playlist-row:hover { background: var(--nk-wash); }
  .nk-embed .embedded-playlist-row.active {
    background: var(--accent-soft); color: var(--accent);
  }
  .nk-embed .embedded-playlist-row.active .t-title { color: var(--accent); font-weight: 600; }
  .nk-embed .embedded-playlist-row .t-title { font-size: 10.5px !important; font-weight: 600; }
  .nk-embed .embedded-playlist-row .t-artist,
  .nk-embed .embedded-playlist-row .t-album { font-size: 9.5px !important; opacity: .85; }
  .nk-embed .embedded-playlist-mini .t-title { font-size: 10.5px !important; }
  .nk-embed .track-cover-mini { border-radius: 3px; width: 18px; height: 18px; }
  .nk-embed .embedded-lyrics-title { display: none; }
  .nk-embed .lyric-line {
    padding: 3px 6px; border-radius: 5px;
    font-size: 11px; color: var(--nk-soft);
  }
  .nk-embed .lyric-line.active {
    font-weight: 650; font-size: 11.5px; color: var(--accent); background: var(--accent-soft);
  }
  .nk-embed::-webkit-scrollbar { width: 3px; }
  .nk-embed::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 99px;
  }

  /* ----- mode layers (embeds win over art modes) -----
     Live skin HTML is injected into .player-card (id #melo-player is stripped).
     Preview keeps #melo-player. Use both :has() roots.
  ----- */

  /* Cover (default): art only — viz stays in layout, fully hidden */
  #melo-player:has(#nkModeCover:checked) .nk-viz,
  .player-card:has(#nkModeCover:checked) .nk-viz {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  /* Blend: frosted/matte cover under visualizer */
  #melo-player:has(#nkModeBlend:checked) .nk-art,
  .player-card:has(#nkModeBlend:checked) .nk-art {
    overflow: hidden;
  }
  #melo-player:has(#nkModeBlend:checked) .nk-art img,
  #melo-player:has(#nkModeBlend:checked) .nk-fallback,
  .player-card:has(#nkModeBlend:checked) .nk-art img,
  .player-card:has(#nkModeBlend:checked) .nk-fallback {
    filter: blur(3.5px) saturate(1.12) brightness(0.78);
    transform: scale(1.08);
    transform-origin: center;
  }
  #melo-player:has(#nkModeBlend:checked) .nk-viz,
  .player-card:has(#nkModeBlend:checked) .nk-viz {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: auto !important;
    background:
      linear-gradient(180deg, rgba(8, 10, 18, .18), rgba(8, 10, 18, .32)),
      color-mix(in srgb, var(--accent) 6%, transparent);
  }
  #melo-player:has(#nkModeBlend:checked) .nk-scrim,
  .player-card:has(#nkModeBlend:checked) .nk-scrim {
    opacity: 1;
    background:
      linear-gradient(
        180deg,
        rgba(12, 14, 22, .28) 0%,
        rgba(12, 14, 22, .12) 35%,
        rgba(12, 14, 22, .45) 70%,
        rgba(12, 14, 22, .72) 100%),
      color-mix(in srgb, var(--accent) 10%, transparent);
  }

  /* Visualizer: viz only */
  #melo-player:has(#nkModeSound:checked) .nk-art,
  #melo-player:has(#nkModeSound:checked) .nk-scrim,
  .player-card:has(#nkModeSound:checked) .nk-art,
  .player-card:has(#nkModeSound:checked) .nk-scrim {
    display: none !important;
  }
  #melo-player:has(#nkModeSound:checked) .nk-viz,
  .player-card:has(#nkModeSound:checked) .nk-viz {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: auto !important;
    background: var(--nk-card);
  }
  #melo-player:has(#nkModeSound:checked) .nk-banner,
  .player-card:has(#nkModeSound:checked) .nk-banner { color: var(--nk-ink); }
  #melo-player:has(#nkModeSound:checked) .nk-title,
  .player-card:has(#nkModeSound:checked) .nk-title { text-shadow: none; }
  #melo-player:has(#nkModeSound:checked) .nk-byline,
  #melo-player:has(#nkModeSound:checked) .nk-byline [data-melo="artist"],
  .player-card:has(#nkModeSound:checked) .nk-byline,
  .player-card:has(#nkModeSound:checked) .nk-byline [data-melo="artist"] { color: var(--nk-soft); }
  #melo-player:has(#nkModeSound:checked) .nk-album,
  .player-card:has(#nkModeSound:checked) .nk-album { color: var(--nk-mute); }
  #melo-player:has(#nkModeSound:checked) .nk-dot,
  .player-card:has(#nkModeSound:checked) .nk-dot { background: var(--nk-mute); }
  #melo-player:has(#nkModeSound:checked) .nk-meta-ico,
  .player-card:has(#nkModeSound:checked) .nk-meta-ico { color: var(--nk-soft); }
  #melo-player:has(#nkModeSound:checked) .nk-meta-ico.is-album,
  .player-card:has(#nkModeSound:checked) .nk-meta-ico.is-album { color: var(--nk-mute); }
  #melo-player:has(#nkModeSound:checked) .nk-brand,
  .player-card:has(#nkModeSound:checked) .nk-brand {
    color: var(--nk-ink);
    background: color-mix(in srgb, var(--nk-surface) 85%, transparent);
    border-color: var(--nk-line);
  }
  #melo-player:has(#nkModeSound:checked) .nk-win button,
  .player-card:has(#nkModeSound:checked) .nk-win button {
    background: transparent; color: var(--nk-mute);
  }
  #melo-player:has(#nkModeSound:checked) .nk-win button:hover,
  .player-card:has(#nkModeSound:checked) .nk-win button:hover {
    background: transparent; color: var(--nk-ink);
  }
  #melo-player:has(#nkModeSound:checked) .nk-win button.close:hover,
  .player-card:has(#nkModeSound:checked) .nk-win button.close:hover {
    background: transparent; color: #e81123;
  }
  #melo-player:has(#nkModeSound:checked) .nk-top-lyric,
  .player-card:has(#nkModeSound:checked) .nk-top-lyric {
    color: color-mix(in srgb, var(--accent) 90%, var(--nk-ink));
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-color: color-mix(in srgb, var(--accent) 16%, var(--nk-line));
  }

  /* Queue / Lyrics (Melo html classes) — fill banner; hide art+viz */
  html.melo-show-playlist .nk-art,
  html.melo-show-lyrics .nk-art,
  html.melo-show-playlist .nk-scrim,
  html.melo-show-lyrics .nk-scrim,
  html.melo-show-playlist .nk-viz,
  html.melo-show-lyrics .nk-viz {
    display: none !important;
  }
  html.melo-show-playlist [data-melo="embedded-playlist"] { display: block !important; }
  html.melo-show-lyrics [data-melo="embedded-lyrics"] { display: block !important; }
  html:not(.melo-show-playlist) [data-melo="embedded-playlist"],
  html:not(.melo-show-lyrics) [data-melo="embedded-lyrics"] { display: none !important; }

  html.melo-show-playlist .nk-banner-meta,
  html.melo-show-lyrics .nk-banner-meta,
  html.melo-show-playlist .nk-top-lyric,
  html.melo-show-lyrics .nk-top-lyric {
    display: none !important;
  }
  html.melo-show-playlist .nk-embed,
  html.melo-show-lyrics .nk-embed {
    padding: 34px 8px 10px;
  }
  html.melo-show-playlist .nk-banner,
  html.melo-show-lyrics .nk-banner { color: var(--nk-ink); }
  html.melo-show-playlist .nk-brand,
  html.melo-show-lyrics .nk-brand {
    color: var(--nk-ink);
    background: color-mix(in srgb, var(--nk-surface) 85%, transparent);
    border-color: var(--nk-line);
  }
  html.melo-show-playlist .nk-win button,
  html.melo-show-lyrics .nk-win button {
    background: transparent; color: var(--nk-mute);
  }
  html.melo-show-playlist .nk-win button:hover,
  html.melo-show-lyrics .nk-win button:hover {
    background: transparent; color: var(--nk-ink);
  }
  html.melo-show-playlist .nk-win button.close:hover,
  html.melo-show-lyrics .nk-win button.close:hover {
    background: transparent; color: #e81123;
  }

  /* banner chrome */
  .nk-banner-top {
    position: absolute; z-index: 5;
    top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 6px 0 8px;
    /* empty gaps fall through to .nk-drag underneath */
    pointer-events: none;
  }
  .nk-banner-top > * { pointer-events: auto; }
  /* single-line current lyric — centered in the top chrome */
  .nk-top-lyric {
    -webkit-app-region: no-drag;
    flex: 1 1 auto;
    min-width: 0;
    margin: 0 4px;
    height: 22px;
    padding: 0 12px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px;
    background: rgba(0, 0, 0, .24);
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--nk-on-art);
    font-size: 10.5px; font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: center;
    cursor: pointer;
  }
  .nk-top-lyric:empty,
  .nk-top-lyric.melo-lyric-empty { display: none; }

  .nk-menu {
    -webkit-app-region: no-drag;
    app-region: no-drag;
    position: relative; flex-shrink: 0;
  }
  .nk-menu > input {
    position: absolute; width: 1px; height: 1px;
    opacity: 0; pointer-events: none;
  }
  .nk-brand {
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 9px 0 6px;
    border-radius: 999px;
    font-size: 11px; font-weight: 650; letter-spacing: -.01em;
    color: var(--nk-on-art);
    background: rgba(0, 0, 0, .22);
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 1px 3px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.16);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  .nk-brand:hover,
  .nk-menu > input:checked ~ .nk-brand {
    background: rgba(0, 0, 0, .36);
    border-color: rgba(255, 255, 255, .22);
  }
  /* small accent dot — soft ring + inner glow */
  .nk-mark {
    width: 8px; height: 8px; border-radius: 50%;
    display: block;
    flex-shrink: 0;
    background:
      radial-gradient(circle at 32% 28%,
        color-mix(in srgb, #fff 62%, var(--accent)) 0%,
        var(--accent) 52%,
        color-mix(in srgb, var(--accent) 65%, #000) 100%);
    box-shadow:
      0 0 0 1.5px color-mix(in srgb, var(--accent) 30%, transparent),
      0 0 7px color-mix(in srgb, var(--accent) 48%, transparent);
  }
  .nk-mark svg { display: none; }
  .nk-menu-pop {
    display: none; position: absolute; z-index: 50;
    top: calc(100% + 5px); left: 0; min-width: 156px;
    padding: 5px; flex-direction: column; gap: 1px;
    background: color-mix(in srgb, var(--nk-surface) 94%, transparent);
    color: var(--nk-ink);
    border: 1px solid var(--nk-line-2);
    border-radius: 11px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, .28);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .nk-menu > input:checked ~ .nk-menu-pop { display: flex; }
  .nk-menu-item {
    display: flex; align-items: center; gap: 8px;
    height: 28px; padding: 0 8px; border-radius: 6px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    background: transparent; color: var(--nk-ink);
  }
  .nk-menu-item:hover { background: var(--nk-wash); }
  .nk-menu-item svg { width: 13px; height: 13px; color: var(--nk-soft); flex-shrink: 0; }
  .nk-dismiss {
    display: none; position: fixed; inset: 0; z-index: 40; cursor: default;
  }
  .nk-menu > input:checked ~ .nk-dismiss { display: block; }

  .nk-win {
    -webkit-app-region: no-drag;
    app-region: no-drag;
    margin-left: auto;
    display: flex; gap: 0;
  }
  .nk-win button {
    width: 28px; height: 24px; padding: 0;
    display: grid; place-items: center;
    border: 0; border-radius: 6px;
    background: transparent;
    color: var(--nk-on-art-mute); cursor: pointer;
    transition: color .14s ease;
  }
  .nk-win button:hover { background: transparent; color: var(--nk-on-art); }
  .nk-win button.close:hover { background: transparent; color: #ff6b6b; }
  .nk-win button svg { width: 11px; height: 11px; }

  .nk-banner-meta {
    position: absolute; z-index: 4;
    left: 12px; right: 12px; bottom: 10px;
    min-width: 0;
    pointer-events: none;
    display: flex; flex-direction: column; gap: 4px;
  }
  .nk-title-row {
    display: flex; align-items: center; gap: 7px; min-width: 0;
  }
  /* fixed size — does not scale with player width/height */
  .nk-title {
    min-width: 0; flex: 1 1 auto;
    font-size: 16px;
    font-weight: 680; letter-spacing: -.015em; line-height: 1.18;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .4);
  }
  .nk-byline {
    margin-top: 0;
    display: flex; align-items: center; gap: 6px; min-width: 0;
    font-size: 11px; font-weight: 500;
    color: var(--nk-on-art-soft);
  }
  .nk-byline > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .nk-byline [data-melo="artist"] { font-weight: 600; color: var(--nk-on-art); flex: 0 1 auto; }
  .nk-album { color: var(--nk-on-art-mute); font-weight: 400; flex: 0 1 auto; }
  .nk-dot {
    flex: 0 0 auto; width: 2.5px; height: 2.5px; border-radius: 50%;
    background: var(--nk-on-art-mute);
  }
  .nk-meta-ico {
    flex: 0 0 auto;
    width: 13px; height: 13px;
    display: grid; place-items: center;
    color: var(--nk-on-art-soft);
    opacity: .92;
  }
  .nk-meta-ico svg { width: 13px; height: 13px; display: block; }
  .nk-title-row .nk-meta-ico {
    width: 15px; height: 15px;
    background: none;
    color: var(--nk-on-art-soft);
    opacity: .95;
  }
  .nk-title-row .nk-meta-ico svg { width: 15px; height: 15px; }
  .nk-meta-ico.is-album { color: var(--nk-on-art-mute); opacity: .88; }
  .nk-byline:has(.nk-album:empty) .nk-dot,
  .nk-byline:has(.nk-album:empty) .nk-meta-ico.is-album { display: none; }

  /* ========== BODY ========== */
  .nk-body {
    min-height: 0; min-width: 0;
    flex: 0 0 auto;
    display: flex; flex-direction: column; gap: 6px;
    justify-content: flex-end;
    padding: 7px 10px 8px;
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--nk-card) 92%, transparent) 0%,
        var(--nk-card-2) 100%);
    border-top: 1px solid color-mix(in srgb, var(--nk-line) 70%, transparent);
  }

  .nk-chips {
    display: flex; align-items: center; gap: 4px;
    width: 100%;
    min-width: 0;
    flex-shrink: 0;
    /* chip row never compresses its controls — only meta-bits may yield */
    flex-wrap: nowrap;
  }
  /* right cluster: window tools + codec/specs.
     margin-left:auto keeps tools pinned to the RIGHT — when specs hide
     at ≤530px the cluster just gets shorter, still flush right. */
  .nk-chips-end {
    display: flex; align-items: center; gap: 4px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .nk-art-modes {
    display: flex; flex-wrap: nowrap; gap: 1px; align-items: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .nk-art-modes label { pointer-events: auto; flex-shrink: 0; }

  .nk-seg {
    -webkit-app-region: no-drag;
    display: flex; flex-wrap: nowrap; gap: 1px; padding: 2px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--nk-surface) 78%, transparent);
    border: 1px solid var(--nk-line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
    flex-shrink: 0; /* keep full Cover/Blend/Visualizer/Queue/Lyrics size */
  }
  .nk-seg label,
  .nk-seg button {
    height: 20px; padding: 0 7px;
    border: 0; border-radius: 7px;
    background: transparent; color: var(--nk-mute);
    font-size: 9.5px; font-weight: 700; letter-spacing: .02em;
    cursor: pointer;
    display: inline-flex; align-items: center;
    transition: color .12s ease, background .12s ease, box-shadow .12s ease;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nk-seg label:hover,
  .nk-seg button:hover { color: var(--nk-ink); background: var(--nk-wash); }

  /* active seg — queue/lyrics beat art radios */
  html.melo-show-playlist .nk-seg [data-melo="toggle-embedded-playlist"],
  html.melo-show-lyrics .nk-seg [data-melo="toggle-embedded-lyrics"] {
    color: var(--accent); background: var(--accent-soft);
  }
  html:not(.melo-show-playlist):not(.melo-show-lyrics) #melo-player:has(#nkModeCover:checked) label[for="nkModeCover"],
  html:not(.melo-show-playlist):not(.melo-show-lyrics) .player-card:has(#nkModeCover:checked) label[for="nkModeCover"],
  html:not(.melo-show-playlist):not(.melo-show-lyrics) #melo-player:has(#nkModeBlend:checked) label[for="nkModeBlend"],
  html:not(.melo-show-playlist):not(.melo-show-lyrics) .player-card:has(#nkModeBlend:checked) label[for="nkModeBlend"],
  html:not(.melo-show-playlist):not(.melo-show-lyrics) #melo-player:has(#nkModeSound:checked) label[for="nkModeSound"],
  html:not(.melo-show-playlist):not(.melo-show-lyrics) .player-card:has(#nkModeSound:checked) label[for="nkModeSound"] {
    color: var(--accent); background: var(--accent-soft);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  html:not(.melo-show-playlist):not(.melo-show-lyrics) #melo-player:has(#nkModeCover:checked) label[for="nkModeCover"],
  html:not(.melo-show-playlist):not(.melo-show-lyrics) .player-card:has(#nkModeCover:checked) label[for="nkModeCover"],
  html:not(.melo-show-playlist):not(.melo-show-lyrics) #melo-player:has(#nkModeBlend:checked) label[for="nkModeBlend"],
  html:not(.melo-show-playlist):not(.melo-show-lyrics) .player-card:has(#nkModeBlend:checked) label[for="nkModeBlend"] {
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  html.melo-show-playlist .nk-seg [data-melo="toggle-embedded-playlist"],
  html.melo-show-lyrics .nk-seg [data-melo="toggle-embedded-lyrics"] {
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent);
  }

  .nk-tools {
    display: flex; gap: 1px; flex-shrink: 0;
    padding: 2px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--nk-surface) 70%, transparent);
    border: 1px solid var(--nk-line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
  }
  .nk-tools button {
    width: 24px; height: 22px; padding: 0;
    display: grid; place-items: center;
    border: 0; border-radius: 7px;
    background: transparent; color: var(--nk-mute); cursor: pointer;
    transition: background .12s ease, color .12s ease, transform .12s ease;
  }
  .nk-tools button:hover {
    background: var(--nk-wash); color: var(--nk-ink);
    transform: translateY(-0.5px);
  }
  .nk-tools button.active {
    color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .nk-tools button svg { width: 13px; height: 13px; }

  .nk-meta-bits {
    margin-left: 0; min-width: 0;
    display: flex; align-items: center; gap: 6px;
    font-size: 9px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--nk-mute);
  }
  .nk-meta-bits > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nk-chip {
    flex-shrink: 0; padding: 2px 6px; border-radius: 999px;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 16%, transparent);
    font-weight: 700;
  }
  .nk-chip:empty { display: none; }


  .nk-foot {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: auto auto minmax(0, 1fr) auto auto;
    align-items: center;
    column-gap: 6px;
    min-width: 0;
    height: 36px;
    min-height: 36px;
    max-height: 36px;
    padding: 0 4px 0 2px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--nk-surface) 55%, transparent);
    border: 1px solid color-mix(in srgb, var(--nk-line) 80%, transparent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
    box-sizing: border-box;
  }
  /* every direct child is a flex box centered on the same mid-line */
  .nk-foot > * {
    display: flex !important;
    align-items: center !important;
    justify-content: center;
    align-self: center !important;
    height: 36px !important;
    min-height: 36px !important;
    max-height: 36px !important;
    margin: 0 !important;
    padding: 0 !important;
    box-sizing: border-box;
    line-height: 1 !important;
  }
  .nk-foot > .nk-controls { justify-content: flex-start; gap: 0; }
  .nk-foot > .nk-seek { justify-content: stretch; min-width: 0; overflow: hidden; }
  .nk-foot > .nk-vol { justify-content: flex-end; gap: 2px; }
  .nk-foot > .nk-time.is-elapsed { justify-content: flex-end; }
  .nk-foot > .nk-time.is-duration { justify-content: flex-start; }

  .nk-controls {
    flex-shrink: 0;
  }
  .nk-btn {
    width: 26px; height: 26px; padding: 0;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: transparent; color: var(--nk-soft); cursor: pointer;
    transition: background .12s ease, color .12s ease, transform .12s ease;
    flex-shrink: 0;
  }
  .nk-btn:hover { background: var(--nk-wash); color: var(--nk-ink); }
  .nk-btn.active { color: var(--accent); background: var(--accent-soft); }
  .nk-btn svg { width: 13px; height: 13px; display: block; }
  .nk-btn.nk-play {
    width: 26px; height: 26px;
    background:
      radial-gradient(circle at 30% 28%, color-mix(in srgb, #fff 28%, var(--accent)), var(--accent) 58%);
    color: var(--nk-play-fg);
    box-shadow:
      0 5px 14px var(--accent-glow),
      0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent),
      inset 0 1px 0 rgba(255,255,255,.28);
    margin: 0 2px;
  }
  .nk-btn.nk-play:hover {
    background:
      radial-gradient(circle at 30% 28%, color-mix(in srgb, #fff 34%, var(--accent-hover)), var(--accent-hover) 58%);
    transform: scale(1.06);
  }
  .nk-btn.nk-play svg { width: 14px; height: 14px; }

  .nk-seek {
    min-width: 0;
    overflow: hidden;
    width: 100%;
  }
  .nk-time {
    flex-shrink: 0;
    font-size: 9.5px; font-weight: 650; color: var(--nk-mute);
    font-variant-numeric: tabular-nums;
    font-family: "Cascadia Mono", "Segoe UI Variable Text", Consolas, monospace;
    min-width: 3.2em;
    white-space: nowrap;
  }
  .nk-vol {
    flex-shrink: 0;
  }
  .nk-vol-ico {
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--nk-soft); cursor: pointer;
    flex-shrink: 0;
    transition: background .12s ease, color .12s ease;
  }
  .nk-vol-ico:hover { background: var(--nk-wash); color: var(--nk-ink); }
  .nk-vol-ico.muted { color: #e81123; }
  .nk-vol-ico svg { width: 13px; height: 13px; display: block; }

  .nk-range {
    -webkit-appearance: none; appearance: none;
    outline: none; cursor: pointer;
    background: transparent;
    border: 0;
    padding: 0;
    margin: 0;
    /* fill the foot cell height so the track sits on true vertical center */
    height: 36px !important;
    display: block;
  }
  .nk-range.is-seek { width: 100%; min-width: 0; flex: 1 1 auto; }
  .nk-range.is-vol { width: 52px; flex: 0 0 52px; }
  .nk-range.is-seek::-webkit-slider-runnable-track {
    height: 3.5px; border-radius: 999px;
    box-shadow: inset 0 0.5px 1px rgba(0,0,0,.08);
    background: linear-gradient(
      to right,
      color-mix(in srgb, var(--accent) 78%, #fff) 0%,
      var(--accent) var(--progress, 0%),
      var(--track-bg) var(--progress, 0%),
      var(--track-bg) 100%);
  }
  .nk-range.is-seek::-moz-range-track {
    height: 3.5px; border-radius: 999px;
    background: linear-gradient(
      to right,
      color-mix(in srgb, var(--accent) 78%, #fff) 0%,
      var(--accent) var(--progress, 0%),
      var(--track-bg) var(--progress, 0%),
      var(--track-bg) 100%);
  }
  .nk-range.is-vol::-webkit-slider-runnable-track {
    height: 3.5px; border-radius: 999px;
    background: linear-gradient(
      to right,
      var(--accent) 0%, var(--accent) var(--vol, 60%),
      var(--track-bg) var(--vol, 60%), var(--track-bg) 100%);
  }
  .nk-range.is-vol::-moz-range-track {
    height: 3.5px; border-radius: 999px;
    background: linear-gradient(
      to right,
      var(--accent) 0%, var(--accent) var(--vol, 60%),
      var(--track-bg) var(--vol, 60%), var(--track-bg) 100%);
  }
  .nk-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px; margin-top: -3.75px; border-radius: 50%;
    background: #fff; border: 0;
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--nk-ink) 10%, transparent),
      0 1px 5px rgba(0,0,0,.18);
    opacity: 0; transform: scale(.5);
    transition: opacity .12s ease, transform .12s ease, box-shadow .12s ease;
  }
  .nk-range::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; border: 0; background: #fff;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--nk-ink) 10%, transparent), 0 1px 5px rgba(0,0,0,.18);
    opacity: 0; transform: scale(.5);
    transition: opacity .12s ease, transform .12s ease;
  }
  .nk-range:hover::-webkit-slider-thumb,
  .nk-range:active::-webkit-slider-thumb,
  .nk-range:hover::-moz-range-thumb,
  .nk-range:active::-moz-range-thumb {
    opacity: 1; transform: scale(1);
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent),
      0 1px 6px rgba(0,0,0,.2),
      0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }

  /* Narrow: keep ALL transport + chip buttons + time font/position;
     only the bare seek track (+ slightly vol) shrinks. Foot gap stays fixed
     so elapsed time never drifts left/right when resizing. */
  @container nook (max-width: 440px) {
    .nk-range.is-vol { width: 36px; flex-basis: 36px; }
  }

  @container nook (max-width: 400px) {
    .nk-range.is-vol { width: 28px; flex-basis: 28px; }
  }

  /* track tech details (mp3 / 44.1kHz / kbps) — hide at ≤530px;
     tools stay on the RIGHT (chips-end keeps margin-left: auto). */
  @container nook (max-width: 530px) {
    .nk-meta-bits { display: none !important; }
  }
  @container (max-width: 530px) {
    .nk-meta-bits { display: none !important; }
  }
  @media (max-width: 530px) {
    .nk-meta-bits { display: none !important; }
  }

  @container nook (max-height: 250px) {
    .nk-body { gap: 6px; padding-top: 6px; padding-bottom: 7px; }
  }
</style>
</head>
<body
  data-window-width="460"
  data-window-height="250"
  data-min-width="400"
  data-min-height="190"
  data-max-width="640"
  data-max-height="380"
  data-resizable="true">
<div id="melo-player">

  <!-- skin-local stage radios (Cover default) -->
  <input class="nk-mode" id="nkModeCover" type="radio" name="nkMode" checked />
  <input class="nk-mode" id="nkModeBlend" type="radio" name="nkMode" />
  <input class="nk-mode" id="nkModeSound" type="radio" name="nkMode" />

  <!-- banner = cover slot for all 5 modes -->
  <section class="nk-banner">
    <div class="nk-art">
      <img data-melo="cover" alt="" style="display:none" />
      <div class="nk-fallback" data-melo="cover-fallback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
    </div>
    <div class="nk-scrim" aria-hidden="true"></div>

    <div class="nk-viz" data-melo="visualizer" data-bars="36"></div>
    <div class="nk-embed" data-melo="embedded-playlist"></div>
    <div class="nk-embed" data-melo="embedded-lyrics"></div>

    <!-- invisible move handle: top bar + a little below the chrome line -->
    <div class="nk-drag" data-tauri-drag-region aria-hidden="true"></div>

    <div class="nk-banner-top">
      <div class="nk-menu">
        <input id="nkMenuToggle" type="checkbox" />
        <label class="nk-brand" for="nkMenuToggle" title="Menu">
          <span class="nk-mark" aria-hidden="true"></span>
          Melo
        </label>
        <div class="nk-menu-pop">
          <label class="nk-menu-item" for="nkMenuToggle" data-melo="add-files">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 12v6M9 15h6"/></svg>
            Add files
          </label>
          <label class="nk-menu-item" for="nkMenuToggle" data-melo="add-folder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            Add folder
          </label>
          <label class="nk-menu-item" for="nkMenuToggle" data-melo="theme-toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            Theme
          </label>
        </div>
        <label class="nk-dismiss" for="nkMenuToggle" aria-label="Close menu"></label>
      </div>

      <div class="nk-top-lyric" data-melo="current-lyric" aria-live="polite" title="Current lyric"></div>

      <div class="nk-win">
        <button type="button" data-melo="minimize" title="Minimize" aria-label="minimize">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <button type="button" class="close" data-melo="close" title="Close" aria-label="close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>

    <div class="nk-banner-meta">
      <div class="nk-title-row">
        <span class="nk-meta-ico" aria-hidden="true" title="Track">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        <div class="nk-title" data-melo="title">Nothing playing</div>
      </div>
      <div class="nk-byline">
        <span class="nk-meta-ico" aria-hidden="true" title="Artist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 19.5c1.2-3.2 3.4-4.8 6.5-4.8s5.3 1.6 6.5 4.8"/></svg>
        </span>
        <span data-melo="artist">Add music to begin</span>
        <span class="nk-dot" aria-hidden="true"></span>
        <span class="nk-meta-ico is-album" aria-hidden="true" title="Album">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.2"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg>
        </span>
        <span class="nk-album" data-melo="album"></span>
      </div>
    </div>
  </section>

  <div class="nk-body">
    <div class="nk-chips">
      <!--
        5 modes paint into the banner. Cover/Blend/Visualizer share one parent
        hook (toggle-embedded-viz) so Melo binds once; label clicks bubble up
        (leave Queue/Lyrics) and still check their radios for CSS.
      -->
      <div class="nk-seg" role="tablist" aria-label="Stage">
        <div class="nk-art-modes" data-melo="toggle-embedded-viz" title="Stage">
          <label for="nkModeCover" title="Cover only">Cover</label>
          <label for="nkModeBlend" title="Cover + visualizer">Blend</label>
          <label for="nkModeSound" title="Visualizer only">Visualizer</label>
        </div>
        <button type="button" data-melo="toggle-embedded-playlist" title="Queue (cover slot)">Queue</button>
        <button type="button" data-melo="toggle-embedded-lyrics" title="Lyrics (cover slot)">Lyrics</button>
      </div>
      <div class="nk-chips-end">
        <div class="nk-tools">
          <button type="button" id="btnToggleLibrary" data-melo="toggle-library" title="Library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></svg>
          </button>
          <button type="button" id="btnTogglePlaylist" data-melo="toggle-playlist" title="Queue window">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 7h12M8 12h12M8 17h8"/><circle cx="4" cy="7" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="17" r="1"/></svg>
          </button>
          <button type="button" id="btnToggleEq" data-melo="toggle-eq" title="Equalizer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
          </button>
          <button type="button" id="btnToggleLyrics" data-melo="toggle-lyrics" title="Lyrics window">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
          </button>
          <button type="button" id="btnOpenSettings" data-melo="toggle-settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l-2.86 2.86A1.7 1.7 0 0 0 15 19.4 1.7 1.7 0 0 0 14 21h-4a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.88.34l-2.86-2.86A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3 14v-4a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.34-1.88l2.86-2.86A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3h4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.88-.34l2.86 2.86A1.7 1.7 0 0 0 19.4 9 1.7 1.7 0 0 0 21 10v4a1.7 1.7 0 0 0-1.6 1z"/></svg>
          </button>
        </div>
        <div class="nk-meta-bits">
          <span class="nk-chip" data-melo="codec"></span>
          <span data-melo="specs"></span>
        </div>
      </div>
    </div>

    <div class="nk-foot">
      <div class="nk-controls">
        <button class="nk-btn" type="button" data-melo="shuffle" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20l8-8M21 3l-8 8M16 21h5v-5M4 4l5 5"/></svg>
        </button>
        <button class="nk-btn" type="button" data-melo="prev" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 12 20 6v12zm-7-6h3v12H4z"/></svg>
        </button>
        <button class="nk-btn" type="button" data-melo="stop" title="Stop">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button class="nk-btn nk-play" type="button" data-melo="play" title="Play / Pause">
          <svg data-melo="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg data-melo="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="nk-btn" type="button" data-melo="next" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="m4 6 9 6-9 6zm11 0h3v12h-3z"/></svg>
        </button>
        <button class="nk-btn" type="button" data-melo="repeat" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <span class="nk-time is-elapsed" data-melo="current-time">0:00</span>
      <div class="nk-seek">
        <input class="nk-range is-seek" type="range" min="0" max="100" value="0" data-melo="seek" aria-label="Seek" />
      </div>
      <span class="nk-time is-duration" data-melo="duration">0:00</span>

      <div class="nk-vol">
        <span class="nk-vol-ico" data-melo="volume-icon" title="Mute">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
        </span>
        <input class="nk-range is-vol" type="range" min="0" max="100" value="60" data-melo="volume" aria-label="Volume" />
      </div>
    </div>
  </div>

</div>
</body>
</html>
