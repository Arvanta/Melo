<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Melo — Deck</title>
<style>
/*
  DECK — a modular hi-fi rack player. Brushed gunmetal (dark) / brushed silver (light)
  case, a glass-covered LCD that never changes with the theme, and machined hardware:
  a knurled seek fader, joined transport keys, a segmented LED spectrum (green → amber → red).
  Fixed 560×248. Pure CSS, no scripts.
  LCD: big time read-out + mode LEDs, title, artist · album (+ codec / specs), the current
  lyric line (opt-in via Settings) with a thin progress rule, then the spectrum across the
  full width. Lyrics / Queue take over the LCD + cover area.
*/
:root, [data-theme="dark"] {
  --m1: #565e6b; --m2: #343a45; --m3: #1c2026; --edge: #090b0e; --hi: rgba(255,255,255,.20);
  --b1: #626b78; --b2: #3c424d; --b3: #282d35; --ink: #dce3ec; --mute: #97a2b2; --groove: #0e1115;
  --brush: rgba(255,255,255,.022); --seam: rgba(0,0,0,.4);
  --accent: #44f2cf; --visualizer: #44f2cf; --track-bg: #0e1115;
}
[data-theme="light"] {
  --m1: #f4f6f9; --m2: #d3d8e0; --m3: #b3bac5; --edge: #666e7a; --hi: rgba(255,255,255,.9);
  --b1: #fcfdfe; --b2: #dde1e7; --b3: #bfc5ce; --ink: #1b2129; --mute: #4f5a69; --groove: #8a919c;
  --brush: rgba(60,70,90,.05); --seam: rgba(60,70,90,.3);
  --accent: #44f2cf; --visualizer: #44f2cf; --track-bg: #8a919c;
}
:root {
  --lcd-bg: #030b09; --lcd: #44f2cf; --lcd-dim: rgba(68,242,207,.58); --lcd-faint: rgba(68,242,207,.16);
  --mono: "Share Tech Mono", "Cascadia Mono", "SF Mono", Consolas, "Courier New", monospace;
  --ui: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
  --metal: linear-gradient(180deg, var(--b1), var(--b2) 52%, var(--b3));
}
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; }
button { font: inherit; }
body:not(.tauri-main):has(#melo-player) { min-height: 100vh; padding: 24px; display: grid; place-items: center; background: #0f1216; }
[data-theme="light"] body:not(.tauri-main):has(#melo-player) { background: #d8dce3; }

#melo-player, body.tauri-main .player-card, body.custom-skin-active .player-card {
  position: relative; width: 560px; height: 248px; margin: 0; padding: 0; overflow: hidden; border-radius: 0 !important;
  color: var(--ink); background: transparent; border: 0; box-shadow: none; font: 12px/1.2 var(--ui); -webkit-font-smoothing: antialiased;
}
body.tauri-main, body.tauri-main .app-shell { min-width: 0 !important; }
body.tauri-main .player-card, body.custom-skin-active .player-card {
  width: 100% !important; height: 100vh !important; min-width: 0 !important; min-height: 0 !important; max-height: 100vh !important;
  padding: 0 !important; margin: 0 !important; overflow: hidden !important; background: transparent !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important;
}
.wa-case { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden;
  background: repeating-linear-gradient(90deg, var(--brush) 0 1px, transparent 1px 3px), linear-gradient(180deg, var(--m1), var(--m2) 14%, var(--m3));
  box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--hi), inset 0 -1px 0 rgba(0,0,0,.35); }

/* ───── top bar ───── */
.wa-bar { flex: 0 0 26px; display: flex; align-items: center; gap: 3px; padding: 0 5px 0 9px; -webkit-app-region: drag; user-select: none;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.18)); box-shadow: inset 0 -1px 0 var(--edge), 0 1px 0 var(--hi); }
.wa-brand { font: 900 10.5px/1 var(--ui); letter-spacing: .3em; margin-right: 7px; color: var(--ink); text-shadow: 0 1px 0 var(--hi); }
.wa-brand i { font-style: normal; color: var(--lcd); text-shadow: 0 0 6px var(--lcd-dim); }
.wa-menu { position: relative; z-index: 60; -webkit-app-region: no-drag; }
.wa-mchk { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
.wa-pop, .wa-scrim { display: none; }
.wa-mchk:checked ~ .wa-pop { display: block; }
.wa-mchk:checked ~ .wa-scrim { display: block; position: fixed; inset: 0; z-index: 55; cursor: default; -webkit-app-region: no-drag; }
.wa-mchk:checked ~ .wa-mbtn { background: var(--lcd-bg); color: var(--lcd); box-shadow: inset 0 1px 3px rgba(0,0,0,.8); text-shadow: 0 0 5px var(--lcd-dim); }
.wa-mchk:focus-visible ~ .wa-mbtn { outline: 2px solid var(--lcd); outline-offset: 1px; }
.wa-pop { position: absolute; z-index: 60; top: calc(100% + 4px); left: 0; min-width: 156px; padding: 3px; border-radius: 3px; background: var(--m2); box-shadow: 0 0 0 1px var(--edge), 0 8px 18px rgba(0,0,0,.5), inset 0 1px 0 var(--hi); }
.wa-item { display: block; height: 26px; padding: 0 9px; line-height: 26px; color: var(--ink); font-size: 12px; cursor: pointer; border-radius: 2px; white-space: nowrap; }
.wa-item:hover { background: var(--lcd-bg); color: var(--lcd); }
.wa-spacer { flex: 1 1 auto; }
.wa-grp { flex: 0 0 auto; display: flex; gap: 2px; -webkit-app-region: no-drag; }
.wa-tx { flex: 0 0 auto; white-space: nowrap; height: 18px; padding: 0 8px; border: 1px solid var(--edge); border-radius: 2px; cursor: pointer; color: var(--ink);
  font: 800 9px/16px var(--ui); letter-spacing: .09em; text-transform: uppercase; background: var(--metal); box-shadow: inset 0 1px 0 var(--hi); }
.wa-tx:hover { filter: brightness(1.12); }
.wa-tx:active, .wa-tx.active { background: var(--lcd-bg); color: var(--lcd); box-shadow: inset 0 1px 3px rgba(0,0,0,.8); text-shadow: 0 0 5px var(--lcd-dim); }
.wa-mbtn { display: block; }
.wa-tx.stage-btn { width: auto; height: 18px; padding: 0 8px; display: block; border: 1px solid var(--edge); border-radius: 2px; color: var(--ink); }
.wa-tx.stage-btn.active { color: var(--lcd); }
.wa-ic { width: 24px; padding: 0; display: grid; place-items: center; }
.wa-ic svg { width: 12px; height: 12px; }
.wa-win.close:hover { background: #c4452b; color: #fff; }
.wa-sep { width: 1px; height: 14px; margin: 0 4px; background: var(--edge); box-shadow: 1px 0 0 var(--hi); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lcd); outline-offset: 1px; }

/* ───── body ───── */
.wa-body { position: relative; flex: 1 1 auto; min-height: 0; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.wa-top { flex: 0 0 140px; display: flex; gap: 8px; }
.wa-cover { position: relative; flex: 0 0 124px; width: 124px; height: 124px; align-self: center; margin: 0 2px; border-radius: 3px; overflow: hidden; background: var(--lcd-bg);
  box-shadow: 0 0 0 1px var(--edge), 0 0 0 3px var(--b2), 0 0 0 4px var(--edge), 0 1px 0 4px var(--hi), inset 0 0 12px rgba(0,0,0,.7); }
.wa-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wa-cover .fb { position: absolute; inset: 0; display: grid; place-items: center; color: var(--lcd); font: 700 36px var(--mono); text-shadow: 0 0 12px var(--lcd-dim);
  background: repeating-linear-gradient(0deg, rgba(68,242,207,.06) 0 2px, transparent 2px 4px), var(--lcd-bg); }
.wa-cover::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,.16) 0 20%, transparent 20%); }

/* LCD: never themed */
.wa-lcd { position: relative; flex: 1 1 auto; border-radius: 3px; padding: 8px 12px; display: flex; flex-direction: column; gap: 3px; color: var(--lcd); overflow: hidden;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 1px, transparent 1px 3px), radial-gradient(120% 140% at 30% 0, #0a1d18, var(--lcd-bg) 70%);
  box-shadow: 0 0 0 1px var(--edge), 0 1px 0 1px var(--hi), inset 0 2px 8px rgba(0,0,0,.9), inset 0 0 0 1px rgba(68,242,207,.08); }
.wa-lcd::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5; background: linear-gradient(115deg, rgba(255,255,255,.05) 0 26%, transparent 26.5%); }
.wa-row1 { flex: 0 0 28px; display: flex; align-items: center; gap: 8px; }
.wa-time { flex: 1 1 auto; display: flex; align-items: center; gap: 7px; font-family: var(--mono); }
.wa-state { width: 14px; height: 14px; flex: 0 0 14px; color: var(--lcd-dim); }
.wa-state svg { width: 100%; height: 100%; display: block; }
.wa-state .pa { display: none; }
.wa-body:has([data-melo="pause-icon"][style*="block"]) .wa-state .pl { display: none; }
.wa-body:has([data-melo="pause-icon"][style*="block"]) .wa-state .pa { display: block; }
.wa-body:has([data-melo="pause-icon"][style*="block"]) .wa-state { color: var(--lcd); filter: drop-shadow(0 0 4px var(--lcd-dim)); }
.wa-cur { font-size: 26px; line-height: 1; letter-spacing: .02em; text-shadow: 0 0 9px var(--lcd-dim), 0 0 1px var(--lcd); font-variant-numeric: tabular-nums; }
.wa-of { font-size: 18px; line-height: 1; color: var(--lcd-dim); white-space: nowrap; }
.wa-of u { text-decoration: none; }
.wa-mode { flex: 0 0 auto; display: flex; gap: 4px; }
.wa-lk { height: 18px; padding: 0 7px 0 6px; display: flex; align-items: center; gap: 5px; border: 1px solid var(--lcd-faint); border-radius: 2px; cursor: pointer; color: var(--lcd-dim); background: rgba(0,0,0,.35);
  font: 700 9px/1 var(--mono); letter-spacing: .06em; box-shadow: inset 0 0 6px rgba(0,0,0,.6); }
.wa-lk i { width: 5px; height: 5px; border-radius: 50%; background: rgba(68,242,207,.18); }
.wa-lk:hover { color: var(--lcd); border-color: var(--lcd-dim); }
.wa-lk.active { color: var(--lcd); border-color: var(--lcd-dim); text-shadow: 0 0 5px var(--lcd-dim); }
.wa-lk.active i { background: var(--lcd); box-shadow: 0 0 5px var(--lcd); }

/* ───── star rating (left of SHUF/REP, same machine hardware) ─────
   Five LCD stars in one dark inset well, the exact materials of the .wa-lk
   mode keys next to it. Rated stars run on the LCD glass; the empty ones are
   an unlit stencil. Hover preview: .pv-add lights the glass, .pv-remove goes red. */
.wa-rate { flex: 0 0 auto; height: 18px; min-height: 0; margin: 0; padding: 0 3px; display: flex; align-items: center; gap: 0;
  border: 1px solid var(--lcd-faint); border-radius: 2px; background: rgba(0,0,0,.35);
  box-shadow: inset 0 0 6px rgba(0,0,0,.6); cursor: default; -webkit-app-region: no-drag; }
/* The engine sets [hidden] while no track is loaded. The well stays: hardware
   that is simply switched off (five unlit stars), so the key never disappears. */
.wa-rate[hidden] { display: flex; }
/* Fallback stars for a slot with no children (fresh start / static preview):
   same glyph, same mono font and the same 14px pitch as the real buttons. */
.wa-rate:empty::before { content: "★★★★★"; padding-left: 3px; font: 11px/16px var(--mono);
  letter-spacing: 7.35px; margin-right: -7.35px; color: rgba(68,242,207,.28); pointer-events: none; }
.wa-rate .rate-star { width: 14px; height: 16px; padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
  display: grid; place-items: center; color: rgba(68,242,207,.28); font: 11px/1 var(--mono);
  text-shadow: none; transition: color .08s linear; }
.wa-rate .rate-star.on { color: var(--lcd); text-shadow: 0 0 5px var(--lcd-dim); }
.wa-rate .rate-star.pv-add { color: var(--lcd); text-shadow: 0 0 5px var(--lcd-dim); opacity: .55; }
.wa-rate .rate-star.pv-remove { color: #ff7a45; text-shadow: 0 0 5px rgba(255,122,69,.45); }
.wa-rate .rate-star:focus-visible { outline: 1px solid var(--lcd); outline-offset: 0; }

.wa-title { flex: 0 0 18px; font: 700 14px/18px var(--mono); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 6px var(--lcd-dim); }
.wa-meta { flex: 0 0 16px; display: flex; align-items: center; font: 12px/16px var(--mono); color: var(--lcd-dim); }
.wa-meta [data-melo="artist"] { flex: 0 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-meta [data-melo="album"] { flex: 1 1 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-meta [data-melo="album"]:not(:empty)::before { content: " — "; white-space: pre; }
.wa-chips { flex: 0 0 auto; margin-left: 8px; display: flex; font: 700 8px/16px var(--mono); color: var(--lcd-dim); text-transform: uppercase; white-space: nowrap; }
.wa-chips span:empty { display: none; }
.wa-chips span:not(:empty) + span:not(:empty)::before { content: " · "; white-space: pre; }
.wa-lyric { flex: 0 0 16px; display: block; visibility: hidden; font: 12px/15px var(--mono); color: var(--lcd); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: linear-gradient(var(--lcd-dim), var(--lcd-dim)) left bottom / calc(var(--melo-lyric-progress, 0) * 100%) 1px no-repeat; }
.wa-lyric::before { content: "♪ "; opacity: .6; }
html.melo-lyric-skin-on .wa-lyric { visibility: visible; }
html.melo-lyric-skin-on .wa-lyric.melo-lyric-empty { visibility: hidden; }
.wa-lyric.melo-lyric-tick { animation: wa-in .22s ease-out both; }
@keyframes wa-in { from { opacity: 0; transform: translateX(5px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .wa-lyric.melo-lyric-tick { animation: none; } }

/* segmented LED spectrum: scan-line gaps + a green → amber → red ramp multiplied over the white bars */
.wa-spec { position: relative; flex: 1 1 0; min-height: 0; margin-top: 3px; border-radius: 2px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--lcd-faint); isolation: isolate; background: #020806; }
.wa-spec-in { position: absolute; inset: 3px; isolation: isolate; background: #020806; }
.wa-viz { position: absolute !important; inset: 0 !important; width: auto !important; height: auto !important; display: block !important; overflow: hidden !important; cursor: pointer; padding: 0 !important; }
.wa-viz canvas { width: 100% !important; height: 100% !important; display: block; filter: grayscale(1) brightness(2) contrast(1.15); }
.wa-spec-in::after { content: ""; position: absolute; inset: 0; mix-blend-mode: multiply; pointer-events: none;
  background: linear-gradient(to top, var(--lcd) 0 52%, #d9ee63 76%, #ff7a45 100%); }
.wa-spec::before { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.55) 0 1px, transparent 1px 3px); }

/* ───── seek fader ───── */
.wa-seekrow { flex: 0 0 16px; position: relative; display: flex; align-items: center; }
.wa-seek { width: 100%; height: 16px; margin: 0; padding: 0; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; outline: none; }
.wa-seek::-webkit-slider-runnable-track { height: 8px; border-radius: 2px; background: linear-gradient(to right, color-mix(in srgb, var(--lcd) 60%, #000) var(--progress,0%), var(--groove) var(--progress,0%)); box-shadow: inset 0 1px 3px rgba(0,0,0,.8), 0 1px 0 var(--hi), 0 0 0 1px var(--edge); }
.wa-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 16px; margin-top: -4px; border-radius: 3px; border: 1px solid var(--edge);
  background: linear-gradient(90deg, transparent calc(50% - 1px), var(--lcd) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)), repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 1px, rgba(255,255,255,.10) 1px 3px), var(--metal);
  box-shadow: inset 0 1px 0 var(--hi), 0 1px 3px rgba(0,0,0,.55); }
.wa-seek::-moz-range-track { height: 8px; border-radius: 2px; background: var(--groove); }
.wa-seek::-moz-range-thumb { width: 28px; height: 14px; border-radius: 3px; border: 1px solid var(--edge); background: var(--b2); }
[data-melo="waveform"] { --melo-wave-played: var(--lcd); --melo-wave-rest: rgba(68,242,207,.28); display: none; position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 3; overflow: visible; border-radius: 2px; background: var(--lcd-bg); box-shadow: 0 0 0 1px var(--edge); cursor: pointer; touch-action: none; -webkit-app-region: no-drag; }
html.melo-wave-on [data-melo="waveform"] { display: block; }
/* the black backdrop reaches 1px higher; the waveform canvases keep their size (the extra pixel is a pseudo-element outside the box) */
[data-melo="waveform"]::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: var(--lcd-bg); pointer-events: none; box-shadow: 0 -1px 0 var(--edge), -1px 0 0 var(--edge), 1px 0 0 var(--edge); }
[data-melo="waveform"] > * { max-height: 100%; }
[data-melo="waveform"] canvas, [data-melo="waveform"] svg { display: block; width: 100%; height: 100%; }
html.melo-wave-on .wa-seek { opacity: 0; pointer-events: none; }

/* ───── transport ───── */
.wa-ctl { flex: 0 0 34px; display: flex; align-items: center; gap: 0; }
.wa-key { position: relative; width: 40px; height: 34px; padding: 0; border: 1px solid var(--edge); border-radius: 0; cursor: pointer; color: var(--ink);
  display: grid; place-items: center; background: var(--metal); box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 rgba(0,0,0,.35), 0 1px 0 var(--hi); }
.wa-key + .wa-key { margin-left: -1px; }
.wa-key.first { border-radius: 4px 0 0 4px; } .wa-key.last { border-radius: 0 4px 4px 0; } .wa-key.solo { border-radius: 4px; }
.wa-key svg { width: 14px; height: 14px; filter: drop-shadow(0 1px 0 var(--hi)); }
.wa-key:hover { filter: brightness(1.12); z-index: 1; }
.wa-key:active { transform: translateY(1px); box-shadow: inset 0 2px 4px rgba(0,0,0,.6); filter: brightness(.9); }
.wa-key.play { width: 56px; }
.wa-key.play svg { width: 17px; height: 17px; }
.wa-body:has([data-melo="pause-icon"][style*="block"]) .wa-key.play { color: var(--lcd); background: linear-gradient(180deg, var(--lcd-bg), #0a1c17);
  box-shadow: inset 0 1px 4px rgba(0,0,0,.9), inset 0 -2px 0 var(--lcd), 0 1px 0 var(--hi); }
.wa-body:has([data-melo="pause-icon"][style*="block"]) .wa-key.play svg { filter: drop-shadow(0 0 4px var(--lcd-dim)); }
.wa-gap { flex: 0 0 12px; }
.wa-vol { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.wa-vol .ico { position: relative; width: 16px; height: 16px; color: var(--ink); cursor: pointer; }
.wa-vol .ico svg { position: absolute; inset: 0; width: 16px; height: 16px; }
.wa-vol .ico .mu { opacity: 0; } .wa-vol .ico.muted .mu { opacity: 1; } .wa-vol .ico.muted .wv { opacity: 0; }
.wa-volbar { width: 104px; height: 16px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; outline: none; }
.wa-volbar::-webkit-slider-runnable-track { height: 6px; border-radius: 2px; background: linear-gradient(to right, color-mix(in srgb, var(--lcd) 70%, #000) var(--vol,60%), var(--groove) var(--vol,60%)); box-shadow: inset 0 1px 3px rgba(0,0,0,.8), 0 1px 0 var(--hi), 0 0 0 1px var(--edge); }
.wa-volbar::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 16px; margin-top: -5px; border-radius: 2px; border: 1px solid var(--edge);
  background: linear-gradient(90deg, transparent calc(50% - .5px), var(--lcd) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)), var(--metal); box-shadow: inset 0 1px 0 var(--hi), 0 1px 2px rgba(0,0,0,.5); }
.wa-volbar::-moz-range-thumb { width: 10px; height: 14px; border-radius: 2px; border: 1px solid var(--edge); background: var(--b2); }
.wa-pct { min-width: 30px; font: 11px var(--mono); color: var(--mute); text-align: right; }

/* ───── embedded Lyrics / Queue: take over the LCD + cover area ───── */
.wa-panel { position: absolute; left: 6px; right: 6px; top: 6px; bottom: 72px; z-index: 20; display: none; flex-direction: column; border-radius: 3px; color: var(--lcd); overflow: hidden;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 1px, transparent 1px 3px), radial-gradient(120% 140% at 30% 0, #0a1d18, var(--lcd-bg) 70%);
  box-shadow: 0 0 0 1px var(--edge), inset 0 2px 8px rgba(0,0,0,.9); }
html.melo-show-lyrics .wa-panel, html.melo-show-playlist .wa-panel { display: flex; }
.wa-phead { flex: 0 0 22px; display: flex; align-items: center; padding: 0 12px; font: 700 10px/1 var(--mono); letter-spacing: .3em; border-bottom: 1px solid var(--lcd-faint); color: var(--lcd-dim); }
html.melo-show-playlist .wa-ptitle::after { content: "QUEUE"; } html.melo-show-lyrics .wa-ptitle::after { content: "LYRICS"; }
.wa-pbody { position: relative; flex: 1 1 auto; min-height: 0; }
.wa-pbody [data-melo="embedded-playlist"], .wa-pbody [data-melo="embedded-lyrics"] { display: none; height: 100%; }
html.melo-show-playlist .wa-pbody [data-melo="embedded-playlist"], html.melo-show-lyrics .wa-pbody [data-melo="embedded-lyrics"] { display: block; }
.wa-pbody .embedded-lyrics-title { display: none; }
.wa-pbody .embedded-playlist, .wa-pbody .embedded-lyrics { height: 100% !important; max-height: 100% !important; overflow-y: auto !important; overflow-x: hidden !important; padding: 3px 8px !important; scrollbar-width: thin; scrollbar-color: rgba(68,242,207,.4) transparent; }
.wa-pbody .embedded-playlist-mini .embedded-playlist-row { display: flex; align-items: center; gap: 8px; height: 20px; min-height: 20px; padding: 0 6px !important; color: var(--lcd); font: 12px/20px var(--mono) !important; border-radius: 2px; }
.wa-pbody .embedded-playlist-mini .embedded-playlist-row:hover { background: var(--lcd-faint); }
.wa-pbody .embedded-playlist-mini .embedded-playlist-row .t-title { font: 12px/20px var(--mono) !important; color: var(--lcd); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-pbody .embedded-playlist-mini .embedded-playlist-row.active { background: var(--lcd); }
.wa-pbody .embedded-playlist-mini .embedded-playlist-row.active .t-title { color: var(--lcd-bg); font-weight: 700 !important; }
.wa-pbody .embedded-playlist-mini .track-cover-mini { display: none !important; }
.wa-pbody .embedded-playlist-empty, .wa-pbody .embedded-playlist-more { font: 12px/20px var(--mono); color: var(--lcd-dim); background: transparent; border: 0; text-align: left; cursor: pointer; }
.wa-pbody .lyric-line { padding: 1px 6px; font: 13px/1.5 var(--mono); color: var(--lcd-dim); overflow-wrap: anywhere; }
.wa-pbody .lyric-line.active { color: var(--lcd-bg); background: var(--lcd); }
</style>
</head>
<body data-window-width="560" data-window-height="248" data-min-width="560" data-min-height="248" data-max-width="560" data-max-height="248" data-resizable="false">
<div id="melo-player">
  <div class="wa-case">

    <header class="wa-bar" data-tauri-drag-region>
      <span class="wa-brand">ME<i>L</i>O</span>
      <div class="wa-menu">
        <input class="wa-mchk" type="checkbox" id="wa-m" aria-label="File menu">
        <label class="wa-tx wa-mbtn" for="wa-m" title="File">File</label>
        <label class="wa-scrim" for="wa-m" aria-hidden="true"></label>
        <div class="wa-pop">
          <label class="wa-item" for="wa-m" data-melo="add-files">Open files…</label>
          <label class="wa-item" for="wa-m" data-melo="add-folder">Open folder…</label>
          <label class="wa-item" for="wa-m" data-melo="theme-toggle">Switch theme</label>
        </div>
      </div>
      <div class="wa-grp">
        <button class="wa-tx stage-btn" data-melo="toggle-embedded-lyrics" title="Lyrics on the display">Lyrics</button>
        <button class="wa-tx stage-btn" data-melo="toggle-embedded-playlist" title="Queue on the display">Queue</button>
      </div>
      <span class="wa-spacer" data-tauri-drag-region></span>
      <div class="wa-grp">
        <button class="wa-tx wa-ic" data-melo="toggle-library" title="Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M10 6v14M15 4.5l4 15"/></svg></button>
        <button class="wa-tx wa-ic" data-melo="toggle-playlist" title="Playlist window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg></button>
        <button class="wa-tx wa-ic" data-melo="toggle-eq" title="Equalizer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="14" r="2" fill="currentColor"/><circle cx="12" cy="8" r="2" fill="currentColor"/><circle cx="18" cy="15" r="2" fill="currentColor"/></svg></button>
        <button class="wa-tx wa-ic" data-melo="toggle-lyrics" title="Lyrics window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6l-4 3v-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M8 10h8M8 13h5"/></svg></button>
        <button class="wa-tx wa-ic" data-melo="toggle-settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      </div>
      <span class="wa-sep"></span>
      <div class="wa-grp">
        <button class="wa-tx wa-ic wa-win" data-melo="minimize" aria-label="minimize" title="Minimize"><svg viewBox="0 0 10 10" fill="currentColor"><rect x="1" y="7" width="8" height="2"/></svg></button>
        <button class="wa-tx wa-ic wa-win close" data-melo="close" aria-label="close" title="Close"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
      </div>
    </header>

    <div class="wa-body">
      <div class="wa-top">
        <div class="wa-cover">
          <img data-melo="cover" id="coverImg" alt="cover" style="display:none">
          <div class="fb" data-melo="cover-fallback" id="coverFallback">♪</div>
        </div>

        <section class="wa-lcd">
          <div class="wa-row1">
            <div class="wa-time">
              <span class="wa-state" aria-hidden="true">
                <svg class="pl" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.5v11l9-5.5z"/></svg>
                <svg class="pa" viewBox="0 0 14 14" fill="currentColor"><rect x="2.5" y="1.5" width="3.2" height="11"/><rect x="8.3" y="1.5" width="3.2" height="11"/></svg>
              </span>
              <b class="wa-cur" data-melo="current-time" id="curTime">0:00</b>
              <span class="wa-of">/ <u data-melo="duration" id="durTime">0:00</u></span>
            </div>
            <div class="wa-mode">
              <div class="wa-rate" id="trackRating" data-melo="rating" aria-label="Rating"></div>
              <button class="wa-lk" data-melo="shuffle" id="btnShuffle" title="Shuffle"><i></i>SHUF</button>
              <button class="wa-lk" data-melo="repeat" id="btnRepeat" title="Repeat"><i></i>REP</button>
            </div>
          </div>
          <div class="wa-title" data-melo="title" id="trackTitle">No track loaded</div>
          <div class="wa-meta">
            <span data-melo="artist" id="trackArtist">Add music to start playing</span>
            <span data-melo="album" id="trackAlbum"></span>
            <div class="wa-chips"><span data-melo="codec"></span><span data-melo="specs"></span></div>
          </div>
          <div class="wa-lyric" data-melo="current-lyric" title="Click to seek" aria-live="polite"></div>
          <div class="wa-spec"><div class="wa-spec-in"><div class="wa-viz" data-melo="visualizer" id="vizBars" data-bars="48"></div></div></div>
        </section>
      </div>

      <div class="wa-seekrow">
        <div data-melo="waveform"></div>
        <input class="wa-seek" type="range" data-melo="seek" id="seekBar" min="0" max="100" value="0" aria-label="Seek">
      </div>

      <div class="wa-ctl">
        <button class="wa-key first" data-melo="prev" id="btnPrev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="3" height="14"/><path d="M20 5v14L9 12z"/></svg></button>
        <button class="wa-key play" data-melo="play" id="btnPlay" title="Play / Pause">
          <svg data-melo="pause-icon" id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>
          <svg data-melo="play-icon" id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.5v17L21 12z"/></svg>
        </button>
        <button class="wa-key" data-melo="stop" id="btnStop" title="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14"/></svg></button>
        <button class="wa-key last" data-melo="next" id="btnNext" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5v14l11-7z"/><rect x="17" y="5" width="3" height="14"/></svg></button>
        <span class="wa-gap"></span>
        <button class="wa-key solo" data-melo="add-files" title="Open files"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4 3 15h18z"/><rect x="3" y="17.5" width="18" height="3"/></svg></button>
        <div class="wa-vol">
          <span class="ico" id="volIcon" data-melo="volume-icon" title="Mute">
            <svg class="wv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg>
            <svg class="mu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/></svg>
          </span>
          <input class="wa-volbar" type="range" id="volBar" data-melo="volume" min="0" max="100" value="60" aria-label="Volume">
          <span class="wa-pct" data-melo="volume-pct" id="volPct"></span>
        </div>
      </div>

      <div class="wa-panel">
        <div class="wa-phead"><span class="wa-ptitle"></span></div>
        <div class="wa-pbody">
          <div data-melo="embedded-playlist"></div>
          <div data-melo="embedded-lyrics"></div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
