<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Melo v0.5 — Microline Skin</title>
<meta name="melo-window" content="width=1200, height=50, minWidth=1000, minHeight=50, maxWidth=1600, maxHeight=50, resizable=true, transparent=true" />
<style>
  :root {
    --ml-bg: #f5f6f8;
    --ml-surface: #ffffff;
    --ml-line: rgba(29,39,52,.09);
    --ml-text: #202936;
    --ml-soft: #6d7a8a;
    --ml-muted: #9aa4b1;
    --accent: #377fca;
    --visualizer: #5ea0e6;
    --track-bg: rgba(38,52,69,.075);
  }
  [data-theme="dark"] {
    --ml-bg: #151b23;
    --ml-surface: #1c2531;
    --ml-line: rgba(255,255,255,.075);
    --ml-text: #edf3fa;
    --ml-soft: #9cadc1;
    --ml-muted: #6e8198;
    --track-bg: rgba(255,255,255,.065);
  }

  * { box-sizing: border-box; }
  body:not(.tauri-main) {
    min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center;
    overflow: hidden; background: #0c1118; font-family: Inter,"Segoe UI",system-ui,sans-serif;
  }

  #melo-player,
  body.tauri-main .player-card {
    width: min(1200px,100%); height: 50px; min-height: 50px; max-height: 50px;
    margin: 0; padding: 0; overflow: hidden; color: var(--ml-text); background: var(--ml-bg);
    border: 1px solid var(--ml-line); border-radius: 14px; box-shadow: 0 14px 36px rgba(20,33,48,.2);
    font-family: Inter,"Segoe UI",system-ui,sans-serif;
  }
  body.tauri-main,
  body.tauri-main .app-shell { min-width: 0 !important; }
  body.tauri-main .player-card {
    width: 100% !important; height: 50px !important; min-height: 50px !important;
    max-height: 50px !important; padding: 0 !important; border-radius: 14px !important; box-shadow: none !important;
  }
  body.tauri-main .ml-viz.visualizer-bars { display: block !important; }

  .ml-row {
    width: 100%; height: 48px; min-width: 0; padding: 4px 6px;
    display: grid;
    grid-template-columns: 104px 40px minmax(125px,1fr) auto minmax(150px,1.25fr) minmax(92px,.72fr) minmax(72px,.68fr) auto 64px;
    gap: 5px; align-items: center; -webkit-app-region: no-drag; user-select: none;
  }
  button, input, .ml-cover, .ml-meta, .ml-seek, .ml-media, .ml-viz, .ml-panels, .ml-brand-zone, .win-controls { -webkit-app-region: no-drag; }

  .ml-brand-zone { width: 104px; min-width: 104px; padding-right: 10px; display: flex; align-items: center; gap: 3px; position: relative; -webkit-app-region: no-drag; }
  .ml-drag-handle {
    width: 7px; height: 22px; flex: 0 0 7px; border-radius: 4px;
    -webkit-app-region: drag; cursor: move;
    background: radial-gradient(circle,var(--ml-muted) 1px,transparent 1.2px) center/4px 5px;
    opacity: .55;
  }
  .ml-drag-right { margin-left: 3px; }
  .ml-win-sep { width: 1px; height: 14px; flex: 0 0 1px; margin-right: 3px; background: var(--ml-line); }
  .ml-brand-menu { height: 26px; display: flex; align-items: center; position: relative; }
  .ml-brand-menu > summary { list-style: none; }
  .ml-brand-menu > summary::-webkit-details-marker { display: none; }
  .ml-brand {
    height: 24px; padding: 0 5px; border: 0; border-radius: 7px;
    display: flex; align-items: center; gap: 5px; color: var(--ml-text);
    background: transparent; cursor: pointer; font-size: 9px; font-weight: 820; letter-spacing: .1em;
  }
  .ml-brand:hover, .ml-brand-menu[open] .ml-brand { background: var(--track-bg); }
  .ml-brand svg { flex: 0 0 auto; color: var(--accent); }
  .ml-brand-chev { color: var(--ml-muted); font-size: 7px; }
  .ml-menu-items {
    position: absolute; left: 55px; top: -7px; z-index: 30; height: 40px;
    padding: 4px; display: flex; align-items: center; gap: 3px;
    border: 1px solid var(--ml-line); border-radius: 10px;
    background: color-mix(in srgb,var(--ml-surface) 94%,transparent);
    box-shadow: 0 8px 24px rgba(20,31,45,.2); backdrop-filter: blur(16px);
    opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(-4px);
    transition: opacity .12s ease,transform .12s ease,visibility .12s;
  }
  .ml-brand-menu[open] .ml-menu-items {
    opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(0);
  }
  .ml-menu-item {
    height: 30px; padding: 0 8px; border: 0; border-radius: 7px;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    color: var(--ml-soft); background: transparent; cursor: pointer; font-size: 8px; font-weight: 650;
  }
  .ml-menu-item:hover { color: var(--ml-text); background: var(--track-bg); }
  .ml-menu-item svg { width: 11px; height: 11px; }
  .ml-panels, .win-controls { display: flex; align-items: center; gap: 2px; }
  .ml-btn, .ml-panel, .win-btn {
    width: 22px; height: 22px; min-width: 22px; padding: 0; border: 0; border-radius: 6px;
    display: grid; place-items: center; color: var(--ml-soft); background: transparent; cursor: pointer;
  }
  .ml-btn:hover, .ml-panel:hover, .win-btn:hover { color: var(--ml-text); background: var(--track-bg); }
  .ml-panel.active { color: white; background: var(--accent); }
  .ml-btn svg, .ml-panel svg { width: 11px; height: 11px; }
  .win-btn.close:hover { color: white; background: #df5065; }

  .ml-cover {
    width: 40px; height: 40px; overflow: hidden; border-radius: 9px 15px 9px 9px;
    background: var(--track-bg); box-shadow: 0 4px 12px rgba(25,37,51,.15);
  }
  .ml-cover img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .cover-fallback {
    width: 100%; height: 100%; display: grid; place-items: center; color: white; font-size: 16px;
    background: linear-gradient(140deg,color-mix(in srgb,var(--accent) 68%,#82b7ce),#9b82c6 56%,#e89b89);
  }

  .ml-meta { min-width: 0; height: 32px; display: flex; flex-direction: column; justify-content: center; gap: 2px; overflow: hidden; white-space: nowrap; }
  .track-title { width: 100%; overflow: hidden; text-overflow: ellipsis; color: var(--ml-text); font-size: 10px; line-height: 1.15; font-weight: 760; }
  .track-artist { width: 100%; overflow: hidden; text-overflow: ellipsis; color: color-mix(in srgb,var(--accent) 38%,var(--ml-text)); font-size: 8px; line-height: 1.1; font-weight: 650; }
  .track-album, .track-format { display: none; }

  .ml-seek { min-width: 0; height: 29px; margin: 0 !important; align-self: center; display: grid; grid-template-columns: 26px minmax(70px,1fr) 26px; gap: 4px; align-items: center; }
  .ml-time { color: var(--ml-muted); font: 500 8px/1 ui-monospace,"Cascadia Mono",monospace; font-variant-numeric: tabular-nums; }
  #durTime { text-align: right; }
  .seek, .vol {
    -webkit-appearance: none; appearance: none; height: 3px; border-radius: 999px; outline: none; cursor: pointer;
    background: linear-gradient(to right,var(--accent) 0%,var(--accent) var(--progress,0%),var(--track-bg) var(--progress,0%),var(--track-bg) 100%);
  }
  .seek::-webkit-slider-thumb, .vol::-webkit-slider-thumb {
    -webkit-appearance: none; width: 9px; height: 9px; border: 2px solid var(--ml-bg); border-radius: 50%; background: var(--accent);
  }

  .transport { display: flex; align-items: center; justify-content: center; gap: 1px; }
  .transport button {
    width: 25px; height: 25px; padding: 0; border: 0; border-radius: 7px;
    display: grid; place-items: center; color: var(--ml-soft); background: transparent; cursor: pointer;
  }
  .transport button:hover { color: var(--ml-text); background: var(--track-bg); }
  .transport button.active { color: var(--accent); background: color-mix(in srgb,var(--accent) 10%,transparent); }
  .transport svg { width: 12px; height: 12px; }
  .transport .play-btn { width: 32px; height: 32px; border-radius: 50%; color: white; background: var(--accent); }
  .transport .play-btn:hover { color: white; background: color-mix(in srgb,var(--accent) 88%,black); }
  .transport .play-btn svg { width: 14px; height: 14px; }
  #btnStop { display: none; }
  body.show-stop-btn #btnStop { display: grid !important; }

  .ml-viz { min-width: 0; width: 100%; height: 29px; overflow: hidden; cursor: pointer; -webkit-app-region: no-drag; touch-action: manipulation; }
  .ml-viz canvas { width: 100% !important; height: 100% !important; display: block; pointer-events: none; }

  .ml-media { min-width: 0; display: grid; grid-template-columns: 13px minmax(48px,1fr) 22px; gap: 4px; align-items: center; }
  #volIcon { display: grid; place-items: center; color: var(--ml-soft); cursor: pointer; }
  #volIcon:hover { color: var(--accent); }
  .vol { width: 100%; background: linear-gradient(to right,var(--accent) 0%,var(--accent) var(--vol,60%),var(--track-bg) var(--vol,60%),var(--track-bg) 100%); }
  #volPct { color: var(--ml-muted); text-align: right; font: 500 8px/1 ui-monospace,monospace; }

  @media (max-width: 1080px) {
    .ml-row { grid-template-columns: 104px 40px minmax(105px,.8fr) auto minmax(135px,1fr) minmax(82px,.6fr) minmax(62px,.5fr) auto 64px; gap: 3px; }
  }
</style>
</head>
<body>
<div id="melo-player">
  <div class="ml-row">
    <div class="ml-brand-zone">
      <span class="ml-drag-handle" data-tauri-drag-region title="Drag window"></span>
      <details class="ml-brand-menu">
        <summary class="ml-brand">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M2 12h2l1-7 2 14 3-10 2 6h2l2-9 2 14 2-7h2"/></svg>
          MELO <span class="ml-brand-chev">▾</span>
        </summary>
        <div class="ml-menu-items">
          <button class="ml-menu-item" id="btnAddFiles" title="Open files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 12v6M9 15h6"/></svg>Open Files</button>
          <button class="ml-menu-item" id="btnAddFolder" title="Open folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Folder</button>
        </div>
      </details>
      <button class="ml-btn" id="btnThemeToggle" title="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/></svg></button>
    </div>

    <div class="ml-cover" id="coverWrap">
      <img id="coverImg" style="display:none" alt="Album artwork" />
      <div id="coverFallback" class="cover-fallback">♪</div>
    </div>

    <div class="ml-meta">
      <span class="track-title" id="trackTitle">No track</span>
      <span class="track-artist" id="trackArtist">No artist</span>
      <span class="track-album" id="trackAlbum"></span>
      <span class="track-format"><span id="trackCodec">—</span><span id="trackSpecs"></span></span>
    </div>

    <div class="transport">
      <button id="btnShuffle" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20l8-8M21 3l-8 8M16 21h5v-5M4 4l5 5M9 15l-5 5"/></svg></button>
      <button id="btnPrev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="btnStop" title="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button class="play-btn" id="btnPlay" title="Play / Pause"><svg id="iconPause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="btnNext" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button id="btnRepeat" title="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
    </div>

    <div class="ml-seek seek-row">
      <span class="ml-time" id="curTime">0:00</span>
      <input class="seek" id="seekBar" type="range" min="0" max="100" value="0" />
      <span class="ml-time" id="durTime">0:00</span>
    </div>

    <div class="ml-media volume-row">
      <span id="volIcon" title="Mute"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.08"/></svg></span>
      <input class="vol" id="volBar" type="range" min="0" max="100" value="60" />
      <span id="volPct">60%</span>
    </div>

    <div class="ml-viz visualizer-bars" id="vizBars"></div>

    <div class="ml-panels">
      <button class="ml-panel" id="btnToggleLibrary" title="Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></svg></button>
      <button class="ml-panel" id="btnTogglePlaylist" title="Playing Queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15V6M12 12H3M16 6H3M12 18H3"/><circle cx="18.5" cy="18" r="2.5"/></svg></button>
      <button class="ml-panel" id="btnToggleEq" title="Equalizer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <button class="ml-panel" id="btnToggleLyrics" title="Lyric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
      <button class="ml-panel" id="btnOpenSettings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l-2.86 2.86A1.7 1.7 0 0 0 15 19.4 1.7 1.7 0 0 0 14 21h-4a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.88.34l-2.86-2.86A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3 14v-4a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.34-1.88l2.86-2.86A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3h4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.88-.34l2.86 2.86A1.7 1.7 0 0 0 19.4 9 1.7 1.7 0 0 0 21 10v4a1.7 1.7 0 0 0-1.6 1z"/></svg></button>
    </div>

    <div class="win-controls">
      <span class="ml-win-sep"></span>
      <button class="win-btn" aria-label="minimize" title="Minimize">—</button>
      <button class="win-btn close" aria-label="close" title="Close">×</button>
      <span class="ml-drag-handle ml-drag-right" data-tauri-drag-region title="Drag window"></span>
    </div>
  </div>
</div>
</body>
</html>
