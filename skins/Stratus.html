<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melo — Stratus</title>
<style>
/* ─────────────────────────────────────────────────────────────
   Stratus
   A refined pass on Stratus (same three-card layout, same hooks):
     · the "Now playing" label is now truthful — equalizer bars + "Now playing" while playing,
       a still dim glyph + "Paused" otherwise
     · seek / volume handles appear only on hover, drag or keyboard focus
     · cards get a little depth (top highlight, soft lift on the cover) instead of flat hairlines
     · play / pause icons start in the right state before the engine's first tick
     · RTL-safe text (Persian / Arabic titles, artists, lyrics and queue rows)
   Original description:
   Keeps the default skin's calm sky-blue character, but rebuilds the layout:
   the one crowded card becomes three cards (cover · info · stage) on a soft
   canvas, and every control moves into a single dock along the bottom, so the
   transport, the seek bar and the volume sit on one line instead of three
   places. Stage views are a pill switch in the title bar.
   ───────────────────────────────────────────────────────────── */
@font-face {
  /* the engine writes the volume as "60%"; this face scales only the % sign to nothing */
  font-family: "st-no-percent";
  src: local("Segoe UI"), local("Arial"), local("Helvetica Neue"), local("Helvetica"), local("Liberation Sans"), local("DejaVu Sans");
  unicode-range: U+0025;
  size-adjust: 0%;
}

:root,
:root[data-theme="dark"] {
  --st-canvas: #0e141d;
  --st-card: #18212d;
  --st-card-2: #1e2938;
  --st-ink: #e8eff8;
  --st-ink-2: #a3b3c9;
  --st-ink-3: #74869f;
  --st-line: rgba(255,255,255,.07);
  --st-hover: rgba(255,255,255,.07);
  --st-track: rgba(255,255,255,.14);
  --st-accent: var(--accent, #5aa9ff);
  --st-danger: #ff6b6b;
}
:root[data-theme="light"] {
  --st-canvas: #dde7f1;
  --st-card: #ffffff;
  --st-card-2: #f3f7fb;
  --st-ink: #15202d;
  --st-ink-2: #51637b;
  --st-ink-3: #7f90a6;
  --st-line: rgba(21,32,45,.08);
  --st-hover: rgba(21,32,45,.06);
  --st-track: rgba(21,32,45,.13);
  --st-accent: var(--accent, #2a7bd6);
  --st-danger: #d13438;
}
.st-root {
  --st-on-accent: #fff;
  --st-on-accent: oklch(from var(--st-accent) clamp(0, (0.7 - l) * 1000, 1) 0 0);
  --st-accent-text: color-mix(in srgb, var(--st-accent) 70%, var(--st-ink));
  --st-wash: color-mix(in srgb, var(--st-accent) 13%, transparent);
  --st-tint: color-mix(in srgb, var(--st-accent) 9%, var(--st-card));
  --st-sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --st-dock: 72px;
  --st-r: 20px;
  color-scheme: dark;
}
:root[data-theme="light"] .st-root { color-scheme: light; }

/* ── Shell ── */
body:not(.tauri-main):has(#melo-player) {
  min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #070b11;
}
:root[data-theme="light"] body:not(.tauri-main):has(#melo-player) { background: #b8c8da; }

#melo-player,
body.tauri-main .player-card,
body.custom-skin-active .player-card {
  position: relative;
  width: 820px; height: 430px;
  min-width: 580px; min-height: 300px;
  overflow: hidden; color: var(--st-ink);
  background: var(--st-canvas);
  border: 1px solid var(--st-line); border-radius: 22px; box-shadow: none;
}
body.tauri-main,
body.tauri-main .app-shell { min-width: 0 !important; }
body.tauri-main .player-card,
body.custom-skin-active .player-card {
  width: 100% !important; height: 100vh !important;
  min-width: 580px !important; min-height: 300px !important;
  max-width: 1100px !important; max-height: 620px !important;
  margin: 0 auto !important; border-radius: 22px !important; box-shadow: none !important;
}

.st-root, .st-root *, .st-root *::before, .st-root *::after { box-sizing: border-box; }
.st-root {
  position: absolute; inset: 0;
  display: grid; grid-template-rows: 40px minmax(0, 1fr) var(--st-dock); row-gap: 10px;
  padding: 0 12px 12px;
  container: strt / size;
  font-family: var(--st-sans); font-size: 13px; line-height: 1.4;
  color: var(--st-ink); background: var(--st-canvas);
  -webkit-font-smoothing: antialiased;
}
:where(.st-root button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
.st-root svg { display: block; }
.st-sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); opacity: 0; }

.st-root button:focus-visible,
.st-root input[type="range"]:focus-visible,
.st-sr:focus-visible + .st-round { outline: 2px solid var(--st-accent-text); outline-offset: 2px; }

/* ── Title bar ── */
.st-titlebar { display: flex; align-items: center; gap: 4px; padding: 0 0 0 6px; }
.st-brand { display: flex; align-items: center; gap: 8px; padding-right: 14px; font-weight: 700; font-size: 14px; letter-spacing: -.02em; user-select: none; }
.st-logo { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--st-accent); color: var(--st-on-accent); }
.st-logo svg { width: 13px; height: 13px; }

.st-switch { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--st-card); box-shadow: inset 0 0 0 1px var(--st-line); -webkit-app-region: no-drag; }
.st-seg { height: 26px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--st-ink-2); transition: background .15s ease, color .15s ease; -webkit-app-region: no-drag; }
.st-seg svg { width: 14px; height: 14px; }
.st-seg:hover { color: var(--st-ink); background: var(--st-hover); }
.st-seg.active { background: var(--st-accent); color: var(--st-on-accent); }
.st-drag { flex: 1 1 auto; align-self: stretch; min-width: 8px; }

.st-round { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--st-ink-2); cursor: pointer; transition: background .15s ease, color .15s ease; -webkit-app-region: no-drag; }
.st-round svg { width: 16px; height: 16px; }
.st-round:hover { background: var(--st-card); color: var(--st-ink); }
.st-round:active { background: var(--st-hover); }
.st-root:has(#stMenu:checked) .st-round[for="stMenu"] { background: var(--st-card); color: var(--st-ink); }
.st-round.close:hover { background: #d9453a; color: #fff; }
.st-titlebar .gap { width: 6px; }

/* ── Bento ── */
.st-bento {
  display: grid; min-height: 0; min-width: 0; gap: 10px;
  /* cqh/cqw resolve against .st-root. 134px = title bar 40 + dock 72 + two row gaps 20 + bottom pad 12, minus the 10px gap counted once */
  grid-template-columns: clamp(140px, min(calc(100cqh - 134px), 38cqw), 420px) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
}
.st-card { position: relative; min-width: 0; min-height: 0; background: var(--st-card); border-radius: var(--st-r); box-shadow: inset 0 0 0 1px var(--st-line), inset 0 1px 0 color-mix(in srgb, var(--st-ink) 5%, transparent); }

/* Cover: fills its card */
.st-cover-card { overflow: hidden; background: var(--st-card-2); box-shadow: inset 0 0 0 1px var(--st-line), 0 14px 30px -16px rgba(0,0,0,.55); }
.st-cover-card::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset 0 -40px 50px -40px rgba(0,0,0,.35); }
.st-cover-card img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
.st-cover-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--st-ink-3); }
.st-cover-fallback svg { width: 34%; height: 34%; }

/* One main card: the track details sit directly on the stage, no box in a box */
.st-main {
  overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr);
  background: radial-gradient(110% 70% at 50% 130%, color-mix(in srgb, var(--st-accent) 15%, transparent), transparent 62%), var(--st-card);
}
.st-info { position: relative; z-index: 3; padding: 16px 18px 4px; display: grid; row-gap: 2px; min-width: 0; }
.st-kicker { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.st-kicker-label { display: inline-flex; align-items: center; gap: 7px; font-size: 0; font-weight: 600; color: var(--st-ink-3); }
.st-kicker-label::before { content: ""; width: 12px; height: 11px; flex: 0 0 12px;
  background: linear-gradient(currentColor, currentColor) 0 100% / 2px 35% no-repeat,
              linear-gradient(currentColor, currentColor) 5px 100% / 2px 35% no-repeat,
              linear-gradient(currentColor, currentColor) 10px 100% / 2px 35% no-repeat; }
.st-kicker-label::after { content: "Paused"; font-size: 11px; line-height: 1; }
.st-root:has([data-melo="pause-icon"][style*="block"]) .st-kicker-label { color: var(--st-accent-text); }
.st-root:has([data-melo="pause-icon"][style*="block"]) .st-kicker-label::before { animation: st-eq 1.1s ease-in-out infinite; }
.st-root:has([data-melo="pause-icon"][style*="block"]) .st-kicker-label::after { content: "Now playing"; }
@keyframes st-eq {
  0%, 100% { background-size: 2px 30%, 2px 85%, 2px 50%; }
  33%      { background-size: 2px 90%, 2px 40%, 2px 80%; }
  66%      { background-size: 2px 55%, 2px 100%, 2px 35%; }
}
.st-chips { display: flex; gap: 6px; min-width: 0; }
.st-chip { padding: 0 8px; line-height: 20px; font-size: 11px; font-weight: 600; border-radius: 999px; background: var(--st-hover); color: var(--st-ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.st-chip.codec { background: var(--st-wash); color: var(--st-accent-text); font-weight: 700; }
.st-chip:empty { display: none; }
.st-title, .st-sub > span, .st-stage .lyric-line, .st-stage .embedded-playlist-row .t-title, .st-stage .embedded-playlist-row .t-artist, .st-lyric-block [data-melo="current-lyric"], .st-lyric-block [data-melo="next-lyric"] { unicode-bidi: plaintext; }
.st-title { font-size: clamp(16px, 2.3cqw, 19px); font-weight: 700; line-height: 1.25; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-sub { font-size: 12.5px; color: var(--st-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-album:not(:empty)::before { content: ""; display: inline-block; width: 3px; height: 3px; margin: 0 9px; vertical-align: 3px; border-radius: 50%; background: var(--st-ink-3); }

/* ── Star rating: right of the track title ──
   The engine fills [data-melo="rating"] with five button.rate-star stars and
   adds .track-rating. Deliberately bare (no pill): the title line stays quiet,
   the stars carry the accent only when they are lit. */
.st-titlerow { display: flex; align-items: center; gap: 12px; min-width: 0; }
.st-titlerow .st-title { flex: 1 1 auto; min-width: 0; }
.st-rate { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; margin: 0; min-height: 0; height: 22px; -webkit-app-region: no-drag; }
/* no track / nothing rendered yet: take no space at all (app.css keeps a
   `.track-rating[hidden]` spacer row for the default layout — this rule wins
   because the skin's style sits later in the cascade) */
.st-rate[hidden]:empty, .st-rate:empty { display: none; }
.st-rate .rate-star { width: 17px; height: 22px; padding: 0; margin: 0; border: 0; border-radius: 7px; background: none;
  display: grid; place-items: center; font-size: 15px; line-height: 1; cursor: pointer;
  color: var(--st-ink-3); opacity: .55;
  transition: color .15s ease, opacity .15s ease, transform .12s ease; }
.st-rate .rate-star:hover { opacity: .9; transform: scale(1.12); }
.st-rate .rate-star.on { color: var(--st-accent); opacity: 1; filter: drop-shadow(0 2px 7px color-mix(in srgb, var(--st-accent) 40%, transparent)); }
.st-rate .rate-star.pv-add { color: var(--st-accent); opacity: .5; transform: scale(1.06); }
.st-rate .rate-star.pv-remove { color: var(--st-danger); opacity: .5; }
.st-rate .rate-star:focus-visible { outline: 2px solid var(--st-accent-text); outline-offset: 1px; }

/* Stage: the lower part of the main card */
.st-stage {
  position: relative; min-height: 0; min-width: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto;
  /* the app's own queue / lyrics rules read these */
  --text: var(--st-ink); --text-soft: var(--st-ink-2); --text-muted: var(--st-ink-3); --track-bg: var(--st-hover);
  container: stage / size;
}
.st-viz {
  grid-row: 1; position: relative !important; inset: auto !important; width: auto !important; height: auto !important;
  min-height: 0; margin: 8px 18px 10px; align-self: stretch; justify-self: stretch;
  display: block !important; overflow: hidden !important; cursor: pointer;
}
.st-viz canvas { display: block; width: 100% !important; height: 100% !important; }
html.melo-show-playlist .st-viz,
html.melo-show-lyrics .st-viz { display: none !important; }

/* Lyric reel: two rows that roll up together (needs data-melo-lyric-prev for the exiting copy) */
.st-lyric-block { grid-row: 2; display: none; min-width: 0; height: 46px; margin: 0 18px 14px; }
html.melo-lyric-skin-on.melo-has-synced-lyrics:not(.melo-show-lyrics):not(.melo-show-playlist) .st-lyric-block { display: block; }
.st-lyric-block [data-melo="current-lyric"],
.st-lyric-block [data-melo="next-lyric"] { position: relative; display: block; box-sizing: border-box; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
.st-lyric-block [data-melo="current-lyric"] {
  height: 26px; font-size: 15px; font-weight: 600; line-height: 22px; color: var(--st-ink);
  background: linear-gradient(var(--st-accent), var(--st-accent)) left bottom / calc(var(--melo-lyric-progress, 0) * 100%) 2px no-repeat;
}
.st-lyric-block [data-melo="next-lyric"] { height: 18px; font-size: 12px; font-weight: 500; line-height: 18px; color: var(--st-ink-3); opacity: 1; }
.st-lyric-block [data-melo-lyric-prev]::before {
  content: attr(data-melo-lyric-prev); position: absolute; left: 0; right: 0; top: 0; opacity: 0; pointer-events: none;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.st-lyric-block [data-melo="current-lyric"].melo-lyric-tick { animation: st-in-current .42s cubic-bezier(.22,.8,.2,1) .07s both; }
.st-lyric-block [data-melo="next-lyric"].melo-lyric-tick { animation: st-in-next .42s cubic-bezier(.22,.8,.2,1) .07s both; }
.st-lyric-block .melo-lyric-tick[data-melo-lyric-prev]::before { animation: st-out .3s cubic-bezier(.4,0,.8,.6) both; }
@keyframes st-in-current { from { padding-top: 26px; color: var(--st-ink-3); font-size: 12px; } to { padding-top: 0; color: var(--st-ink); font-size: 15px; } }
@keyframes st-in-next { from { padding-top: 18px; } to { padding-top: 0; } }
@keyframes st-out { from { transform: none; opacity: 1; } 65% { opacity: 0; } to { transform: translateY(-115%); opacity: 0; } }

/* Embedded queue + lyrics */
.st-stage [data-melo="embedded-playlist"],
.st-stage [data-melo="embedded-lyrics"] { position: absolute; z-index: 4; inset: 0; display: none; padding: 0; overflow: hidden; }
html.melo-show-playlist .st-stage [data-melo="embedded-playlist"],
html.melo-show-lyrics .st-stage [data-melo="embedded-lyrics"] { display: block; }
.st-stage .embedded-playlist,
.st-stage .embedded-lyrics { height: 100% !important; max-height: 100% !important; overflow-y: auto !important; overflow-x: hidden !important; padding: 6px 10px 10px; font-size: 12px !important; color: var(--st-ink); }
.st-stage .embedded-lyrics { padding: 8px 22px 22px; font-size: 14px !important; }
.st-stage .embedded-playlist-row, .st-stage .embedded-playlist-row .t-title, .st-stage .embedded-playlist-row .t-dur, .st-stage .embedded-playlist-row .ep-meta { color: inherit; }
.st-stage .embedded-playlist-row { position: relative; min-height: 38px; padding: 4px 12px; border-radius: 12px; color: var(--st-ink-2); transition: background .12s ease; }
.st-stage .embedded-playlist-row:hover { background: var(--st-hover); color: var(--st-ink); }
.st-stage .embedded-playlist-row.active { background: var(--st-wash); color: var(--st-ink); }
.st-stage .embedded-playlist-row .t-title { font-size: 12.5px; font-weight: 600; }
.st-stage .embedded-playlist-row .t-artist { font-size: 11px; color: var(--st-ink-3); }
.st-stage .embedded-playlist-empty, .st-stage .embedded-lyrics-title { color: var(--st-ink-3); }
.st-stage .lyric-line { font-size: 14px; font-weight: 500; line-height: 1.55; padding: 2px 8px; border-radius: 8px; text-align: left; color: var(--st-ink-3); }
.st-stage .lyric-line.passed { color: var(--st-ink-3); }
.st-stage .lyric-line:hover { color: var(--st-ink-2); }
.st-stage .lyric-line.active { color: var(--st-ink); font-weight: 700; }
.st-stage ::-webkit-scrollbar { width: 8px; }
.st-stage ::-webkit-scrollbar-track { background: transparent; }
.st-stage ::-webkit-scrollbar-thumb { background: var(--st-track); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }

/* Short stages: lyric preview first, then the viz's air */
@container stage (max-height: 130px) { .st-lyric-block { height: 26px; } .st-lyric-block [data-melo="next-lyric"] { display: none !important; } }
@container stage (max-height: 112px) { .st-viz { display: none !important; } }

/* ── Dock: transport · seek · volume on one line ── */
.st-dock {
  position: relative; z-index: 6; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 20px;
  padding: 0 18px; border-radius: var(--st-r);
}
.st-transport { display: flex; align-items: center; gap: 2px; }
.st-transport button { flex: 0 0 auto; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--st-ink-2); transition: background .15s ease, color .15s ease, transform .1s ease; -webkit-app-region: no-drag; }
.st-transport button svg { width: 17px; height: 17px; }
.st-transport button:hover { background: var(--st-hover); color: var(--st-ink); }
.st-transport button:active { transform: scale(.92); }
.st-transport button.active { background: var(--st-wash); color: var(--st-accent-text); }
.st-transport .play { width: 46px; height: 46px; margin: 0 4px; background: var(--st-accent); color: var(--st-on-accent); }
.st-transport .play:hover { background: color-mix(in srgb, var(--st-accent) 88%, var(--st-ink)); color: var(--st-on-accent); }
.st-transport .play svg { width: 20px; height: 20px; }
.st-transport .play:focus-visible { outline-offset: 3px; }

.st-seek-zone { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-width: 0; }
.st-time { min-width: 34px; font-size: 12px; font-weight: 500; color: var(--st-ink-2); font-variant-numeric: tabular-nums; }
.st-time.end { text-align: right; color: var(--st-ink-3); }
.st-bar { position: relative; height: 24px; }
.st-bar input[data-melo="seek"] { position: absolute; inset: 0; width: 100%; height: 100%; }
.st-range { -webkit-appearance: none; appearance: none; margin: 0; background: transparent; cursor: pointer; outline: none; -webkit-app-region: no-drag; }
.st-range::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--st-accent) 0, var(--st-accent) var(--progress, 0%), var(--st-track) var(--progress, 0%), var(--st-track) 100%); }
.st-range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4.5px; border-radius: 50%; box-sizing: border-box;
  /* the handle is only hidden by colour (never by transform / opacity): those promote the thumb to its own
     compositor layer and Chromium can leave a ghost of it behind when the page does not repaint (e.g. paused) */
  background: transparent; border: 3px solid transparent; }
.st-range:hover::-webkit-slider-thumb, .st-range:active::-webkit-slider-thumb, .st-range:focus-visible::-webkit-slider-thumb { background: var(--st-card); border-color: var(--st-accent); }
.st-range::-moz-range-track { height: 6px; border-radius: 3px; background: var(--st-track); }
.st-range::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--st-accent); }
.st-range::-moz-range-thumb { width: 8px; height: 8px; border-radius: 50%; background: var(--st-card); border: 3px solid var(--st-accent); }

.st-volume { display: flex; align-items: center; gap: 6px; }
.st-mute { flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--st-ink-2); transition: background .15s ease, color .15s ease; -webkit-app-region: no-drag; }
.st-mute svg { width: 17px; height: 17px; }
.st-mute:hover { background: var(--st-hover); color: var(--st-ink); }
.st-mute.muted, .st-mute.muted:hover { color: var(--st-danger); }
.st-vol { width: 84px; height: 24px; }
.st-vol::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--st-accent) 0, var(--st-accent) var(--vol, 60%), var(--st-track) var(--vol, 60%), var(--st-track) 100%); }
.st-root:has(.st-mute.muted) .st-vol::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--st-danger) 0, var(--st-danger) var(--vol, 60%), var(--st-track) var(--vol, 60%), var(--st-track) 100%); }
.st-root:has(.st-mute.muted) .st-vol:hover::-webkit-slider-thumb, .st-root:has(.st-mute.muted) .st-vol:active::-webkit-slider-thumb, .st-root:has(.st-mute.muted) .st-vol:focus-visible::-webkit-slider-thumb { border-color: var(--st-danger); }
.st-pct { min-width: 22px; text-align: right; font-family: "st-no-percent", var(--st-sans); font-size: 12px; font-weight: 600; color: var(--st-ink-2); font-variant-numeric: tabular-nums; }
.st-root:has(.st-mute.muted) .st-pct { color: var(--st-danger); }

/* ── Menu ── */
.st-menu {
  display: none; position: absolute; z-index: 200; top: 42px; right: 12px; width: 216px; padding: 6px;
  flex-direction: column; gap: 1px; background: var(--st-card); color: var(--st-ink);
  border-radius: 16px; box-shadow: 0 0 0 1px var(--st-line), 0 14px 32px rgba(0,0,0,.28);
}
.st-root:has(#stMenu:checked) .st-menu { display: flex; animation: st-pop .14s ease-out; }
@keyframes st-pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
.st-item { height: 34px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 10px; font-size: 13px; cursor: pointer; user-select: none; }
.st-item svg { width: 16px; height: 16px; color: var(--st-ink-2); flex: 0 0 16px; }
.st-item:hover { background: var(--st-hover); }
.st-sep { height: 1px; margin: 5px 10px; background: var(--st-line); }
.st-dismiss { display: none; position: fixed; inset: 0; z-index: 150; }
.st-root:has(#stMenu:checked) .st-dismiss { display: block; }

/* ── Waveform seek bar (optional; skins/README.md §5.7b) ── */
[data-melo="waveform"] {
  --melo-wave-played: var(--st-accent);
  --melo-wave-rest: var(--st-track);
  display: none; position: absolute; inset: 0; cursor: pointer; touch-action: none; -webkit-app-region: no-drag;
}
html.melo-wave-on [data-melo="waveform"] { display: block; z-index: 2; }
html.melo-wave-on .st-bar [data-melo="seek"] { opacity: 0 !important; }

/* ── Smaller windows ── */
@container strt (max-width: 720px) {
  .st-seg span { display: none; }
  .st-seg { padding: 0 10px; }
  .st-brand span { display: none; }
  .st-brand { padding-right: 8px; }
  .st-vol { display: none; }
  .st-dock { column-gap: 14px; padding: 0 14px; }
}
@container strt (max-width: 640px) { .st-chip:not(.codec) { display: none; } .st-dock { column-gap: 10px; } }
@container strt (max-width: 700px) { .st-titlerow { gap: 8px; } .st-rate { gap: 1px; } .st-rate .rate-star { width: 15px; font-size: 13.5px; } }
@container strt (max-height: 360px) { .st-kicker { display: none; } .st-info { padding: 12px 18px 2px; } }
/* very short windows */
@container strt (max-height: 330px) {
  /* queue / lyrics take the whole card */
  html.melo-show-playlist .st-info, html.melo-show-lyrics .st-info { display: none; }
  html.melo-show-playlist .st-main, html.melo-show-lyrics .st-main { grid-template-rows: minmax(0, 1fr); }
  /* otherwise the stage only stays when it has a lyric reel to show */
  html:not(.melo-show-playlist):not(.melo-show-lyrics):not(.melo-lyric-skin-on.melo-has-synced-lyrics) .st-stage { display: none; }
  html:not(.melo-show-playlist):not(.melo-show-lyrics):not(.melo-lyric-skin-on.melo-has-synced-lyrics) .st-main { grid-template-rows: minmax(0, 1fr); }
  html:not(.melo-show-playlist):not(.melo-show-lyrics):not(.melo-lyric-skin-on.melo-has-synced-lyrics) .st-info { align-self: center; padding: 0 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .st-root *, .st-root *::before, .st-root *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body data-window-width="820" data-window-height="430" data-min-width="580" data-min-height="300" data-max-width="1100" data-max-height="620" data-resizable="true">

<div id="melo-player">
  <div class="st-root">

    <!-- Title bar: brand · stage switch · commands · window -->
    <header class="st-titlebar" data-tauri-drag-region>
      <div class="st-brand" data-tauri-drag-region>
        <span class="st-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
        <span>Melo</span>
      </div>

      <nav class="st-switch" aria-label="Stage">
        <button type="button" class="st-seg active" data-melo="toggle-embedded-viz" title="Visualizer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 20V12M10 20V5M15 20V9M20 20V14"/></svg><span>Visualizer</span>
        </button>
        <button type="button" class="st-seg" data-melo="toggle-embedded-lyrics" title="Lyrics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Lyrics</span>
        </button>
        <button type="button" class="st-seg" data-melo="toggle-embedded-playlist" title="Queue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h13M4 11h13M4 16h7"/><path d="M15 14.5v6l5-3z" fill="currentColor"/></svg><span>Queue</span>
        </button>
      </nav>

      <div class="st-drag" data-tauri-drag-region></div>

      <button type="button" class="st-round" data-melo="toggle-library" title="Library" aria-label="Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16M8 8v12M12 6v14M16 6l4 14"/></svg>
      </button>
      <button type="button" class="st-round" data-melo="toggle-playlist" title="Playlist window" aria-label="Playlist window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>
      </button>
      <button type="button" class="st-round" data-melo="toggle-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l-2.86 2.86A1.7 1.7 0 0 0 15 19.4 1.7 1.7 0 0 0 14 21h-4a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.88.34l-2.86-2.86A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3 14v-4a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.34-1.88l2.86-2.86A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3h4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.88-.34l2.86 2.86A1.7 1.7 0 0 0 19.4 9 1.7 1.7 0 0 0 21 10v4a1.7 1.7 0 0 0-1.6 1z"/></svg>
      </button>
      <input id="stMenu" type="checkbox" class="st-sr" aria-label="More options">
      <label class="st-round" for="stMenu" title="More" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </label>
      <span class="gap"></span>
      <button type="button" class="st-round" data-melo="minimize" aria-label="minimize" title="Minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg>
      </button>
      <button type="button" class="st-round close" data-melo="close" aria-label="close" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </header>

    <!-- Three cards: cover · info · stage -->
    <main class="st-bento">
      <section class="st-card st-cover-card">
        <img data-melo="cover" alt="Album cover" style="display:none">
        <div class="st-cover-fallback" data-melo="cover-fallback" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 36V13l19-4v22"/><circle cx="14" cy="36" r="5"/><circle cx="33" cy="31" r="5"/></svg>
        </div>
      </section>

      <section class="st-card st-main">
        <div class="st-info">
          <div class="st-kicker">
            <span class="st-kicker-label">Now playing</span>
            <span class="st-chips"><span class="st-chip codec" data-melo="codec"></span><span class="st-chip" data-melo="specs"></span></span>
          </div>
          <div class="st-titlerow">
            <div class="st-title" data-melo="title">Nothing playing</div>
            <div class="st-rate" id="trackRating" data-melo="rating" role="radiogroup" aria-label="Rating"></div>
          </div>
          <div class="st-sub"><span data-melo="artist">Add files or a folder to start</span><span class="st-album" data-melo="album"></span></div>
        </div>

        <div class="st-stage">
          <div class="st-viz" data-melo="visualizer" data-bars="48"></div>
          <div class="st-lyric-block">
            <div data-melo="current-lyric" aria-live="polite" title="Click to seek"></div>
            <div data-melo="next-lyric"></div>
          </div>
          <div data-melo="embedded-playlist"></div>
          <div data-melo="embedded-lyrics"></div>
        </div>
      </section>
    </main>

    <!-- Dock -->
    <footer class="st-card st-dock">
      <div class="st-transport">
        <button type="button" data-melo="shuffle" title="Shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20l8-8M21 3l-8 8M16 21h5v-5M4 4l5 5"/></svg>
        </button>
        <button type="button" data-melo="prev" title="Previous" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20 9 12l10-8z"/><rect x="5" y="4" width="3" height="16" rx="1"/></svg>
        </button>
        <button type="button" class="play" data-melo="play" title="Play / Pause" aria-label="Play or pause">
          <svg data-melo="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg>
          <svg data-melo="play-icon" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M7 4.5 19 12 7 19.5z"/></svg>
        </button>
        <button type="button" data-melo="stop" title="Stop" aria-label="Stop">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button type="button" data-melo="next" title="Next" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8z"/><rect x="16" y="4" width="3" height="16" rx="1"/></svg>
        </button>
        <button type="button" data-melo="repeat" title="Repeat" aria-label="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <div class="st-seek-zone">
        <span class="st-time" data-melo="current-time">0:00</span>
        <div class="st-bar">
          <div data-melo="waveform"></div>
          <input class="st-range" type="range" data-melo="seek" min="0" max="100" value="0" aria-label="Seek">
        </div>
        <span class="st-time end" data-melo="duration">0:00</span>
      </div>

      <div class="st-volume">
        <button type="button" class="st-mute" data-melo="volume-icon" title="Mute" aria-label="Mute">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5zM15 9.5a4 4 0 0 1 0 5M18 7a8 8 0 0 1 0 10"/></svg>
        </button>
        <input class="st-range st-vol" type="range" data-melo="volume" min="0" max="100" value="60" aria-label="Volume">
        <span class="st-pct" data-melo="volume-pct">60</span>
      </div>
    </footer>

    <!-- More menu -->
    <div class="st-menu" role="menu">
      <label class="st-item" for="stMenu" data-melo="add-files" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 12v6M9 15h6"/></svg>
        Add files
      </label>
      <label class="st-item" for="stMenu" data-melo="add-folder" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2zM12 10v6M9 13h6"/></svg>
        Add folder
      </label>
      <div class="st-sep" role="separator"></div>
      <label class="st-item" for="stMenu" data-melo="toggle-eq" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        Equalizer
      </label>
      <label class="st-item" for="stMenu" data-melo="toggle-lyrics" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 8.5h18"/><path d="M12.5 16V11l3.5-.8"/><circle cx="10.2" cy="16" r="2"/></svg>
        Lyrics window
      </label>
      <div class="st-sep" role="separator"></div>
      <label class="st-item" for="stMenu" data-melo="theme-toggle" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Toggle theme
      </label>
    </div>
    <label class="st-dismiss" for="stMenu" aria-label="Close menu"></label>

  </div>
</div>

</body>
</html>
