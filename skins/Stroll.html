<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Melo — Stroll</title>
<style>
  /*
    STROLL — a pocket cassette player from the eighties, laid on its side.
    Brushed-metal body (dark = graphite blue, light = polished titanium), a tinted
    glass door with a real cassette behind it — the album cover is printed on
    the cassette's label with a write-on strip for title and artist — a green
    LCD with the time, the lyric line and mode lamps, chunky rubber keys that
    stay pressed while playing, two mode switches and a ridged volume wheel.
    Lyrics and Queue replace the cassette with the same green LCD, in typed
    dot-matrix lines. Original artwork and wording; no brand marks.

    PRO pass — same body, same hooks, finer details:
      · the Melo menu closes after you pick an item or click outside (it used to stay open)
      · the Play key's legend is truthful: it reads PAUSE while the tape is running
      · the smallest legends (key labels, mode lamps, LCD flags) are a notch larger and brighter
      · LCD digits get the faint offset shadow of a real liquid-crystal segment
      · RTL-safe text (Persian / Arabic titles on the tape strip, lyrics and track list)
      · the cassette label is a real write-on label: ruled lines,
        ballpoint-blue handwriting; the album moved to its own LCD line above the lyric ticker
  */
  :root,
  :root[data-theme="dark"],
  [data-theme="dark"] {
    --wm-body-1: #38424f;
    --wm-body-2: #232b35;
    --wm-grain: rgba(255, 255, 255, .035);
    --wm-edge: rgba(255, 255, 255, .22);
    --wm-ink: #e9edf2;
    --wm-mute: #8d98a8;
    --wm-line: rgba(0, 0, 0, .35);
    --wm-key-1: #3a4048;
    --wm-key-2: #20252b;
    --wm-key-edge: #0b0d10;
    --wm-key-ink: #e6eaef;
    --wm-bay: #0b0d10;
    --accent: #ff7a1a;
    --accent-glow: transparent;
    --visualizer: #ffb347;
    --track-bg: #12161b;
  }
  :root[data-theme="light"],
  [data-theme="light"] {
    --wm-body-1: #eceff3;
    --wm-body-2: #aab2be;
    --wm-grain: rgba(40, 50, 65, .06);
    --wm-edge: rgba(255, 255, 255, .85);
    --wm-ink: #1b2028;
    --wm-mute: rgba(27, 32, 40, .62);
    --wm-line: rgba(30, 40, 55, .28);
    --wm-key-1: #4a4d52;
    --wm-key-2: #2b2d31;
    --wm-key-edge: #101113;
    --wm-key-ink: #f1f2f4;
    --wm-bay: #11141a;
    --accent: #e8531a;
    --accent-glow: transparent;
    --visualizer: #ffb347;
    --track-bg: #2b2d31;
  }
  :root {
    --wm-lcd: #a9bb95;
    --wm-lcd-2: #98ab84;
    --wm-lcd-ink: #26301f;
    --wm-lcd-dim: rgba(38, 48, 31, .22);
    --wm-paper: #efe6d0;
    --wm-paper-ink: #2b2119;
    --wm-hand: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Marker Felt", "Comic Sans MS", cursive;
    --wm-mono: "Cascadia Mono", "SF Mono", Consolas, "Courier New", monospace;
  }

  * { box-sizing: border-box; min-width: 0; }
  html, body { margin: 0; }
  button { font: inherit; }

  body:not(.tauri-main):has(#melo-player) {
    min-height: 100vh; padding: 28px; display: grid; place-items: center; overflow: hidden; background: #101215;
  }
  [data-theme="light"] body:not(.tauri-main):has(#melo-player) { background: #c3c9d2; }

  #melo-player,
  body.tauri-main .player-card,
  body.custom-skin-active .player-card {
    position: relative; overflow: hidden; width: 770px; height: 370px; margin: 0; padding: 0;
    color: var(--wm-ink); background: transparent; border: 0; box-shadow: none;
    font-family: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif; font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  body.tauri-main,
  body.tauri-main .app-shell { min-width: 0 !important; }
  body.tauri-main .player-card,
  body.custom-skin-active .player-card {
    width: 100% !important; height: 100vh !important; min-width: 0 !important; min-height: 0 !important;
    max-height: 100vh !important; padding: 0 !important; margin: 0 !important; overflow: hidden !important;
    background: transparent !important; border: 0 !important; box-shadow: none !important;
  }

  .wm-root { position: absolute; inset: 0; padding: 6px; }

  /* ───────── the metal body ───────── */
  .wm-body {
    position: relative; width: 100%; height: 100%; display: grid; grid-template-rows: 40px minmax(0, 1fr);
    padding: 0 16px 16px; border-radius: 26px; overflow: hidden;
    background:
      repeating-linear-gradient(90deg, var(--wm-grain) 0 1px, transparent 1px 3px),
      linear-gradient(170deg, var(--wm-body-1), var(--wm-body-2));
    box-shadow: inset 0 1px 0 var(--wm-edge), inset 0 0 0 1px var(--wm-line), inset 0 -3px 0 rgba(0,0,0,.18);
  }
  /* light theme: polished titanium — soft diagonal sheen over the brushed grain */
  [data-theme="light"] .wm-body {
    background:
      repeating-linear-gradient(90deg, var(--wm-grain) 0 1px, transparent 1px 3px),
      linear-gradient(115deg, rgba(255,255,255,.0) 0 18%, rgba(255,255,255,.55) 26%, rgba(255,255,255,0) 36% 60%, rgba(255,255,255,.35) 68%, rgba(255,255,255,0) 78%),
      linear-gradient(170deg, var(--wm-body-1), var(--wm-body-2));
  }
  .wm-screw {
    position: absolute; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; z-index: 3;
    background: linear-gradient(45deg, transparent 44%, rgba(0,0,0,.5) 44% 56%, transparent 56%), radial-gradient(circle at 35% 30%, #d3d0c8, #7a766d 70%);
    box-shadow: 0 0 0 1px rgba(0,0,0,.35);
  }
  .wm-screw.a { left: 9px; top: 9px; } .wm-screw.b { right: 9px; top: 9px; transform: rotate(50deg); }
  .wm-screw.c { left: 9px; bottom: 9px; transform: rotate(80deg); } .wm-screw.d { right: 9px; bottom: 9px; transform: rotate(20deg); }

  /* ───────── header ───────── */
  .wm-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 6px; -webkit-app-region: drag; user-select: none; }
  .wm-menu { position: relative; z-index: 60; -webkit-app-region: no-drag; }
  .wm-mchk { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
  .wm-scrim { display: none; }
  .wm-mchk:checked ~ .wm-scrim { display: block; position: fixed; inset: 0; z-index: 55; cursor: default; -webkit-app-region: no-drag; }
  .wm-mchk:checked ~ .wm-menu-pop { display: block; animation: wm-pop .14s ease-out; }
  @keyframes wm-pop { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .wm-brand { display: flex; align-items: baseline; gap: 8px; cursor: pointer; padding: 3px 6px; border-radius: 6px; }
  .wm-brand b { font: 900 15px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .2em; color: var(--wm-ink); }
  .wm-brand i { font: italic 600 14px/1 "Iowan Old Style", Georgia, serif; color: var(--accent); }
  .wm-brand:hover, .wm-mchk:checked + .wm-brand { background: rgba(0,0,0,.12); }
  .wm-print { margin-left: 4px; font: 700 8px/1 var(--wm-mono); letter-spacing: .24em; color: var(--wm-mute); text-transform: uppercase; }
  .wm-menu-pop {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 80; min-width: 170px; padding: 5px;
    background: #f0e6cf; color: #2b2119; border-radius: 8px; box-shadow: 0 10px 26px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.25);
  }
  .wm-menu-pop .wm-item {
    width: 100%; height: 30px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: inherit; user-select: none;
    display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 12.5px; text-align: left;
  }
  .wm-menu-pop .wm-item:hover { background: rgba(60,40,20,.12); }
  .wm-menu-pop svg { width: 14px; height: 14px; flex: 0 0 auto; }

  .wm-tools { display: flex; align-items: center; gap: 2px; -webkit-app-region: no-drag; }
  .wm-tools button, .win-btn {
    width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--wm-mute);
    cursor: pointer; display: grid; place-items: center; transition: background .12s ease, color .12s ease;
  }
  .wm-tools button:hover, .win-btn:hover { background: rgba(0,0,0,.14); color: var(--wm-ink); }
  .wm-tools button svg { width: 15px; height: 15px; }
  .wm-tools .stage-btn.active { background: var(--wm-key-2); color: var(--wm-key-ink); box-shadow: inset 0 2px 4px rgba(0,0,0,.5); }
  .wm-sep { width: 1px; height: 16px; margin: 0 6px; background: var(--wm-line); }
  .win-btn.close:hover { background: #c4452b; color: #fff; }

  /* ───────── main grid ───────── */
  .wm-main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 16px; }

  /* the cassette bay with its glass door */
  .wm-bay {
    position: relative; min-height: 0; padding: 10px; border-radius: 16px; background: var(--wm-bay);
    box-shadow: inset 0 3px 10px rgba(0,0,0,.9), 0 0 0 2px var(--wm-line), 0 1px 0 var(--wm-edge);
    container-type: size;
  }
  .wm-tape {
    position: absolute; inset: 10px; border-radius: 10px; overflow: hidden;
    background: linear-gradient(160deg, #46433f, #1b1a19 70%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -10px 20px rgba(0,0,0,.35);
  }
  .wm-tape::before, .wm-tape::after {   /* tiny corner screws of the cassette */
    content: ""; position: absolute; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: #8f8a80; box-shadow: 0 0 0 1px rgba(0,0,0,.5);
  }
  .wm-tape::before { left: 6px; } .wm-tape::after { right: 6px; }
  .wm-label { position: absolute; left: 6.5%; right: 6.5%; top: 9%; height: 58%; border-radius: 6px; overflow: hidden; background: var(--wm-paper); box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .wm-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .wm-none { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(0,0,0,.06) 0 6px, transparent 6px 12px), color-mix(in srgb, var(--accent) 30%, var(--wm-paper)); }
  .wm-none::before { content: "♪"; position: absolute; left: 14px; top: 8px; font-size: 40px; color: color-mix(in srgb, var(--accent) 70%, #2b2119); opacity: .75; }
  .wm-side { position: absolute; left: 8px; top: 8px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: #fff; color: #2b2119; font: 900 11px/1 "Segoe UI", system-ui, sans-serif; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 2; }
  /* the write-on part of the cassette label: printed captions, ruled lines, ballpoint handwriting */
  .wm-strip {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 5px 12px 6px;
    background: var(--wm-paper); color: var(--wm-paper-ink); border-top: 2px solid color-mix(in srgb, var(--accent) 85%, #000);
    --wm-pen: #1f3b66; --wm-rule: rgba(70, 110, 160, .30);
  }
  .wm-line { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--wm-rule); }
  .wm-line + .wm-line { margin-top: 1px; }
  .wm-title, .wm-artist { flex: 1 1 auto; min-width: 0; font-family: var(--wm-hand); color: var(--wm-pen); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform-origin: left center; }
  .wm-title { font-weight: 700; font-size: clamp(13px, 6cqw, 20px); line-height: 1.55; transform: rotate(-.6deg); }
  .wm-artist { font-size: clamp(11px, 4.6cqw, 14px); line-height: 1.6; color: color-mix(in srgb, var(--wm-pen) 82%, #fff); transform: rotate(-.3deg); }

  /* the tape window with the two reels */
  .wm-reels {
    position: absolute; left: 12%; right: 12%; bottom: 7%; height: 22%; border-radius: 40px; overflow: hidden; isolation: isolate;
    background: linear-gradient(180deg, #050403, #14100d); box-shadow: inset 0 3px 8px rgba(0,0,0,.9), 0 0 0 1.5px rgba(255,255,255,.12);
  }
  .wm-reel { position: absolute; top: 50%; width: 36px; height: 36px; margin-top: -18px; border-radius: 50%; background: radial-gradient(circle, #6a4a36 0 50%, #3e2c21 51% 100%); box-shadow: 0 0 0 1.5px rgba(0,0,0,.6); animation: wm-spin 2.4s linear infinite; animation-play-state: paused; z-index: 1; }
  .wm-reel.l { left: 8px; } .wm-reel.r { right: 8px; animation-duration: 1.9s; }
  .wm-reel i { position: absolute; left: 50%; top: 50%; width: 58%; height: 58%; margin: -29% 0 0 -29%; border-radius: 50%; background: radial-gradient(circle, #100e0d 0 26%, transparent 27%), repeating-conic-gradient(#ebe4d3 0 24deg, #1c1917 24deg 60deg); }
  .wm-root:has([data-melo="pause-icon"][style*="block"]) .wm-reel { animation-play-state: running; }
  @keyframes wm-spin { to { transform: rotate(360deg); } }
  .wm-viz-wrap { position: absolute; left: 52px; right: 52px; top: 5px; bottom: 5px; }
  .wm-viz { position: absolute !important; inset: 0 !important; width: auto !important; height: auto !important; display: block !important; overflow: hidden !important; cursor: pointer; padding: 0 !important; }
  .wm-viz canvas { width: 100% !important; height: 100% !important; display: block; filter: grayscale(1) brightness(1.9) contrast(1.1); }
  .wm-viz-wrap::after { content: ""; position: absolute; inset: 0; background: #ffb347; mix-blend-mode: multiply; pointer-events: none; }
  html.melo-show-lyrics .wm-reels, html.melo-show-playlist .wm-reels { display: none; }

  /* glass door: gloss, hinge, latch */
  .wm-glass { position: absolute; inset: 0; border-radius: 16px; pointer-events: none; z-index: 6; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(255,255,255,.07); background: linear-gradient(112deg, rgba(255,255,255,.15) 0 20%, transparent 20% 52%, rgba(255,255,255,.05) 52% 56%, transparent 56%), rgba(140,170,200,.05); }
  .wm-hinge { position: absolute; left: -2px; width: 5px; height: 26px; border-radius: 2px; background: linear-gradient(90deg, #7d7a73, #c9c5bb); z-index: 7; }
  .wm-hinge.t { top: 22px; } .wm-hinge.b { bottom: 22px; }
  .wm-latch { position: absolute; right: -2px; top: 50%; width: 5px; height: 36px; margin-top: -18px; border-radius: 2px; background: linear-gradient(90deg, #c9c5bb, #7d7a73); z-index: 7; }

  /* Lyrics / Queue: the same green LCD, dot-matrix lines */
  .wm-jcard {
    position: absolute; inset: 10px; z-index: 5; display: none; flex-direction: column; border-radius: 8px; overflow: hidden;
    background: var(--wm-lcd); color: var(--wm-lcd-ink); box-shadow: inset 0 2px 6px rgba(0,0,0,.35);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px);
  }
  html.melo-show-lyrics .wm-jcard, html.melo-show-playlist .wm-jcard { display: flex; }
  html.melo-show-lyrics .wm-tape, html.melo-show-playlist .wm-tape { visibility: hidden; }
  .wm-jhead { flex: 0 0 24px; display: flex; align-items: center; padding: 0 10px; font: 800 10px/1 var(--wm-mono); letter-spacing: .2em; border-bottom: 1.5px solid var(--wm-lcd-ink); }
  html.melo-show-playlist .wm-jtitle::after { content: "TRACK LIST"; }
  html.melo-show-lyrics .wm-jtitle::after { content: "LYRICS"; }
  .wm-jbody { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .wm-jbody [data-melo="embedded-playlist"], .wm-jbody [data-melo="embedded-lyrics"] { display: none; height: 100%; }
  html.melo-show-playlist .wm-jbody [data-melo="embedded-playlist"], html.melo-show-lyrics .wm-jbody [data-melo="embedded-lyrics"] { display: block; }
  .wm-jbody .embedded-lyrics-title { display: none; }
  .wm-jbody .embedded-playlist, .wm-jbody .embedded-lyrics { height: 100% !important; max-height: 100% !important; overflow-y: auto !important; overflow-x: hidden !important; padding: 4px 8px !important; scrollbar-width: thin; scrollbar-color: var(--wm-lcd-ink) transparent; }
  .wm-jbody .embedded-playlist { counter-reset: wm-track; }
  .wm-jbody .embedded-playlist-mini .embedded-playlist-row { display: flex; align-items: center; gap: 8px; height: 24px; min-height: 24px; padding: 0 4px !important; border-radius: 0; color: var(--wm-lcd-ink); font: 700 11.5px/24px var(--wm-mono) !important; counter-increment: wm-track; }
  .wm-jbody .embedded-playlist-mini .embedded-playlist-row::before { content: counter(wm-track, decimal-leading-zero); opacity: .55; font-size: 10px; }
  .wm-jbody .embedded-playlist-mini .embedded-playlist-row:hover { background: var(--wm-lcd-dim); }
  .wm-jbody .embedded-playlist-mini .embedded-playlist-row .t-title { font: 700 11.5px/24px var(--wm-mono) !important; color: var(--wm-lcd-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wm-jbody .embedded-playlist-mini .embedded-playlist-row.active { background: var(--wm-lcd-ink); color: var(--wm-lcd); }
  .wm-jbody .embedded-playlist-mini .embedded-playlist-row.active .t-title { color: var(--wm-lcd); }
  .wm-jbody .embedded-playlist-mini .track-cover-mini { display: none !important; }
  .wm-jbody .embedded-playlist-empty, .wm-jbody .embedded-playlist-more { font: 700 11px/24px var(--wm-mono); color: var(--wm-lcd-ink); background: transparent; border: 0; text-align: left; cursor: pointer; }
  .wm-jbody .lyric-line { padding: 2px 6px; font: 700 12px/1.7 var(--wm-mono); color: rgba(38,48,31,.55); text-align: left; overflow-wrap: anywhere; }
  .wm-jbody .lyric-line.active { color: var(--wm-lcd); background: var(--wm-lcd-ink); }

  /* ───────── right panel ───────── */
  .wm-panel { min-height: 0; display: flex; flex-direction: column; gap: 10px; }

  .wm-lcd {
    flex: 0 0 auto; position: relative; padding: 8px 12px 9px; border-radius: 8px; color: var(--wm-lcd-ink);
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px), linear-gradient(180deg, var(--wm-lcd), var(--wm-lcd-2));
    box-shadow: inset 0 3px 8px rgba(0,0,0,.35), 0 0 0 3px rgba(0,0,0,.28), 0 1px 0 3px var(--wm-edge);
  }
  .wm-clock .now, .wm-clock .end, .wm-clock .sl, .wm-tech, .wm-album, .wm-ticker, .wm-inds { text-shadow: 1.5px 1.5px 0 rgba(38,48,31,.16); }
  .wm-title, .wm-artist, .wm-lyric, .wm-jbody .lyric-line, .wm-jbody .embedded-playlist-mini .embedded-playlist-row .t-title { unicode-bidi: plaintext; }
  .wm-inds { display: flex; gap: 12px; font: 800 9px/1 var(--wm-mono); letter-spacing: .14em; }
  .wm-inds span { opacity: .2; transition: opacity .15s ease; }
  .wm-body:has([data-melo="pause-icon"][style*="block"]) .ind-play,
  .wm-body:has([data-melo="shuffle"].active) .ind-shuf,
  .wm-body:has([data-melo="repeat"].active) .ind-rept,
  .wm-body:has([data-melo="volume-icon"].muted) .ind-mute { opacity: 1; }
  .wm-clock { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; font-family: var(--wm-mono); font-variant-numeric: tabular-nums; }
  .wm-clock .now { font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: .04em; }
  .wm-clock .sl { font-size: 14px; opacity: .5; }
  .wm-clock .end { font-size: 15px; font-weight: 700; opacity: .65; }
  .wm-tech { margin-top: 4px; height: 13px; display: flex; gap: 6px; align-items: center; font: 800 10px/13px var(--wm-mono); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .wm-tech span:empty { display: none; }
  .wm-tech span + span:not(:empty)::before { content: "· "; opacity: .6; }
  /* album line: sits between the tech readout and the lyric ticker */
  .wm-albrow { margin-top: 5px; display: flex; align-items: center; gap: 8px; }
  .wm-album { flex: 1 1 0; min-width: 0; height: 18px; font: 700 10.5px/18px var(--wm-mono); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; unicode-bidi: plaintext; }
  .wm-album::before { content: "ALB "; font-size: 8.5px; font-weight: 800; letter-spacing: .14em; opacity: .55; margin-right: 4px; }
  .wm-album:empty::after { content: "—"; opacity: .45; }
  /* star rating, after the album on the same LCD line. Melo fills .wm-rate with five .rate-star buttons (.on = filled) for the playing track.
     Drawn like the mode lamps above: unlit stars are ghost segments (20%), lit ones full ink.
     The hover preview is driven by Melo, which tags stars .pv-add (would light up: half-lit) and .pv-remove (would go out: dimmed lit star).
     Selectors out-rank the app's own .track-rating / .rate-star styles. */
  .wm-lcd .wm-rate { flex: 0 0 auto; display: flex; align-items: center; gap: 0; height: 18px; min-height: 0; margin: 0; }
  .wm-lcd .wm-rate .rate-star { width: 13px; height: 18px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--wm-lcd-ink); font: 800 11px/18px var(--wm-mono); text-align: center; text-shadow: 1.5px 1.5px 0 rgba(38,48,31,.16); opacity: .2; transition: opacity .12s ease; }
  .wm-lcd .wm-rate .rate-star.on { opacity: 1; }
  .wm-lcd .wm-rate .rate-star.pv-add { opacity: .5; }
  .wm-lcd .wm-rate .rate-star.pv-remove { opacity: .4; }
  .wm-lcd .wm-rate .rate-star:focus-visible { outline: 1px solid var(--wm-lcd-ink); outline-offset: -1px; }
  /* line boxes are deliberately tall (22px / 18px): Persian & Arabic fall back to a font with deeper descenders
     than the mono face, and overflow:hidden (needed for the ellipsis) used to slice the bottom of ی ج ع و ر … */
  .wm-ticker { margin-top: 3px; height: 22px; font: 700 11px/22px var(--wm-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wm-hint { letter-spacing: .12em; opacity: .55; }
  .wm-lyric { display: none; cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  html.melo-lyric-skin-on .wm-lyric { display: block !important; }
  html.melo-lyric-skin-on .wm-lyric.melo-lyric-empty { display: none !important; }
  .wm-lcd:has([data-melo="current-lyric"]:not(.melo-lyric-empty)) .wm-hint { display: none; }
  html:not(.melo-lyric-skin-on) .wm-hint { display: block; }
  .wm-lyric.melo-lyric-tick { animation: wm-in .25s ease-out both; }
  @keyframes wm-in { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; transform: none; } }

  /* seek: a strip of tape with an index flag */
  .wm-seek { flex: 0 0 auto; height: 22px; display: flex; align-items: center; margin-top: auto; }
  .wm-range, .wm-vol {
    -webkit-appearance: none; appearance: none; width: 100%; height: 12px; margin: 0; border-radius: 3px; outline: none; cursor: pointer;
    background:
      linear-gradient(to right, var(--accent) 0, var(--accent) var(--progress, 0%), transparent var(--progress, 0%)) 0 100% / 100% 3px no-repeat,
      repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 1px, transparent 1px 8px),
      var(--track-bg);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.7), 0 1px 0 var(--wm-edge);
  }
  .wm-range::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 20px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 0 1.5px rgba(0,0,0,.45), 0 2px 4px rgba(0,0,0,.4); }
  .wm-range::-moz-range-thumb { width: 6px; height: 20px; border: 0; border-radius: 2px; background: var(--accent); }
  .wm-range:focus-visible, .wm-vol:focus-visible, .wm-root button:focus-visible, .wm-mchk:focus-visible + .wm-brand { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* chunky rubber keys */
  .wm-keys { flex: 0 0 auto; height: 76px; display: flex; gap: 8px; align-items: stretch; padding-bottom: 4px; }
  .wm-key {
    position: relative; flex: 1 1 0; border: 0; border-radius: 12px; padding: 0; cursor: pointer;
    display: grid; place-items: center; color: var(--wm-key-ink);
    background: linear-gradient(180deg, var(--wm-key-1), var(--wm-key-2));
    box-shadow: 0 4px 0 var(--wm-key-edge), 0 7px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
    transition: transform .06s ease, box-shadow .06s ease, filter .12s ease;
  }
  .wm-key:hover { filter: brightness(1.1); }
  .wm-key svg { width: 20px; height: 20px; }
  .wm-key.play { flex: 1.6 1 0; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, #fff), color-mix(in srgb, var(--accent) 80%, #000)); color: #fff; }
  .wm-key.play svg { width: 26px; height: 26px; }
  .wm-key:active, .wm-root:has([data-melo="pause-icon"][style*="block"]) .wm-key.play {
    transform: translateY(4px); box-shadow: 0 0 0 var(--wm-key-edge), 0 1px 2px rgba(0,0,0,.35), inset 0 3px 6px rgba(0,0,0,.35); filter: brightness(.95);
  }
  .wm-key small { position: absolute; bottom: 5px; font: 800 8px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .16em; opacity: .7; text-transform: uppercase; }
  .wm-key.play small { opacity: .85; font-size: 0; }
  .wm-key.play small::after { content: "Play"; font-size: 8px; }
  .wm-root:has([data-melo="pause-icon"][style*="block"]) .wm-key.play small::after { content: "Pause"; }

  /* mode switches + volume wheel */
  .wm-aux { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .wm-modes { display: flex; gap: 6px; }
  .wm-sw {
    height: 24px; padding: 0 10px 0 8px; border: 0; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    background: var(--wm-key-2); color: var(--wm-key-ink); font: 800 9px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .14em;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.55), 0 1px 0 var(--wm-edge);
  }
  .wm-sw i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
  .wm-sw.active i { background: var(--accent); box-shadow: 0 0 6px var(--accent), inset 0 0 0 1px rgba(0,0,0,.2); }
  .wm-volrow { display: flex; align-items: center; gap: 8px; }
  .wm-volrow .ico { width: 18px; height: 18px; display: grid; place-items: center; cursor: pointer; color: var(--wm-ink); position: relative; }
  .wm-volrow .ico svg { position: absolute; inset: 0; margin: auto; width: 15px; height: 15px; }
  .wm-volrow .ico .mu { opacity: 0; } .wm-volrow .ico.muted .mu { opacity: 1; } .wm-volrow .ico.muted .wv { opacity: 0; }
  .wm-vol { width: 96px; flex: 0 0 96px; height: 16px; border-radius: 8px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.34) 0 2px, rgba(0,0,0,.35) 2px 5px), var(--track-bg); }
  .wm-vol::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 22px; border-radius: 4px; background: linear-gradient(180deg, #d9dce0, #8a8f96); box-shadow: 0 0 0 1.5px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.4); }
  .wm-vol::-moz-range-thumb { width: 14px; height: 22px; border: 0; border-radius: 4px; background: #b5b9bf; }
  .wm-pct { min-width: 28px; font: 700 10px var(--wm-mono); color: var(--wm-mute); text-align: right; font-variant-numeric: tabular-nums; }

  @media (max-width: 720px) {
    .wm-main { gap: 12px; }
    .wm-print, .wm-pct { display: none; }
    .wm-clock .now { font-size: 26px; }
    .wm-vol { width: 70px; flex-basis: 70px; }
    .wm-tools [data-melo="toggle-eq"], .wm-tools [data-melo="toggle-lyrics"], .wm-tools [data-melo="toggle-playlist"] { display: none; }
  }
  @media (max-height: 320px) {
    .wm-ticker { display: none; }
    .wm-key small { display: none; }
    .wm-keys { height: 60px; }
  }
  @media (prefers-reduced-motion: reduce) { .wm-reel { animation: none; } .wm-lyric.melo-lyric-tick { animation: none; } }

  /* waveform seek bar (optional; skins/README.md §5.7b) */
  [data-melo="waveform"] {
    --melo-wave-played: var(--accent); --melo-wave-rest: rgba(255,255,255,.30);
    display: none; position: relative; flex: 1 1 0; min-width: 0; width: 100%; height: 22px; align-self: center; cursor: pointer; touch-action: none; -webkit-app-region: no-drag;
  }
  /* light theme: the unplayed part must stand out from the silver body */
  [data-theme="light"] [data-melo="waveform"] { --melo-wave-rest: rgba(27, 32, 40, .45); }
  html.melo-wave-on [data-melo="waveform"] { display: block; }
  html.melo-wave-on #seekBar, html.melo-wave-on [data-melo="seek"] { position: absolute !important; width: 1px !important; height: 1px !important; opacity: 0 !important; pointer-events: none !important; }
</style>
</head>
<body data-window-width="770" data-window-height="370" data-min-width="770" data-min-height="370" data-max-width="770" data-max-height="370" data-resizable="false">
<div id="melo-player">
  <div class="wm-root">
    <div class="wm-body">
      <i class="wm-screw a"></i><i class="wm-screw b"></i><i class="wm-screw c"></i><i class="wm-screw d"></i>

      <header class="wm-head" data-tauri-drag-region>
        <div class="wm-menu">
          <input class="wm-mchk" type="checkbox" id="wm-m" aria-label="Menu">
          <label class="wm-brand" for="wm-m" title="Menu"><b>MELO</b><i>stroll</i></label>
          <label class="wm-scrim" for="wm-m" aria-hidden="true"></label>
          <div class="wm-menu-pop">
            <label class="wm-item" for="wm-m" data-melo="add-files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 11v6M9 14h6"/></svg>Add files</label>
            <label class="wm-item" for="wm-m" data-melo="add-folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Add folder</label>
            <label class="wm-item" for="wm-m" data-melo="theme-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Switch theme</label>
          </div>
        </div>
        <div class="wm-tools">
          <button class="stage-btn" data-melo="toggle-embedded-lyrics" title="Lyrics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h13"/></svg></button>
          <button class="stage-btn" data-melo="toggle-embedded-playlist" title="Queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></button>
          <span class="wm-sep" aria-hidden="true"></span>
          <button data-melo="toggle-library" title="Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></svg></button>
          <button data-melo="toggle-playlist" title="Playlist window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 7h12M8 12h12M8 17h8"/><circle cx="4" cy="7" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="17" r="1"/></svg></button>
          <button data-melo="toggle-eq" title="Equalizer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
          <button data-melo="toggle-lyrics" title="Lyrics window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></button>
          <button data-melo="toggle-settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
          <span class="wm-sep" aria-hidden="true"></span>
          <button class="win-btn" data-melo="minimize" aria-label="minimize" title="Minimize"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
          <button class="win-btn close" data-melo="close" aria-label="close" title="Close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </header>

      <div class="wm-main">
        <!-- cassette bay -->
        <section class="wm-bay">
          <div class="wm-tape">
            <div class="wm-label">
              <img class="wm-cover" data-melo="cover" alt="cover" style="display:none" />
              <div class="wm-none" data-melo="cover-fallback" aria-hidden="true"></div>
              <span class="wm-side">A</span>
              <div class="wm-strip">
                <div class="wm-line"><span class="wm-title" data-melo="title">No tape loaded</span></div>
                <div class="wm-line"><span class="wm-artist" data-melo="artist">Add music to begin</span></div>
              </div>
            </div>
            <div class="wm-reels">
              <div class="wm-reel l"><i></i></div>
              <div class="wm-reel r"><i></i></div>
              <div class="wm-viz-wrap"><div class="wm-viz" data-melo="visualizer" data-bars="32"></div></div>
            </div>
          </div>
          <div class="wm-jcard">
            <div class="wm-jhead"><span class="wm-jtitle"></span></div>
            <div class="wm-jbody">
              <div data-melo="embedded-playlist"></div>
              <div data-melo="embedded-lyrics"></div>
            </div>
          </div>
          <i class="wm-glass"></i><i class="wm-hinge t"></i><i class="wm-hinge b"></i><i class="wm-latch"></i>
        </section>

        <!-- controls -->
        <section class="wm-panel">
          <div class="wm-lcd">
            <div class="wm-inds"><span class="ind-play">▶ PLAY</span><span class="ind-shuf">⇄ SHUF</span><span class="ind-rept">↻ REPT</span><span class="ind-mute">× MUTE</span></div>
            <div class="wm-clock"><span class="now" data-melo="current-time">0:00</span><span class="sl">/</span><span class="end" data-melo="duration">0:00</span></div>
            <div class="wm-tech"><span data-melo="codec"></span><span data-melo="specs"></span></div>
            <div class="wm-albrow">
              <div class="wm-album" data-melo="album"></div>
              <div class="wm-rate" data-melo="rating"></div>
            </div>
            <div class="wm-ticker">
              <div class="wm-lyric" data-melo="current-lyric" aria-live="polite" title="Click to seek"></div>
              <div class="wm-hint">STEREO · AUTO REVERSE</div>
            </div>
          </div>

          <div class="wm-seek">
            <div data-melo="waveform"></div>
            <input class="wm-range" type="range" data-melo="seek" id="seekBar" min="0" max="100" value="0" aria-label="Seek" />
          </div>

          <div class="wm-keys">
            <button class="wm-key" data-melo="prev" id="btnPrev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="2.6" height="14" rx="1.2"/><path d="M19 6.4v11.2a.8.8 0 0 1-1.2.7L9.6 12.7a.8.8 0 0 1 0-1.4l8.2-5.6A.8.8 0 0 1 19 6.4z"/></svg><small>Rew</small></button>
            <button class="wm-key play" data-melo="play" id="btnPlay" title="Play / Pause">
              <svg data-melo="pause-icon" id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
              <svg data-melo="play-icon" id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
              <small>Play</small>
            </button>
            <button class="wm-key" data-melo="stop" id="btnStop" title="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="1.8"/></svg><small>Stop</small></button>
            <button class="wm-key" data-melo="next" id="btnNext" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="17.4" y="5" width="2.6" height="14" rx="1.2"/><path d="M5 6.4v11.2a.8.8 0 0 0 1.2.7l8.2-5.6a.8.8 0 0 0 0-1.4L6.2 5.7A.8.8 0 0 0 5 6.4z"/></svg><small>FF</small></button>
          </div>

          <div class="wm-aux">
            <div class="wm-modes">
              <button class="wm-sw" data-melo="shuffle" id="btnShuffle" title="Shuffle"><i></i>SHUF</button>
              <button class="wm-sw" data-melo="repeat" id="btnRepeat" title="Repeat"><i></i>REPT</button>
            </div>
            <div class="wm-volrow">
              <span class="ico" id="volIcon" data-melo="volume-icon" title="Mute">
                <svg class="wv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19zM15.5 9.5a4 4 0 0 1 0 5"/></svg>
                <svg class="mu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19zM22 9l-6 6M16 9l6 6"/></svg>
              </span>
              <input class="wm-vol" type="range" id="volBar" data-melo="volume" min="0" max="100" value="60" aria-label="Volume" />
              <span class="wm-pct" id="volPct" data-melo="volume-pct"></span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
</body>
</html>
