<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Melo — Skyline</title>
<style>
/*
  SKYLINE — the default skin's cool sky-blue palette, turned on its side.
  Same tokens as the built-in player (slate card, Inter, hairline borders,
  round ghost buttons) but a different structure: instead of three columns,
  one SKY above and one SHEET below.
    sky   = night (dark) / day (light), tinted by the artwork accent. Title and
            artist float in it, the cover is the MOON (a circle with a halo)
            and the spectrum is the city SKYLINE rising behind the sheet.
    sheet = a rounded bottom sheet sliding over the sky: seek line, then
            [codec badges | transport | volume].
  Queue / Lyrics swap in as a frosted glass panel over the sky.
*/
:root,
:root[data-theme="dark"],
[data-theme="dark"] {
  --sk-card: #1b2432;
  --sk-card-border: rgba(255,255,255,0.08);
  --sk-text: #e6eef8;
  --sk-soft: #9aadc8;
  --sk-muted: #7d8fa8;
  --sk-track: #243044;
  --sk-badge-bg: #253142;
  --sk-badge-text: #8da2bb;
  --sk-hover: rgba(255,255,255,0.07);
  --sk-sky: linear-gradient(180deg, #09101f 0%, #112240 52%, color-mix(in srgb, var(--sk-accent) 34%, #1b3358) 100%);
  --sk-ink: #ffffff;
  --sk-ink-2: rgba(255,255,255,0.76);
  --sk-ink-3: rgba(255,255,255,0.52);
  --sk-hill-1: rgba(120,160,230,0.14);
  --sk-hill-2: rgba(120,160,230,0.075);
  --sk-glass: rgba(9,16,31,0.66);
  --sk-glass-ink: #eef4fc;
  --sk-capsule: rgba(255,255,255,0.12);
  --sk-tab-bg: #ffffff;
  --sk-tab-fg: #12263f;
  --sk-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.3);
  --sk-sheet-shadow: 0 -10px 28px rgba(0,0,0,0.30);
}
:root[data-theme="light"],
[data-theme="light"] {
  --sk-card: #ffffff;
  --sk-card-border: rgba(0,0,0,0.07);
  --sk-text: #1a2430;
  --sk-soft: #6b7a8f;
  --sk-muted: #8a9bb2;
  --sk-track: #e6ebf2;
  --sk-badge-bg: #e9eef3;
  --sk-badge-text: #6e7f96;
  --sk-hover: rgba(20,40,70,0.06);
  --sk-sky: linear-gradient(180deg, color-mix(in srgb, var(--sk-accent) 26%, #a6c9f0) 0%, #cde0f8 55%, #eef5fd 100%);
  --sk-ink: #10263f;
  --sk-ink-2: rgba(16,38,63,0.74);
  --sk-ink-3: rgba(16,38,63,0.52);
  --sk-hill-1: rgba(255,255,255,0.40);
  --sk-hill-2: rgba(255,255,255,0.24);
  --sk-glass: rgba(255,255,255,0.76);
  --sk-glass-ink: #10263f;
  --sk-capsule: rgba(255,255,255,0.58);
  --sk-tab-bg: #10263f;
  --sk-tab-fg: #ffffff;
  --sk-shadow: 0 16px 48px rgba(30,50,80,0.15), 0 2px 8px rgba(30,50,80,0.08);
  --sk-sheet-shadow: 0 -8px 24px rgba(30,60,110,0.14);
}
:root {
  --sk-accent: var(--accent, #4e9eff);
  --sk-accent-fill: color-mix(in srgb, var(--sk-accent) 82%, #000);
  --sk-danger: #ef4444;
  --sk-moon: clamp(84px, 21cqw, 176px);
  --sk-moon-gap: clamp(20px, 7cqw, 70px);
}

* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; min-height: 100%; }
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
body {
  color: var(--sk-text);
  background: #101822;
  font-family: Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
body:not(.tauri-main):has(#melo-player) { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b1119; }
[data-theme="light"] body:not(.tauri-main):has(#melo-player) { background: #c5d3e4; }

#melo-player,
body.tauri-main .player-card,
body.custom-skin-active .player-card {
  position: relative;
  width: 720px; height: 400px;
  min-width: 340px; min-height: 210px;
  overflow: hidden;
  color: var(--sk-text);
  background: var(--sk-card);
  border: 1px solid var(--sk-card-border);
  border-radius: 16px;
  box-shadow: var(--sk-shadow);
}
body.tauri-main,
body.tauri-main .app-shell { min-width: 0 !important; }
body.tauri-main .player-card,
body.custom-skin-active .player-card {
  width: 100% !important; height: 100vh !important;
  min-width: 340px !important; min-height: 210px !important;
  max-width: 960px !important; max-height: 560px !important;
  margin: 0 auto !important; border-radius: 16px !important; box-shadow: none !important;
}

.sk-root { position: absolute; inset: 0; overflow: hidden; container-type: size; display: grid; grid-template-rows: minmax(0, 1fr) auto; }

/* ── The sky ── */
.sk-hero { position: relative; min-height: 0; overflow: hidden; background: var(--sk-sky); color: var(--sk-ink); transition: background .5s ease; }
.sk-stars {
  position: absolute; inset: 0 0 38% 0; pointer-events: none; opacity: 0.85;
  background-image:
    radial-gradient(1.3px 1.3px at 7% 24%, #fff, transparent 60%),
    radial-gradient(1px 1px at 14% 62%, #fff, transparent 60%),
    radial-gradient(1.5px 1.5px at 23% 18%, #fff, transparent 60%),
    radial-gradient(1px 1px at 31% 48%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 40% 14%, #fff, transparent 60%),
    radial-gradient(1px 1px at 47% 70%, #fff, transparent 60%),
    radial-gradient(1.4px 1.4px at 55% 30%, #fff, transparent 60%),
    radial-gradient(1px 1px at 63% 12%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 70% 56%, #fff, transparent 60%),
    radial-gradient(1px 1px at 78% 22%, #fff, transparent 60%),
    radial-gradient(1.4px 1.4px at 88% 40%, #fff, transparent 60%),
    radial-gradient(1px 1px at 94% 16%, #fff, transparent 60%);
  animation: sk-twinkle 6s ease-in-out infinite alternate;
}
[data-theme="light"] .sk-stars { display: none; }
.sk-cloud { position: absolute; display: none; border-radius: 50%; background: rgba(255,255,255,0.65); filter: blur(16px); pointer-events: none; }
[data-theme="light"] .sk-cloud { display: block; }
.sk-cloud.c1 { left: 6%; top: 18%; width: 170px; height: 46px; }
.sk-cloud.c2 { left: 46%; top: 38%; width: 220px; height: 54px; opacity: 0.8; }
.sk-hills { position: absolute; left: 0; right: 0; bottom: 0; height: 64%; pointer-events: none; background: linear-gradient(180deg, var(--sk-hill-1), transparent 92%);
  clip-path: polygon(0 60%, 7% 46%, 16% 56%, 27% 34%, 37% 52%, 49% 38%, 60% 58%, 72% 36%, 85% 54%, 93% 42%, 100% 56%, 100% 100%, 0 100%); }
.sk-hills.b { height: 46%; background: linear-gradient(180deg, var(--sk-hill-2), transparent 95%);
  clip-path: polygon(0 52%, 11% 62%, 22% 42%, 34% 60%, 46% 40%, 58% 56%, 69% 38%, 81% 58%, 91% 44%, 100% 54%, 100% 100%, 0 100%); }

/* title bar floats on the sky */
.sk-bar { position: absolute; z-index: 6; top: 0; left: 0; right: 0; height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; -webkit-app-region: drag; user-select: none; }
.sk-menu { position: relative; z-index: 120; -webkit-app-region: no-drag; }
.sk-menu > input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.sk-brand { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--sk-ink); transition: background .14s ease; }
.sk-brand:hover { background: var(--sk-capsule); }
.sk-brand .mark { width: 16px; height: 16px; }
.sk-brand .caret { width: 10px; height: 10px; opacity: 0.7; transition: transform .16s ease; }
.sk-menu > input:checked ~ .sk-brand .caret { transform: rotate(180deg); }
.sk-flyout {
  position: absolute; top: 34px; left: 0; z-index: 200; width: 186px; padding: 5px;
  display: none; flex-direction: column; gap: 1px;
  background: var(--sk-card); color: var(--sk-text); border: 1px solid var(--sk-card-border);
  border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,0.35);
  animation: sk-pop .16s ease;
}
.sk-menu > input:checked ~ .sk-flyout { display: flex; }
.sk-item { height: 32px; padding: 0 10px; display: flex; align-items: center; gap: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.sk-item:hover { background: var(--sk-hover); }
.sk-item svg { width: 15px; height: 15px; color: var(--sk-soft); flex: 0 0 15px; }
.sk-dismiss { position: fixed; inset: 0; z-index: 150; display: none; }
.sk-menu > input:checked ~ .sk-dismiss { display: block; }

/* stage switch: a glass capsule in the middle of the sky */
.sk-tabs { margin: 0 auto; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sk-capsule); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); -webkit-app-region: no-drag; }
.sk-tabs button.stage-btn { width: 32px; height: 24px; padding: 0; border: 0; border-radius: 999px; display: grid; place-items: center; background: transparent; color: var(--sk-ink-2); cursor: pointer; transition: background .14s ease, color .14s ease; }
.sk-tabs button.stage-btn:hover { background: var(--sk-capsule); color: var(--sk-ink); }
.sk-tabs button.stage-btn.active { background: var(--sk-tab-bg); color: var(--sk-tab-fg); }
.sk-tabs button.stage-btn svg { width: 14px; height: 14px; }

.sk-tools { display: flex; align-items: center; gap: 1px; -webkit-app-region: no-drag; }
.sk-tools button { width: 30px; height: 28px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--sk-ink-2); cursor: pointer; transition: background .12s ease, color .12s ease; }
.sk-tools button:hover { background: var(--sk-capsule); color: var(--sk-ink); }
.sk-tools svg { width: 15px; height: 15px; }
.sk-tools .sep { width: 1px; height: 14px; margin: 0 5px; background: var(--sk-ink-3); opacity: 0.5; }
.sk-tools button.close:hover { background: var(--sk-danger); color: #fff; }

/* title block + moon */
.sk-info {
  position: absolute; z-index: 2; left: 28px; top: 58px;
  right: calc(var(--sk-moon) + var(--sk-moon-gap) + 28px);
  display: flex; flex-direction: column; gap: 3px; text-shadow: 0 1px 14px rgba(0,0,0,0.18);
}
.sk-title {
  font-size: clamp(24px, 4.6cqw, 40px); font-weight: 700; line-height: 1.12; letter-spacing: -0.025em;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.sk-artist { font-size: clamp(14px, 2.2cqw, 17px); font-weight: 500; line-height: 1.3; color: var(--sk-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-album { font-size: 12.5px; line-height: 1.3; color: var(--sk-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-album:empty { display: none; }

/* star rating, under the album. Melo fills .sk-rating with five .rate-star buttons (.on = filled) for the playing track and keeps the row's space
   while no track is loaded. Stars are warm "starlight" (gold) so they read against the night sky and the accent colour alike; in the light theme a
   deeper amber. The hover preview is tagged by Melo: .pv-add = would fill (dimmer star), .pv-remove = would empty (dimmed lit star).
   Selectors out-rank the app's own .track-rating / .rate-star rules; .pv-remove comes after .on on purpose. */
.sk-info .sk-rating { --sk-star: #ffd36b; --sk-star-glow: rgba(255,211,107,0.55); align-self: flex-start; gap: 0; margin: 3px 0 0 -2px; min-height: 22px; }
[data-theme="light"] .sk-info .sk-rating { --sk-star: #e0920a; --sk-star-glow: transparent; }
.sk-info .sk-rating .rate-star { width: 21px; height: 22px; padding: 0; background: none; border: 0; cursor: pointer; text-align: center; font-size: 17px; line-height: 22px;
  color: var(--sk-ink-3); opacity: .45; text-shadow: none; transition: color .14s ease, opacity .14s ease, transform .14s ease; }
.sk-info .sk-rating .rate-star:hover { transform: translateY(-1px); }
.sk-info .sk-rating .rate-star.on { color: var(--sk-star); opacity: 1; text-shadow: 0 0 10px var(--sk-star-glow); }
.sk-info .sk-rating .rate-star.pv-add { color: var(--sk-star); opacity: .5; text-shadow: none; }
.sk-info .sk-rating .rate-star.pv-remove { opacity: .45; text-shadow: none; }
.sk-info .sk-rating .rate-star:focus-visible { outline: 2px solid var(--sk-accent); outline-offset: -2px; border-radius: 4px; }
@container (max-height: 340px) { .sk-info .sk-rating { min-height: 18px; margin-top: 1px; } .sk-info .sk-rating .rate-star { width: 17px; height: 18px; font-size: 14px; line-height: 18px; } }

.sk-lyric { display: none; flex-direction: column; margin-top: 8px; }
html.melo-lyric-skin-on .sk-lyric { display: flex; }
.sk-lyric [data-melo="current-lyric"] {
  align-self: flex-start; max-width: 100%; cursor: pointer; font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--sk-ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sk-lyric [data-melo="current-lyric"]::after {
  content: ""; display: block; height: 2px; margin-top: 3px; border-radius: 1px; background: var(--sk-accent);
  transform-origin: left; transform: scaleX(var(--melo-lyric-progress, 0)); transition: transform .2s linear;
}
.sk-lyric [data-melo="next-lyric"] { font-size: 12px; line-height: 1.3; color: var(--sk-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-lyric .melo-lyric-tick { animation: sk-lyric .3s ease both; }
@keyframes sk-lyric { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.sk-moon {
  position: absolute; z-index: 3; top: 56px; right: var(--sk-moon-gap); width: var(--sk-moon); height: var(--sk-moon);
  border-radius: 50%; overflow: hidden; background: var(--sk-track);
  box-shadow: 0 0 0 6px rgba(255,255,255,0.08), 0 0 0 15px rgba(255,255,255,0.035), 0 20px 60px color-mix(in srgb, var(--sk-accent) 55%, transparent);
}
.sk-moon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sk-moon-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #8fb9e8 0%, #d6b8e0 50%, #f0c9a8 100%); }
.sk-moon-fallback svg { width: 38%; height: 38%; }

/* the spectrum is the skyline: it rises from behind the sheet */
.sk-viz-wrap { position: absolute; z-index: 1; left: 0; right: 0; bottom: 14px; height: clamp(76px, 26%, 108px); }
.sk-viz { position: absolute !important; inset: 0 !important; width: auto !important; height: auto !important; display: block !important; overflow: hidden !important; cursor: pointer; padding: 0 12px !important; }
.sk-viz canvas { width: 100% !important; height: 100% !important; display: block; }

/* queue / lyrics: frosted glass panel over the sky; the sky scenery stands down */
html.melo-show-playlist .sk-info, html.melo-show-lyrics .sk-info,
html.melo-show-playlist .sk-moon, html.melo-show-lyrics .sk-moon,
html.melo-show-playlist .sk-viz-wrap, html.melo-show-lyrics .sk-viz-wrap { display: none !important; }
.sk-panel {
  position: absolute; z-index: 4; left: 16px; right: 16px; top: 46px; bottom: 26px; display: none; flex-direction: column; overflow: hidden;
  border-radius: 16px; background: var(--sk-glass); color: var(--sk-glass-ink);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 0 0 1px rgba(255,255,255,0.10);
  animation: sk-pop .2s ease;
}
html.melo-show-playlist .sk-panel, html.melo-show-lyrics .sk-panel { display: flex; }
.sk-panel-head { flex: 0 0 38px; display: flex; align-items: center; padding: 0 18px; font-size: 12px; font-weight: 650; letter-spacing: 0.03em; text-transform: uppercase; opacity: 0.7; }
html.melo-show-playlist .sk-panel-head::after { content: "Queue"; }
html.melo-show-lyrics .sk-panel-head::after { content: "Lyrics"; }
.sk-panel-body { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.sk-panel-body [data-melo="embedded-playlist"], .sk-panel-body [data-melo="embedded-lyrics"] { display: none; height: 100%; }
html.melo-show-playlist .sk-panel-body [data-melo="embedded-playlist"], html.melo-show-lyrics .sk-panel-body [data-melo="embedded-lyrics"] { display: block; }
.sk-panel-body .embedded-lyrics-title { display: none; }
.sk-panel-body .embedded-playlist, .sk-panel-body .embedded-lyrics {
  height: 100% !important; max-height: 100% !important; overflow-y: auto !important; overflow-x: hidden !important;
  padding: 0 8px 8px !important; scrollbar-width: thin; scrollbar-color: rgba(128,150,180,0.5) transparent;
}
.sk-panel-body ::-webkit-scrollbar { width: 6px; }
.sk-panel-body ::-webkit-scrollbar-thumb { background: rgba(128,150,180,0.5); border-radius: 3px; }
.sk-panel-body ::-webkit-scrollbar-track { background: transparent; }
.sk-panel-body .embedded-playlist-mini .embedded-playlist-row { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 4px 10px !important; border-radius: 10px; font-size: 13px !important; color: var(--sk-glass-ink); }
.sk-panel-body .embedded-playlist-mini .embedded-playlist-row:hover { background: rgba(128,150,180,0.18); }
.sk-panel-body .embedded-playlist-mini .embedded-playlist-row .t-title { font-size: 13px !important; line-height: 1.3 !important; font-weight: 500 !important; color: var(--sk-glass-ink); }
.sk-panel-body .embedded-playlist-mini .embedded-playlist-row.active { background: color-mix(in srgb, var(--sk-accent) 30%, transparent); }
.sk-panel-body .embedded-playlist-mini .embedded-playlist-row.active .t-title { font-weight: 650 !important; }
.sk-panel-body .embedded-playlist-mini .track-cover-mini { width: 24px !important; height: 24px !important; border-radius: 6px; }
.sk-panel-body .embedded-playlist-empty { padding: 18px 10px; font-size: 13px; opacity: 0.6; }
.sk-panel-body .embedded-playlist-more { width: 100%; margin-top: 4px; padding: 8px 12px; border: 0; border-radius: 10px; background: rgba(128,150,180,0.2); color: inherit; font-family: inherit; font-size: 12px; cursor: pointer; }
.sk-panel-body .lyric-line { padding: 6px 12px; border-radius: 8px; font-size: 15px; line-height: 1.5; color: var(--sk-glass-ink); opacity: 0.5; text-align: left; white-space: normal; overflow-wrap: anywhere; transition: opacity .15s ease; }
.sk-panel-body .lyric-line.active { opacity: 1; font-weight: 650; }

/* ── The sheet ── */
.sk-sheet {
  position: relative; z-index: 5; margin-top: -20px; padding: 12px 22px 14px;
  background: var(--sk-card); border-radius: 22px 22px 0 0; box-shadow: var(--sk-sheet-shadow);
  display: flex; flex-direction: column; gap: 6px;
}
.sk-seek { display: flex; align-items: center; gap: 12px; height: 22px; color: var(--sk-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
.sk-time { flex: 0 0 auto; min-width: 38px; text-align: center; white-space: nowrap; }
.sk-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; min-height: 56px; }

.sk-badges { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 11.5px; color: var(--sk-muted); white-space: nowrap; overflow: hidden; }
.sk-badges [data-melo="codec"] { padding: 2px 6px; border-radius: 5px; background: var(--sk-badge-bg); color: var(--sk-badge-text); font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; }
.sk-badges [data-melo="codec"]:empty { display: none; }

.sk-transport { display: flex; align-items: center; gap: 6px; }
.sk-transport button { display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--sk-text); cursor: pointer; transition: background .14s ease, color .14s ease, transform .1s ease; }
.sk-transport button:hover { background: var(--sk-track); }
.sk-transport button.sm { width: 34px; height: 34px; color: var(--sk-soft); }
.sk-transport button.sm svg { width: 17px; height: 17px; }
.sk-transport button.sm[data-melo="stop"] { color: var(--sk-text); } /* same ink as prev / next, not the dimmer shuffle / repeat ink */
.sk-transport button.sm.active { color: var(--sk-accent); background: color-mix(in srgb, var(--sk-accent) 14%, transparent); }
.sk-transport button.skip { width: 40px; height: 40px; }
.sk-transport button.skip svg { width: 19px; height: 19px; }
.sk-transport button:active { transform: scale(.93); }
.sk-transport button.play { width: 52px; height: 52px; margin: 0 4px; background: var(--sk-accent-fill); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--sk-accent) 42%, transparent); }
.sk-transport button.play:hover { background: color-mix(in srgb, var(--sk-accent-fill) 88%, #fff); transform: scale(1.05); }
.sk-transport button.play svg { width: 22px; height: 22px; }

.sk-vol { justify-self: end; display: flex; align-items: center; gap: 8px; min-width: 0; }
.sk-vol-icon { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; color: var(--sk-soft); cursor: pointer; flex: 0 0 26px; }
.sk-vol-icon:hover { background: var(--sk-track); color: var(--sk-text); }
.sk-vol-icon.muted { color: var(--sk-danger); }
.sk-vol-icon svg { width: 16px; height: 16px; }
.sk-vol .sk-range { width: 108px; }
.sk-vol-pct { min-width: 30px; text-align: right; font-size: 11px; color: var(--sk-soft); font-variant-numeric: tabular-nums; }

/* sliders: the default skin's 4px track + white thumb */
.sk-range { -webkit-appearance: none; appearance: none; height: 20px; margin: 0; background: transparent; cursor: pointer; outline: none; }
input[data-melo="seek"] { flex: 1 1 0; min-width: 60px; }
.sk-range::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: linear-gradient(to right, var(--sk-accent) 0%, var(--sk-accent) var(--progress, 0%), var(--sk-track) var(--progress, 0%), var(--sk-track) 100%); }
.sk-range.vol::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--sk-accent) 0%, var(--sk-accent) var(--vol, 60%), var(--sk-track) var(--vol, 60%), var(--sk-track) 100%); }
.sk-range::-moz-range-track { height: 4px; border-radius: 999px; background: var(--sk-track); }
.sk-range::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--sk-accent); }
.sk-range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.3); transition: transform .12s ease; }
.sk-range:hover::-webkit-slider-thumb { transform: scale(1.15); }
.sk-range::-moz-range-thumb { width: 14px; height: 14px; border: 1px solid rgba(0,0,0,0.08); border-radius: 50%; background: #fff; }

button { font-family: inherit; }
button:focus-visible, .sk-brand:focus-visible, .sk-item:focus-visible, .sk-range:focus-visible, .sk-vol-icon:focus-visible { outline: 2px solid var(--sk-accent); outline-offset: 2px; }

/* Responsive: everything below reacts to the real size of the card (container queries on .sk-root),
   so nothing can leave the frame even if the window ends up smaller than data-min-*. */
@container (max-width: 680px) {
  .sk-vol .sk-range { width: 80px; }
  .sk-vol-pct, [data-melo="specs"] { display: none; }
  .sk-sheet { padding-left: 16px; padding-right: 16px; }
}
@container (max-width: 600px) {
  .sk-badges { visibility: hidden; } /* keep the grid cell so the transport stays centred */
  .sk-bar { padding-left: 6px; gap: 4px; }
  .sk-tools button { width: 27px; }
  .sk-info { left: 20px; }
  .sk-row { gap: 8px; }
  .sk-vol .sk-range { width: 64px; }
}
@container (max-width: 540px) {
  .sk-tools button[data-melo="toggle-playlist"], .sk-tools button[data-melo="toggle-lyrics"] { display: none; }
  .sk-sheet { padding-left: 12px; padding-right: 12px; }
}
@container (max-width: 480px) {
  .sk-tools button[data-melo="toggle-library"], .sk-tools button[data-melo="toggle-eq"] { display: none; }
  .sk-tabs button.stage-btn { width: 28px; }
  .sk-brand .caret { display: none; }
  .sk-transport { gap: 2px; }
  .sk-transport button.sm { width: 28px; height: 28px; }
  .sk-transport button.skip { width: 34px; height: 34px; }
  .sk-vol .sk-range { width: 52px; }
  .sk-vol { gap: 4px; }
  .sk-time { min-width: 32px; font-size: 11px; }
  .sk-seek { gap: 8px; }
}
@container (max-width: 400px) {
  .sk-vol .sk-range { display: none; }
  .sk-brand { padding: 0 6px; }
  .sk-info { left: 14px; }
  .sk-sheet { padding-left: 10px; padding-right: 10px; }
}
@container (max-height: 380px) {
  .sk-title { -webkit-line-clamp: 1; }
  .sk-info { top: 52px; }
  .sk-moon { top: 50px; }
  .sk-transport button.play { width: 46px; height: 46px; }
  .sk-row { min-height: 48px; }
}
@container (max-height: 340px) {
  .sk-hero { --sk-moon: clamp(72px, 17cqw, 120px); }
  .sk-title { font-size: clamp(20px, 4cqw, 28px); }
  .sk-album { display: none; }
  .sk-info { top: 48px; gap: 1px; }
  .sk-moon { top: 46px; }
  .sk-viz-wrap { height: 58px; bottom: 12px; }
  .sk-sheet { padding-top: 8px; padding-bottom: 10px; gap: 2px; }
  .sk-seek { height: 20px; }
  .sk-row { min-height: 42px; }
  .sk-transport button.play { width: 42px; height: 42px; }
  .sk-transport button.play svg { width: 19px; height: 19px; }
  .sk-transport button.skip { width: 34px; height: 34px; }
  .sk-transport button.sm { width: 30px; height: 30px; }
  .sk-panel { top: 42px; bottom: 22px; }
  .sk-lyric { margin-top: 4px; }
  .sk-lyric [data-melo="next-lyric"] { display: none; }
}
@container (max-height: 290px) {
  .sk-hero { --sk-moon: clamp(60px, 15cqw, 96px); }
  .sk-bar { height: 38px; }
  .sk-info { top: 42px; }
  .sk-moon { top: 40px; }
  .sk-artist { font-size: 13px; }
  .sk-lyric { display: none !important; }
  .sk-hills { display: none; }
  .sk-viz-wrap { height: 46px; bottom: 10px; }
  .sk-sheet { margin-top: -16px; padding: 6px 12px 8px; }
  .sk-seek { height: 18px; }
  .sk-row { min-height: 38px; }
  .sk-transport button.play { width: 38px; height: 38px; }
  .sk-transport button.skip { width: 30px; height: 30px; }
  .sk-transport button.sm { width: 26px; height: 26px; }
  .sk-panel { top: 38px; bottom: 20px; left: 10px; right: 10px; }
  .sk-panel-head { flex-basis: 30px; }
}
@container (max-height: 240px) {
  .sk-moon { display: none; }
  .sk-info { right: 16px; }
  .sk-viz-wrap { height: 36px; }
  .sk-title { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
@keyframes sk-twinkle { from { opacity: 0.55; } to { opacity: 0.95; } }
@keyframes sk-pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* Waveform seek bar (optional: Settings → Waveform seek bar; see skins/README.md §5.7b) */
[data-melo="waveform"] {
  --melo-wave-played: var(--sk-accent);
  --melo-wave-rest: color-mix(in srgb, var(--sk-text) 24%, transparent);
  display: none; position: relative; flex: 1 1 0; min-width: 0; width: 100%; height: 22px;
  align-self: center; cursor: pointer; touch-action: none; -webkit-app-region: no-drag;
}
html.melo-wave-on [data-melo="waveform"] { display: block; }
html.melo-wave-on #seekBar,
html.melo-wave-on [data-melo="seek"] { position: absolute !important; width: 1px !important; height: 1px !important; opacity: 0 !important; pointer-events: none !important; }
</style>
</head>
<body data-window-width="720" data-window-height="400" data-min-width="420" data-min-height="250" data-max-width="960" data-max-height="560" data-resizable="true">
<div id="melo-player">
  <div class="sk-root">

    <section class="sk-hero">
      <i class="sk-stars"></i><i class="sk-cloud c1"></i><i class="sk-cloud c2"></i>
      <i class="sk-hills b"></i><i class="sk-hills"></i>

      <header class="sk-bar" data-tauri-drag-region>
        <div class="sk-menu">
          <input id="skMenuToggle" type="checkbox">
          <label class="sk-brand" for="skMenuToggle" title="Menu">
            <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h2l1-7 2 14 3-10 2 6h2l2-9 2 14 2-7h2"/></svg>
            Melo
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </label>
          <div class="sk-flyout">
            <label class="sk-item" for="skMenuToggle" data-melo="add-files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 11v6M9 14h6"/></svg>Add files</label>
            <label class="sk-item" for="skMenuToggle" data-melo="add-folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10v5M9.5 12.5h5"/></svg>Add folder</label>
            <label class="sk-item" for="skMenuToggle" data-melo="theme-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Switch theme</label>
          </div>
          <label class="sk-dismiss" for="skMenuToggle" aria-label="Close menu"></label>
        </div>

        <nav class="sk-tabs" aria-label="Stage">
          <button type="button" class="stage-btn active" data-melo="toggle-embedded-viz" title="Skyline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M9 20V4M14 20v-7M19 20V8"/></svg></button>
          <button type="button" class="stage-btn" data-melo="toggle-embedded-lyrics" title="Lyrics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
          <button type="button" class="stage-btn" data-melo="toggle-embedded-playlist" title="Queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M4 11h12M4 16h7M16 14v6l5-3z"/></svg></button>
        </nav>

        <div class="sk-tools">
          <button type="button" data-melo="toggle-library" title="Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></svg></button>
          <button type="button" data-melo="toggle-playlist" title="Playlist window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M8 10h8M8 14h5"/></svg></button>
          <button type="button" data-melo="toggle-eq" title="Equalizer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 14h3v7H3zM9 10h3v11H9zM15 6h3v15h-3z"/></svg></button>
          <button type="button" data-melo="toggle-lyrics" title="Lyrics window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
          <button type="button" data-melo="toggle-settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
          <span class="sep"></span>
          <button type="button" data-melo="minimize" aria-label="minimize" title="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
          <button type="button" class="close" data-melo="close" aria-label="close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </header>

      <div class="sk-viz-wrap"><div class="sk-viz" data-melo="visualizer" data-bars="56"></div></div>

      <div class="sk-info">
        <div class="sk-title" data-melo="title">No track loaded</div>
        <div class="sk-artist" data-melo="artist">Add music to start playing</div>
        <div class="sk-album" data-melo="album"></div>
        <div class="sk-rating" data-melo="rating"></div>
        <div class="sk-lyric">
          <div data-melo="current-lyric" aria-live="polite" title="Click to seek"></div>
          <div data-melo="next-lyric"></div>
        </div>
      </div>

      <div class="sk-moon">
        <div class="sk-moon-fallback" data-melo="cover-fallback" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 35V12l20-4v22"/><circle cx="13" cy="35" r="5"/><circle cx="33" cy="30" r="5"/></svg></div>
        <img data-melo="cover" alt="Cover" style="display:none">
      </div>

      <div class="sk-panel">
        <div class="sk-panel-head"></div>
        <div class="sk-panel-body">
          <div data-melo="embedded-playlist"></div>
          <div data-melo="embedded-lyrics"></div>
        </div>
      </div>
    </section>

    <section class="sk-sheet">
      <div class="sk-seek">
        <span class="sk-time" data-melo="current-time">0:00</span>
        <div data-melo="waveform"></div>
        <input class="sk-range" type="range" data-melo="seek" min="0" max="100" value="0" aria-label="Seek">
        <span class="sk-time" data-melo="duration">0:00</span>
      </div>

      <div class="sk-row">
        <div class="sk-badges"><span data-melo="codec"></span><span data-melo="specs"></span></div>

        <div class="sk-transport">
          <button type="button" class="sm" data-melo="shuffle" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
          <button type="button" class="skip" data-melo="prev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20 9 12l10-8z"/><rect x="5" y="4" width="3" height="16" rx="1"/></svg></button>
          <button type="button" class="play" data-melo="play" title="Play / Pause">
            <svg data-melo="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg>
            <svg data-melo="play-icon" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M7 4.5 19 12 7 19.5z"/></svg>
          </button>
          <button type="button" class="sm" data-melo="stop" title="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
          <button type="button" class="skip" data-melo="next" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8L5 20z"/><rect x="16" y="4" width="3" height="16" rx="1"/></svg></button>
          <button type="button" class="sm" data-melo="repeat" title="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
        </div>

        <div class="sk-vol">
          <span class="sk-vol-icon" data-melo="volume-icon" title="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></span>
          <input class="sk-range vol" type="range" data-melo="volume" min="0" max="100" value="60" aria-label="Volume">
          <span class="sk-vol-pct" data-melo="volume-pct">60%</span>
        </div>
      </div>
    </section>

  </div>
</div>
</body>
</html>
