<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Melo Skin — Vertical Player (Example)</title>

<!--
  =====================================================================
  MELO SKIN CONTRACT — read this first
  =====================================================================
  A full skin is a single .html file. When imported, Melo takes the
  inner HTML of the element with id="melo-player" and uses it to replace
  the entire player card. Your own <style> is injected into the app.

  You can use ANY layout, ANY size, and ANY shape: horizontal, vertical,
  grid, circular, etc. Move buttons anywhere, use text labels instead of
  icons, show or hide any control, and resize the visualizer.

  ---------------------------------------------------------------------
  1) DECLARE THE WINDOW SIZE
  ---------------------------------------------------------------------
  Add a <meta name="melo-window"> tag. Melo reads it and resizes the
  native window to match. All values are logical pixels.

    content="width=340, height=560,
             minWidth=300, minHeight=420,
             maxWidth=560, maxHeight=900,
             resizable=true, transparent=true"

  - width / height : initial window size.
  - minWidth / minHeight / maxWidth / maxHeight : resize limits.
  - resizable : "true" lets the user drag-resize the window.
  - transparent : "false" gives an opaque window (advanced).

  If the tag is omitted, Melo uses the default 960x240 window.

  ---------------------------------------------------------------------
  2) REQUIRED IDS (only include the features you want)
  ---------------------------------------------------------------------
  Each id hooks up one piece of behaviour. If you omit an id, that
  feature simply won't be present in your skin.

  Track display : trackTitle, trackArtist, trackAlbum, trackCodec,
                  trackSpecs
  Cover art     : coverWrap, coverImg (img), coverFallback (div/span)
  Transport     : btnPlay, iconPlay, iconPause, btnPrev, btnNext,
                  btnStop, btnShuffle, btnRepeat
  Seek          : seekBar (input[type=range]), curTime, durTime
  Volume        : volBar (input[type=range]), volIcon, volPct
  Visualizer    : vizBars (a canvas is created inside it automatically)
  Toolbar       : btnAddFiles, btnAddFolder, btnThemeToggle, btnAbout
  Panel toggles : btnToggleLibrary, btnTogglePlaylist, btnToggleEq,
                  btnToggleLyrics, btnOpenSettings
  Window        : an element with [data-tauri-drag-region] is the
                  draggable title bar; add aria-label="minimize" and
                  aria-label="close" buttons for window chrome.

  Buttons can contain SVG, text, emoji, images — anything. For example
  <button id="btnToggleLibrary">Library</button> is perfectly valid.

  ---------------------------------------------------------------------
  3) VISUALIZER
  ---------------------------------------------------------------------
  <div id="vizBars" data-bars="40"></div>
  data-bars overrides the number of bars/columns for the "Classic Bars",
  "Thin Bars", and "Mirror Bars" modes. It does not affect the wave or
  block-equalizer modes. Any positive integer works; 24–64 looks best.
  The canvas always fills its container, so you control size purely with
  CSS (width / height).

  ---------------------------------------------------------------------
  4) CSS VARIABLES YOU CAN OVERRIDE
  ---------------------------------------------------------------------
  --card, --card-border, --text, --text-soft, --text-muted, --accent,
  --track-bg, --visualizer, --visualizer-soft, --shadow
  These drive the default look, but you may write any CSS you like.
  =====================================================================
-->

<meta name="melo-window"
      content="width=340, height=580, minWidth=300, minHeight=460, maxWidth=520, maxHeight=900, resizable=true, transparent=true" />

<style>
  :root {
    --card: #0f1115;
    --card-border: rgba(255,255,255,0.08);
    --text: #f5f7fa;
    --text-soft: #b3bcc9;
    --text-muted: #737d8c;
    --accent: #7c9cff;
    --track-bg: #1a1e26;
    --visualizer: #7c9cff;
    --shadow: 0 24px 60px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }

  /* The root of your skin fills the whole window. */
  #melo-player {
    width: 100%;
    height: 100vh;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(124,156,255,0.18), transparent 60%),
      linear-gradient(180deg, #151923 0%, #0c0e13 100%);
    color: var(--text);
    border-radius: 18px;
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 12px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  /* Draggable title bar */
  .titlebar {
    -webkit-app-region: drag;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 26px;
    flex-shrink: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--text-soft);
  }
  .win-controls { -webkit-app-region: no-drag; display: flex; gap: 4px; }
  .win-btn {
    width: 26px; height: 22px; border: none; border-radius: 6px;
    background: transparent; color: var(--text-soft);
    cursor: pointer; font-size: 13px; display: grid; place-items: center;
  }
  .win-btn:hover { background: var(--track-bg); color: var(--text); }
  .win-btn.close:hover { background: #e5484d; color: #fff; }

  /* Big square cover */
  .cover-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #0a0c11;
    box-shadow: 0 18px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
    margin: 0 auto;
  }
  .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-fallback {
    width: 100%; height: 100%; display: grid; place-items: center;
    font-size: 56px; color: var(--accent);
    background: linear-gradient(135deg, #1b2030, #0a0c11);
  }

  /* Track meta */
  .meta { text-align: center; min-height: 52px; }
  .track-title {
    font-size: 17px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-artist { font-size: 13px; color: var(--text-soft); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-album { font-size: 11px; color: var(--text-muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-format { display: none; }

  /* Visualizer: tall block, 40 bars via data-bars */
  .viz {
    height: 90px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    overflow: hidden;
  }
  .viz canvas { width: 100% !important; height: 100% !important; display: block; }

  /* Seek */
  .seek-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); }
  input[type=range].seek {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 5px; border-radius: 999px; background: var(--track-bg); outline: none;
  }
  input[type=range].seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent); cursor: pointer;
  }

  /* Transport — laid out in a row, equal width */
  .transport {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: center;
    gap: 4px;
  }
  .transport button {
    border: none; background: transparent; color: var(--text-soft);
    height: 40px; border-radius: 10px; cursor: pointer;
    display: grid; place-items: center; transition: all 0.15s;
  }
  .transport button:hover { background: var(--track-bg); color: var(--text); }
  .transport button.active { color: var(--accent); }
  .transport svg { width: 18px; height: 18px; }
  .transport .play-btn {
    background: var(--accent);
    color: #0c0e13;
    height: 48px; border-radius: 14px;
  }
  .transport .play-btn:hover { background: #94afff; color: #0c0e13; }
  .transport .play-btn svg { width: 22px; height: 22px; }

  /* Volume */
  .volume-row { display: flex; align-items: center; gap: 8px; color: var(--text-soft); }
  .volume-row input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 999px; background: var(--track-bg);
  }
  .volume-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }

  /* Library/panels — here shown as TEXT buttons instead of icons,
     demonstrating that you can replace any icon with a label. */
  .panels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }
  .panels button {
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.03);
    color: var(--text-soft);
    font-size: 10px; font-weight: 600;
    padding: 8px 2px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .panels button:hover { background: var(--track-bg); color: var(--text); }
  .panels button.active { color: var(--accent); border-color: rgba(124,156,255,0.4); }

  /* Top toolbar with add/theme/about */
  .toolbar {
    display: flex; gap: 6px; justify-content: center; flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .toolbar button {
    flex: 1; border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.03); color: var(--text-soft);
    height: 30px; border-radius: 8px; cursor: pointer; font-size: 11px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .toolbar button:hover { background: var(--track-bg); color: var(--text); }
  .toolbar svg { width: 13px; height: 13px; }
</style>
</head>
<body>
<div id="melo-player">

  <!-- Draggable title bar + window controls -->
  <div class="titlebar" data-tauri-drag-region>
    <div class="brand">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 12h2l1-7 2 14 3-10 2 6h2l2-9 2 14 2-7h2"/></svg>
      MELO
    </div>
    <div class="win-controls">
      <button class="win-btn" aria-label="minimize" title="Minimize">&mdash;</button>
      <button class="win-btn close" aria-label="close" title="Close">&times;</button>
    </div>
  </div>

  <!-- Add / theme / about -->
  <div class="toolbar">
    <button id="btnAddFiles" title="Add files (Ctrl+O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      Files
    </button>
    <button id="btnAddFolder" title="Add folder (Ctrl+Shift+O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Folder
    </button>
    <button id="btnThemeToggle" title="Toggle light / dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      Theme
    </button>
    <button id="btnAbout" title="About Melo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      About
    </button>
  </div>

  <!-- Cover art -->
  <div class="cover-wrap" id="coverWrap">
    <img id="coverImg" src="" alt="cover" style="display:none" />
    <div id="coverFallback" class="cover-fallback">&#9834;</div>
  </div>

  <!-- Track information -->
  <div class="meta">
    <div class="track-title" id="trackTitle">No track loaded</div>
    <div class="track-artist" id="trackArtist">Add music to start playing</div>
    <div class="track-album" id="trackAlbum"></div>
    <div id="trackCodec" class="track-format"></div>
    <div id="trackSpecs" class="track-format"></div>
  </div>

  <!-- Visualizer: data-bars controls bar count for bar modes -->
  <div class="viz" id="vizBars" data-bars="40"></div>

  <!-- Seek bar -->
  <div class="seek-row">
    <span id="curTime">0:00</span>
    <input id="seekBar" type="range" min="0" max="276" value="0" />
    <span id="durTime">0:00</span>
  </div>

  <!-- Main transport -->
  <div class="transport">
    <button id="btnShuffle" title="Shuffle (S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 3h5v5"/><path d="M4 20l8-8"/><path d="M21 3l-8 8"/><path d="M16 21h5v-5"/><path d="M4 4l5 5"/><path d="M9 15l-5 5"/></svg>
    </button>
    <button id="btnPrev" title="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8z"/><rect x="5" y="4" width="3" height="16" rx="1"/></svg>
    </button>
    <button class="play-btn" id="btnPlay" title="Play/Pause (Space)">
      <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none;margin-left:2px"><path d="M7 4.5L19 12 7 19.5z"/></svg>
    </button>
    <button id="btnStop" title="Stop">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
    </button>
    <button id="btnNext" title="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8L5 20z"/><rect x="16" y="4" width="3" height="16" rx="1"/></svg>
    </button>
  </div>

  <!-- Volume -->
  <div class="volume-row">
    <span id="volIcon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.08"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </span>
    <input id="volBar" type="range" min="0" max="100" value="60" />
    <span id="volPct" style="min-width:34px;text-align:right;font-variant-numeric:tabular-nums">60%</span>
  </div>

  <!-- Panel toggles shown as TEXT buttons -->
  <div class="panels">
    <button id="btnToggleLibrary">Library</button>
    <button id="btnTogglePlaylist">Queue</button>
    <button id="btnToggleEq">Equalizer</button>
    <button id="btnToggleLyrics">Lyrics</button>
    <button id="btnOpenSettings">Settings</button>
  </div>

</div>
</body>
</html>
