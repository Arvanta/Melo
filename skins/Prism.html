<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Melo — Prism</title>
<style>
  :root {
    --pv-bg:        #efece7;
    --pv-panel:     #fbfaf7;
    --pv-tint:      #dee3f8;
    --pv-ink:       #1a1c1b;
    --pv-soft:      #5b625f;
    --pv-mute:      #8e9591;
    --pv-line:      rgba(26, 28, 27, .075);
    --pv-wash:      rgba(26, 28, 27, .05);
    --pv-glass:     rgba(255, 255, 255, .52);
    --pv-glass-line:rgba(255, 255, 255, .72);
    --pv-glass-hi:  rgba(255, 255, 255, .92);
    --card-border: rgba(0, 0, 0, .07);
    --accent:        #5b6fd9;
    --accent-hover:  color-mix(in srgb, var(--accent) 85%, #0d1230);
    --accent-soft:   color-mix(in srgb, var(--accent) 13%, transparent);
    --accent-glow:   color-mix(in srgb, var(--accent) 30%, transparent);
    --visualizer:    #7b8ce8;
    --track-bg:      rgba(26, 28, 27, .11);
    --pv-play-fg:    #f8f9ff;
    --pv-shadow:
      0 28px 64px -22px rgba(26, 28, 27, .30),
      0 4px 14px -6px rgba(26, 28, 27, .10);
    --pv-radius: 18px;
  }
  html[data-theme="dark"], [data-theme="dark"] {
    --pv-bg:        #0e100f;
    --pv-panel:     #191c1b;
    --pv-tint:      #262b45;
    --pv-ink:       #ecebe6;
    --pv-soft:      #a3aba7;
    --pv-mute:      #6c7370;
    --pv-line:      rgba(236, 235, 230, .075);
    --pv-wash:      rgba(236, 235, 230, .055);
    --pv-glass:     rgba(255, 255, 255, .05);
    --pv-glass-line:rgba(255, 255, 255, .09);
    --pv-glass-hi:  rgba(255, 255, 255, .08);
    --card-border: rgba(255,255,255,.08);
    --accent:        #93a2ff;
    --accent-hover:  color-mix(in srgb, var(--accent) 86%, #ffffff);
    --accent-soft:   color-mix(in srgb, var(--accent) 16%, transparent);
    --accent-glow:   color-mix(in srgb, var(--accent) 34%, transparent);
    --visualizer:    #93a2ff;
    --track-bg:      rgba(236, 235, 230, .13);
    --pv-play-fg:    #0d1024;
    --pv-shadow:
      0 30px 70px rgba(0, 0, 0, .62),
      0 3px 10px rgba(0, 0, 0, .40);
  }

  * { box-sizing: border-box; }

  /* ---------- preview backdrop (outside the app only) ---------- */
  body:not(.tauri-main):has(#melo-player) {
    min-height: 100vh; margin: 0; padding: 28px;
    display: grid; place-items: center; overflow: hidden;
    background:
      radial-gradient(70% 60% at 15% 0%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 62%),
      radial-gradient(60% 70% at 100% 100%, color-mix(in srgb, var(--pv-tint) 55%, transparent), transparent 68%),
      var(--pv-bg);
    color: var(--pv-ink);
    font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif;
  }

  /* ---------------- the card ---------------- */
  #melo-player,
  body.tauri-main .player-card,
  body.custom-skin-active .player-card {
    width: min(760px, 100%);
    height: 300px;
    min-width: 700px;
    min-height: 280px;
    margin: 0; padding: 0;
    position: relative; overflow: hidden;
    container-type: size;
    container-name: prism;
    display: grid;
    grid-template-rows: 38px minmax(0, 1fr) auto;
    grid-template-columns: minmax(0, 1fr);
    background:
      radial-gradient(58% 70% at 0% 0%,   color-mix(in srgb, var(--accent) 17%, transparent), transparent 68%),
      radial-gradient(50% 62% at 100% 100%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
      radial-gradient(46% 56% at 76% 0%,  color-mix(in srgb, var(--pv-tint) 62%, transparent), transparent 72%),
      var(--pv-panel);
    color: var(--pv-ink);
    border: 1px solid var(--card-border);
    border-radius: var(--pv-radius);
    box-shadow: var(--pv-shadow);
    font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body.tauri-main .player-card {
    width: 100% !important; height: 100vh !important;
    min-height: 0 !important; max-height: 100vh !important;
    border-radius: var(--pv-radius) !important; box-shadow: none !important;
  }

  /* shared frosted surface */
  .pv-glass {
    background: var(--pv-glass);
    border: 1px solid var(--pv-glass-line);
    box-shadow: inset 0 1px 0 var(--pv-glass-hi), 0 10px 26px -14px rgba(26, 28, 27, .28);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    backdrop-filter: blur(16px) saturate(140%);
  }

  /* ================= top bar ================= */
  .pv-top {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    height: 38px; min-width: 0;
    padding: 0 8px 0 12px;
    -webkit-app-region: drag;
  }

.pv-mark {
  width: 9px; height: 9px; flex: 0 0 9px;
  border-radius: 2.5px;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  transform: rotate(45deg);
  transition: transform .25s ease, box-shadow .25s ease;
}

.pv-menu > input:checked ~ .pv-menu-trigger .pv-mark {
  transform: rotate(135deg);
  box-shadow: 0 0 0 4px var(--accent-soft);
}

/* --- Menu container --- */
.pv-menu {
  -webkit-app-region: no-drag;
  position: relative; flex-shrink: 0;
  display: flex; align-items: center; height: 100%;
}
.pv-menu > input {
  position: absolute; width: 1px; height: 1px;
  opacity: 0; pointer-events: none;
}
.pv-menu-trigger {
  cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  height: 26px; padding: 0 10px 0 8px; border-radius: 7px;
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
  color: var(--pv-ink);
  transition: background .14s ease;
  user-select: none;
}
.pv-menu-trigger:hover,
.pv-menu > input:checked ~ .pv-menu-trigger { background: var(--pv-wash); }

/* --- Dropdown --- */
.pv-menu-pop {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 200;
  min-width: 172px; padding: 5px;
  display: none; flex-direction: column; gap: 1px;
  background: color-mix(in srgb, var(--pv-panel) 90%, transparent);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--pv-glass-line); border-radius: 9px;
  box-shadow: inset 0 1px 0 var(--pv-glass-hi),
              0 20px 48px rgba(26, 28, 27, .20),
              0 2px 8px rgba(26, 28, 27, .07);
  transform-origin: top left;
  animation: pv-pop .15s ease-out;
}
.pv-menu > input:checked ~ .pv-menu-pop { display: flex; }
[data-theme="dark"] .pv-menu-pop {
  box-shadow: inset 0 1px 0 var(--pv-glass-hi), 0 20px 48px rgba(0, 0, 0, .6);
}



.pv-menu-item {
  display: flex; align-items: center; gap: 10px;
  height: 32px; padding: 0 10px; border-radius: 5px;
  background: transparent; color: var(--pv-ink); cursor: pointer;
  font: 500 11.5px/1 "Segoe UI Variable Text", "Segoe UI Variable",
        "Segoe UI", Inter, system-ui, sans-serif;
  text-align: left;
  transition: background .14s ease;
  user-select: none;
}
.pv-menu-item:hover { background: var(--pv-wash); }
.pv-menu-item svg {
  width: 13px; height: 13px; flex-shrink: 0; color: var(--pv-soft);
}

/* --- Dismiss overlay --- */
.pv-dismiss {
  position: fixed; inset: 0; z-index: 150;
  display: none; cursor: default;
}
.pv-menu > input:checked ~ .pv-dismiss { display: block; }
  /* segmented mode tabs — centred in the bar */
  .pv-seg {
    -webkit-app-region: no-drag;
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 2px;
    padding: 3px; border-radius: 10px;
    background: var(--pv-glass);
    border: 1px solid var(--pv-glass-line);
    box-shadow: inset 0 1px 0 var(--pv-glass-hi), 0 6px 18px -10px rgba(26, 28, 27, .3);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  .pv-tab {
    height: 22px; padding: 0 12px; border: 0; border-radius: 7px;
    background: transparent; color: var(--pv-mute); cursor: pointer;
    font: 600 9.5px/1 "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif;
    letter-spacing: .13em; text-transform: uppercase;
    transition: color .14s ease, background .14s ease, box-shadow .14s ease;
  }
  .pv-tab:hover { color: var(--pv-ink); }
  html:not(.melo-show-playlist):not(.melo-show-lyrics) [data-melo="toggle-embedded-viz"],
  html.melo-show-playlist [data-melo="toggle-embedded-playlist"],
  html.melo-show-lyrics  [data-melo="toggle-embedded-lyrics"] {
    color: var(--accent);
    background: var(--pv-panel);
    box-shadow: 0 1px 2px rgba(26, 28, 27, .16), 0 0 0 1px var(--pv-line);
  }
  [data-theme="dark"] html:not(.melo-show-playlist):not(.melo-show-lyrics) [data-melo="toggle-embedded-viz"],
  html[data-theme="dark"].melo-show-playlist [data-melo="toggle-embedded-playlist"],
  html[data-theme="dark"].melo-show-lyrics  [data-melo="toggle-embedded-lyrics"] {
    background: color-mix(in srgb, var(--pv-ink) 13%, var(--pv-panel));
    box-shadow: 0 1px 3px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .09);
  }

  /* window controls */
  .pv-win { -webkit-app-region: no-drag; margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
  .pv-win button {
    width: 30px; height: 26px; padding: 0; border: 0; border-radius: 6px;
    display: grid; place-items: center; cursor: pointer;
    color: var(--pv-soft); background: transparent;
    transition: background .14s ease, color .14s ease;
  }
  .pv-win button:hover { color: var(--pv-ink); background: var(--pv-wash); }
  .pv-win button.close:hover { color: #fff; background: #c42b1c; }
  .pv-win svg { width: 11px; height: 11px; }

  /* ================= main region ================= */
.pv-main {
  /* قبل: clamp(86px, calc(100cqh - 178px), 128px)  */
  --cover: clamp(110px, calc(100cqh - 118px), 240px);
  min-width: 0; min-height: 0;
  display: grid;
  grid-template-columns: var(--cover) minmax(0, 1fr) auto;
  grid-template-rows: minmax(0, 1fr);
  gap: 16px;
  padding: 2px 14px 6px 16px;   /* قبل: 4px 14px 10px 16px */
}

  /* ---- artwork ---- */
  .pv-art {
    position: relative;
    width: var(--cover); height: var(--cover);
    align-self: center;
    flex: 0 0 auto;
  }
  .pv-halo {
    position: absolute; inset: -12%; border-radius: 50%; z-index: 0; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 58%, transparent), transparent);
    filter: blur(20px);
    opacity: .30; transform: translateY(3%) scale(.94);
  }
  #melo-player:has([data-melo="pause-icon"][style*="block"]) .pv-halo,
  .player-card:has([data-melo="pause-icon"][style*="block"]) .pv-halo {
    animation: pv-breathe 8s ease-in-out infinite;
  }
  .pv-cover {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    border-radius: 14px; overflow: hidden;
    background: var(--pv-wash);
    box-shadow:
      inset 0 0 0 1px var(--pv-glass-line),
      0 18px 34px -14px color-mix(in srgb, var(--pv-ink) 46%, transparent),
      0 2px 6px color-mix(in srgb, var(--pv-ink) 9%, transparent);
  }
  .pv-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pv-fallback {
    position: relative;
    width: 100%; height: 100%; display: grid; place-items: center;
    background:
      radial-gradient(70% 70% at 30% 20%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%),
      linear-gradient(160deg, var(--pv-panel), color-mix(in srgb, var(--pv-panel) 86%, var(--pv-ink)));
    color: var(--accent);
  }
  .pv-fallback svg { width: 50%; height: auto; }
  .pv-fallback span {
    position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);
    font-size: 7px; font-weight: 700; letter-spacing: .28em; white-space: nowrap;
    color: var(--pv-mute);
  }

  /* ---- centre column ---- */
  .pv-content {
    min-width: 0; min-height: 0;
    display: flex; flex-direction: column; gap: 7px;
  }
  .pv-head { min-width: 0; flex-shrink: 0; }
  .pv-ico {
    flex: 0 0 auto;
    width: 14px; height: 14px;
    display: grid; place-items: center;
    color: var(--accent);
    opacity: .9;
  }
  .pv-ico svg { width: 14px; height: 14px; display: block; }
  .pv-title-row {
    display: flex; align-items: center; gap: 0.35em; min-width: 0;
    /* font-size lives on the row so the track icon (em) scales with the title */
    font-size: clamp(19px, 2.6vw, 23px);
  }
  /* Track icon: fixed theme ink — not --accent (Melo retints accent per track).
     Size tracks title font via em (grows with .pv-title-row / container query). */
  .pv-title-row .pv-ico {
    width: 0.78em; height: 0.78em; opacity: .85;
    color: var(--pv-soft);
  }
  .pv-title-row .pv-ico svg { width: 100%; height: 100%; }
  .pv-title {
    min-width: 0; flex: 1 1 auto;
    font-size: 1em;
    font-weight: 600; letter-spacing: -.021em; line-height: 1.22;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pv-sub {
    margin-top: 3px; min-width: 0;
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 500; color: var(--pv-soft);
  }
  .pv-sub > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-sub .pv-ico { width: 13px; height: 13px; color: var(--pv-soft); opacity: .95; }
  .pv-sub .pv-ico svg { width: 13px; height: 13px; }
  .pv-sub .pv-ico-album { color: var(--pv-mute); }
  .pv-album { font-weight: 400; color: var(--pv-mute); }
  .pv-dot { flex: 0 0 auto; width: 3px; height: 3px; border-radius: 50%; background: var(--pv-mute); }
  .pv-sub:has(.pv-album:empty) .pv-dot,
  .pv-sub:has(.pv-album:empty) .pv-ico-album { display: none; }

  .pv-chips {
    margin-top: 6px; min-width: 0;
    display: flex; align-items: center; gap: 7px;
    font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--pv-mute);
  }
  .pv-chips > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-chip {
    flex-shrink: 0; padding: 2px 7px; border-radius: 5px;
    color: var(--accent); background: var(--accent-soft); font-weight: 700;
  }
  .pv-chip:empty { display: none; }

  /* playing bars */
  .pv-live { display: none; align-items: flex-end; gap: 2px; height: 10px; flex-shrink: 0; }
  .pv-live i {
    display: block; width: 2.5px; height: 30%; border-radius: 2px;
    background: var(--accent); animation: pv-eq 1.1s ease-in-out infinite;
  }
  .pv-live i:nth-child(2) { animation-delay: -.36s; }
  .pv-live i:nth-child(3) { animation-delay: -.72s; }
  #melo-player:has([data-melo="pause-icon"][style*="block"]) .pv-live,
  .player-card:has([data-melo="pause-icon"][style*="block"]) .pv-live { display: flex; }

  /* inline synced lyric slot */
  .pv-lyric {
    display: block; flex: 1 1 96px; min-width: 0;
    overflow: hidden; padding: 2px 9px;
    white-space: nowrap; text-overflow: ellipsis;
    color: color-mix(in srgb, var(--accent) 88%, var(--pv-soft));
    cursor: pointer;
    font-size: 10px; font-weight: 600; line-height: 1.25;
    letter-spacing: .01em; text-transform: none;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--accent) 12%, transparent),
      color-mix(in srgb, var(--accent) 3%, transparent));
    border: 1px solid color-mix(in srgb, var(--accent) 16%, var(--pv-glass-line));
    border-radius: 999px;
    box-shadow: inset 0 1px 0 var(--pv-glass-hi), 0 3px 10px -9px var(--accent-glow);
  }
  .pv-lyric::before {
    content: ""; display: inline-block; width: 4px; height: 4px; margin: 0 6px 1px 0;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 7px var(--accent-glow); vertical-align: middle;
  }
  .pv-lyric.melo-lyric-tick { animation: pv-lyric-settle 1s ease-out both; }
  .pv-lyric.melo-lyric-empty { display: none !important; }
  html.melo-show-lyrics .pv-lyric { display: none !important; }

  /* ---- stage ---- */
  .pv-stage {
    position: relative; flex: 1 1 auto; min-height: 44px; min-width: 0;
    border-radius: 5px; overflow: hidden;
  }
  .pv-viz { position: absolute; inset: 0; padding: 5px 5px; cursor: pointer; }
  .pv-viz canvas { width: 100% !important; height: 100% !important; display: block; }
  html.melo-show-playlist .pv-viz,
  html.melo-show-lyrics  .pv-viz { display: none !important; }

  .pv-embed {
    position: absolute; inset: 0; overflow: auto; padding: 6px 7px;
    display: none !important; font-size: 12px;
  }
  html.melo-show-playlist [data-melo="embedded-playlist"],
  html.melo-show-lyrics  [data-melo="embedded-lyrics"] { display: block !important; }
  html:not(.melo-show-playlist) [data-melo="embedded-playlist"],
  html:not(.melo-show-lyrics)  [data-melo="embedded-lyrics"] { display: none !important; }
  .pv-embed .embedded-playlist,
  .pv-embed .embedded-lyrics { height: 100% !important; min-height: 100%; }
  .pv-embed .embedded-playlist-row {
    border-radius: 7px; padding: 3px 8px; gap: 8px; color: var(--pv-ink);
    transition: background .14s ease;
  }
  .pv-embed .embedded-playlist-row:hover { background: var(--pv-wash); }
  .pv-embed .embedded-playlist-row.active { background: var(--accent-soft); color: var(--accent); }
  .pv-embed .embedded-playlist-row.active .t-title { color: var(--accent); font-weight: 600; }
  .pv-embed .embedded-playlist-mini .t-title { color: var(--pv-ink); }
  .pv-embed .track-cover-mini { border-radius: 4px; }
  .pv-embed .embedded-playlist-empty { color: var(--pv-mute); padding: 18px 8px; }
  .pv-embed .embedded-lyrics-title { display: none; }
  .pv-embed .lyric-line {
    font-size: 11.5px; font-weight: 500; line-height: 1.5;
    padding: 3px 9px; border-radius: 7px;
    color: var(--pv-mute); transform: none !important; text-shadow: none;
    transition: background .14s ease, color .14s ease;
  }
  .pv-embed .lyric-line:hover { color: var(--pv-soft); background: var(--pv-wash); }
  .pv-embed .lyric-line.passed { color: var(--pv-soft); opacity: .55; }
  .pv-embed .lyric-line.active {
    font-size: 12.5px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft);
  }
  .pv-embed .embedded-lyrics:empty::after {
    content: "No synced lyrics for this track";
    display: block; padding: 18px 8px; text-align: center;
    font-size: 11px; color: var(--pv-mute);
  }

  /* slim accent scrollbar */
  .pv-embed,
  .pv-embed .embedded-playlist,
  .pv-embed .embedded-lyrics {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--accent) 45%, transparent) transparent;
  }
  .pv-embed::-webkit-scrollbar,
  .pv-embed .embedded-playlist::-webkit-scrollbar,
  .pv-embed .embedded-lyrics::-webkit-scrollbar { width: 4px; }
  .pv-embed::-webkit-scrollbar-track,
  .pv-embed .embedded-playlist::-webkit-scrollbar-track,
  .pv-embed .embedded-lyrics::-webkit-scrollbar-track { background: transparent; margin: 5px 0; }
  .pv-embed::-webkit-scrollbar-thumb,
  .pv-embed .embedded-playlist::-webkit-scrollbar-thumb,
  .pv-embed .embedded-lyrics::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 999px; min-height: 24px;
  }
  .pv-embed::-webkit-scrollbar-thumb:hover,
  .pv-embed .embedded-playlist::-webkit-scrollbar-thumb:hover,
  .pv-embed .embedded-lyrics::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ---- vertical rail (right edge) ---- */
  .pv-rail {
    align-self: center;
    display: flex; flex-direction: column; gap: 2px;
    padding: 4px; border-radius: 13px;
  }
  .pv-rail button {
    width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px;
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    color: var(--pv-soft); background: transparent;
    transition: background .14s ease, color .14s ease, transform .1s ease;
  }
  .pv-rail button:hover { color: var(--pv-ink); background: var(--pv-wash); }
  .pv-rail button:active { transform: scale(.9); }
  .pv-rail button.active { color: var(--accent); background: var(--accent-soft); }
  .pv-rail svg { width: 14px; height: 14px; }

  /* ================= bottom taskbar ================= */
  .pv-bar {
    display: flex; align-items: center; gap: 14px;
    height: 60px; padding: 0 16px 0 14px;
    border-top: 1px solid var(--pv-line);
    background: linear-gradient(to bottom,
      color-mix(in srgb, var(--pv-ink) 1.5%, transparent),
      color-mix(in srgb, var(--pv-ink) 3.5%, transparent));
  }

  .pv-transport { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .pv-btn {
    width: 32px; height: 32px; padding: 0; border: 0; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    color: var(--pv-soft); background: transparent;
    transition: background .14s ease, color .14s ease, transform .1s ease;
  }
  .pv-btn:hover { color: var(--pv-ink); background: var(--pv-wash); }
  .pv-btn:active { transform: scale(.9); }
  .pv-btn.active { color: var(--accent); background: var(--accent-soft); }
  .pv-btn svg { width: 15px; height: 15px; }

  .pv-play {
    width: 46px; height: 34px; margin: 0 6px; border-radius: 12px;
    color: var(--pv-play-fg); background: var(--accent);
    box-shadow: 0 6px 16px -8px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .22);
    transition: background .16s ease, transform .1s ease, box-shadow .16s ease;
  }
  .pv-play:hover {
    color: var(--pv-play-fg); background: var(--accent-hover);
    box-shadow: 0 8px 20px -8px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .22);
  }
  .pv-play:active { transform: scale(.95); }
  .pv-play svg { width: 17px; height: 17px; }

  /* seek */
  .pv-seek {
    flex: 1 1 auto; min-width: 0;
    display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px;
    gap: 10px; align-items: center;
  }
  .pv-time {
    font-size: 10.5px; font-weight: 500; color: var(--pv-mute);
    font-variant-numeric: tabular-nums;
  }
  .pv-time.end { text-align: right; }

  .pv-range {
    -webkit-appearance: none; appearance: none; outline: none; cursor: pointer;
    height: 16px; width: 100%; min-width: 0; margin: 0; background: transparent;
  }
  .pv-range.is-seek::-webkit-slider-runnable-track {
    height: 4px; border-radius: 999px;
    background: linear-gradient(to right,
      color-mix(in srgb, var(--accent) 62%, #ffffff) 0%,
      var(--accent) var(--progress, 0%),
      var(--track-bg) var(--progress, 0%),
      var(--track-bg) 100%);
  }
  .pv-range.is-seek::-moz-range-track {
    height: 4px; border-radius: 999px;
    background: linear-gradient(to right,
      color-mix(in srgb, var(--accent) 62%, #ffffff) 0%,
      var(--accent) var(--progress, 0%),
      var(--track-bg) var(--progress, 0%),
      var(--track-bg) 100%);
  }
  .pv-range.is-vol::-webkit-slider-runnable-track {
    height: 4px; border-radius: 999px;
    background: linear-gradient(to right,
      var(--accent) 0%, var(--accent) var(--vol, 60%),
      var(--track-bg) var(--vol, 60%), var(--track-bg) 100%);
  }
  .pv-range.is-vol::-moz-range-track {
    height: 4px; border-radius: 999px;
    background: linear-gradient(to right,
      var(--accent) 0%, var(--accent) var(--vol, 60%),
      var(--track-bg) var(--vol, 60%), var(--track-bg) 100%);
  }
  .pv-range::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; margin-top: -3.5px;
    border-radius: 50%; background: #fff; border: 0;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--pv-ink) 14%, transparent), 0 2px 6px rgba(0, 0, 0, .2);
    opacity: 0; transform: scale(.6);
    transition: opacity .15s ease, transform .15s ease;
  }
  .pv-range::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: #fff; border: 0;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--pv-ink) 14%, transparent), 0 2px 6px rgba(0, 0, 0, .2);
    opacity: 0; transform: scale(.6);
    transition: opacity .15s ease, transform .15s ease;
  }
  .pv-range:hover::-webkit-slider-thumb,
  .pv-range:active::-webkit-slider-thumb { opacity: 1; transform: scale(1); }
  .pv-range:hover::-moz-range-thumb,
  .pv-range:active::-moz-range-thumb { opacity: 1; transform: scale(1); }

  /* volume */
  .pv-vol {
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .pv-vol-ico {
    width: 26px; height: 26px; border-radius: 8px; cursor: pointer;
    display: grid; place-items: center; color: var(--pv-soft);
    transition: background .14s ease, color .14s ease, opacity .14s ease;
  }
  .pv-vol-ico:hover { color: var(--pv-ink); background: var(--pv-wash); }
  .pv-vol-ico.muted { opacity: .42; }
  .pv-vol-ico svg { width: 14px; height: 14px; }
  .pv-vol .pv-range { width: 84px; }
  .pv-pct {
    width: 30px; text-align: right;
    font-size: 10.5px; font-weight: 500; color: var(--pv-mute);
    font-variant-numeric: tabular-nums;
  }

  /* roomier windows */
@container prism (min-width: 860px) {
  .pv-main { gap: 22px; padding: 4px 20px 10px 22px; }
  .pv-title-row { font-size: 26px; } /* title + track icon scale together */
  .pv-vol .pv-range { width: 118px; }
  .pv-bar { gap: 20px; }
}

  /* ================= keyframes ================= */
  @keyframes pv-breathe {
    0%, 100% { opacity: .30; transform: translateY(3%) scale(.94); }
    50%      { opacity: .68; transform: translateY(2%) scale(1.07); }
  }
  @keyframes pv-eq {
    0%, 100% { height: 30%; }
    50%      { height: 100%; }
  }
  @keyframes pv-lyric-settle {
    0%   { color: color-mix(in srgb, var(--accent) 52%, var(--pv-soft)); text-shadow: 0 1px 1px transparent; }
    65%  { color: var(--accent); text-shadow: 0 1px 12px var(--accent-glow); }
    100% { color: color-mix(in srgb, var(--accent) 88%, var(--pv-soft)); text-shadow: 0 1px 8px color-mix(in srgb, var(--accent) 26%, transparent); }
  }
  @keyframes pv-pop {
    from { opacity: 0; transform: translateY(-4px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pv-halo, .pv-menu-pop, .pv-live i, .pv-lyric { animation: none !important; }
  }
</style>
</head>
<body data-window-width="760" data-window-height="300" data-min-width="700" data-min-height="280" data-max-width="960" data-max-height="380" data-resizable="true">
<div id="melo-player">

  <!-- ============ top bar ============ -->
  <header class="pv-top" data-tauri-drag-region>
<div class="pv-menu">
  <input id="pvMenuToggle" type="checkbox">

  <label class="pv-menu-trigger" for="pvMenuToggle" title="Melo">
    <span class="pv-mark" aria-hidden="true"></span>
    <span>Prism</span>
  </label>

  <div class="pv-menu-pop">
    <label class="pv-menu-item" for="pvMenuToggle" data-melo="add-files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 12v6M9 15h6"/></svg>
      Add files
    </label>
    <label class="pv-menu-item" for="pvMenuToggle" data-melo="add-folder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Add folder
    </label>
    <label class="pv-menu-item" for="pvMenuToggle" data-melo="theme-toggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      Theme
    </label>
  </div>
  <label class="pv-dismiss" for="pvMenuToggle" aria-label="Close menu"></label>
</div>

    <div class="pv-seg">
      <button class="pv-tab" type="button" data-melo="toggle-embedded-viz" title="Visualizer">Sound</button>
      <button class="pv-tab" type="button" data-melo="toggle-embedded-playlist" title="Queue">Queue</button>
      <button class="pv-tab" type="button" data-melo="toggle-embedded-lyrics" title="Lyrics">Lyrics</button>
    </div>

    <div class="pv-win">
      <button type="button" data-melo="minimize" title="Minimize" aria-label="minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button type="button" class="close" data-melo="close" title="Close" aria-label="close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ main ============ -->
  <div class="pv-main">

    <!-- artwork -->
    <div class="pv-art">
      <div class="pv-halo" aria-hidden="true"></div>
      <div class="pv-cover">
        <img data-melo="cover" alt="" style="display:none" />
        <div class="pv-fallback" data-melo="cover-fallback">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round">
            <rect x="21" y="21" width="22" height="22" rx="4" stroke-width="1.8"/>
            <path d="M32 8v6M32 50v6M8 32h6M50 32h6" stroke-width="1.6" opacity=".55"/>
            <circle cx="32" cy="32" r="4" fill="currentColor" stroke="none"/>
          </svg>
          <span>NO ARTWORK</span>
        </div>
      </div>
    </div>

    <!-- centre column -->
    <div class="pv-content">
      <div class="pv-head">
        <div class="pv-title-row">
          <span class="pv-ico" aria-hidden="true" title="Track">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </span>
          <div class="pv-title" data-melo="title">Nothing playing</div>
        </div>
        <div class="pv-sub">
          <span class="pv-ico" aria-hidden="true" title="Artist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 19.5c1.2-3.2 3.4-4.8 6.5-4.8s5.3 1.6 6.5 4.8"/></svg>
          </span>
          <span data-melo="artist">Add some music and settle in</span>
          <span class="pv-dot" aria-hidden="true"></span>
          <span class="pv-ico pv-ico-album" aria-hidden="true" title="Album">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.2"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg>
          </span>
          <span class="pv-album" data-melo="album"></span>
        </div>
        <div class="pv-chips">
          <span class="pv-live" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="pv-chip" data-melo="codec"></span>
          <span data-melo="specs"></span>
          <!-- Optional synced-LRC hook; Melo fills it only when enabled. -->
          <div class="pv-lyric" data-melo="current-lyric" aria-live="polite"></div>
        </div>
      </div>

      <div class="pv-stage pv-glass">
        <div class="pv-viz" data-melo="visualizer" data-bars="32"></div>
        <div class="pv-embed" data-melo="embedded-playlist"></div>
        <div class="pv-embed" data-melo="embedded-lyrics"></div>
      </div>
    </div>

    <!-- vertical rail -->
    <nav class="pv-rail pv-glass">
      <button id="btnToggleLibrary" type="button" data-melo="toggle-library" title="Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></svg>
      </button>
      <button id="btnTogglePlaylist" type="button" data-melo="toggle-playlist" title="Queue window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15V6M12 12H3M16 6H3M12 18H3"/><circle cx="18.5" cy="18" r="2.5"/></svg>
      </button>
      <button id="btnToggleEq" type="button" data-melo="toggle-eq" title="Equalizer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/></svg>
      </button>
      <button id="btnToggleLyrics" type="button" data-melo="toggle-lyrics" title="Lyrics window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5h12v14H4zM16 8h4v8h-4"/></svg>
      </button>
      <button id="btnOpenSettings" type="button" data-melo="toggle-settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l-2.86 2.86A1.7 1.7 0 0 0 15 19.4 1.7 1.7 0 0 0 14 21h-4a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.88.34l-2.86-2.86A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3 14v-4a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.34-1.88l2.86-2.86A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3h4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.88-.34l2.86 2.86A1.7 1.7 0 0 0 19.4 9 1.7 1.7 0 0 0 21 10v4a1.7 1.7 0 0 0-1.6 1z"/></svg>
      </button>
    </nav>
  </div>

  <!-- ============ taskbar ============ -->
  <footer class="pv-bar">
    <div class="pv-transport">
      <button class="pv-btn" type="button" data-melo="shuffle" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20l8-8M21 3l-8 8M16 21h5v-5M4 4l5 5M9 15l-5 5"/></svg>
      </button>
      <button class="pv-btn" type="button" data-melo="prev" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="pv-btn" type="button" data-melo="stop" title="Stop">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
      </button>
      <button class="pv-btn pv-play" type="button" data-melo="play" title="Play / Pause">
        <svg data-melo="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg data-melo="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="pv-btn" type="button" data-melo="next" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="pv-btn" type="button" data-melo="repeat" title="Repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>

    <div class="pv-seek">
      <span class="pv-time" data-melo="current-time">0:00</span>
      <input class="pv-range is-seek" type="range" min="0" max="100" value="0" data-melo="seek" aria-label="Seek" />
      <span class="pv-time end" data-melo="duration">0:00</span>
    </div>

    <div class="pv-vol">
      <span class="pv-vol-ico" data-melo="volume-icon" title="Mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.08"/></svg>
      </span>
      <input class="pv-range is-vol" type="range" min="0" max="100" value="60" data-melo="volume" aria-label="Volume" />
      <span class="pv-pct" data-melo="volume-pct">60%</span>
    </div>
  </footer>

</div>

</body>
</html>
