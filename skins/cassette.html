<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Melo — Cassette</title>
<style>
/*
  CASSETTE  — the window IS a compact cassette (orange shell, cream paper label).
  Top band = title bar. Orange panel: label (taped cover, two ruled lines), two reels with
  wound tape, a tape window carrying the spectrum, then a recessed counter line
  (time · seek · time · volume). The black trapezoid holds the deck keys:
  shuffle · prev · PLAY · stop · next · repeat. Play stays pressed while playing; the LED in
  the bar lights, the reels turn and the tape window warms up. Queue / Lyrics lay a typed
  J-card over the label + reels. Dark = black shell, light = ivory shell.
  All sizes use cqw / cqh of the card, so it scales to any window shape. Pure CSS, no scripts.
*/
:root, :root[data-theme="dark"], [data-theme="dark"] {
  --cs-shell-1: #211e1c; --cs-shell-2: #0d0c0b; --cs-edge: rgba(255,255,255,0.10);
  --cs-ink: #f1e8d6; --cs-ink-2: rgba(241,232,214,0.78); --cs-ink-3: rgba(241,232,214,0.60);
  --cs-line: rgba(255,236,200,0.14);
  --cs-trap-edge: #4d4a47; --cs-trap-1: #090807; --cs-trap-2: #151312;
  --cs-key-1: #f3e9d8; --cs-key-2: #d9ccb6; --cs-key-ink: #1d1814; --cs-key-edge: #8a7d68;
  --cs-screw-1: #6c6863; --cs-screw-2: #2a2827; --cs-menu: #f0e6cf;
  --cs-shadow: 0 18px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.35);
}
:root[data-theme="light"], [data-theme="light"] {
  --cs-shell-1: #f4eddd; --cs-shell-2: #ddd2ba; --cs-edge: rgba(60,40,20,0.22);
  --cs-ink: #2b231b; --cs-ink-2: rgba(43,35,27,0.80); --cs-ink-3: rgba(43,35,27,0.62);
  --cs-line: rgba(60,40,20,0.18);
  --cs-trap-edge: #b0a388; --cs-trap-1: #c8bca2; --cs-trap-2: #d9cdb5;
  --cs-key-1: #34302b; --cs-key-2: #1f1c19; --cs-key-ink: #f3ead6; --cs-key-edge: #0a0807;
  --cs-screw-1: #c8bfae; --cs-screw-2: #8d8576; --cs-menu: #fbf5e6;
  --cs-shadow: 0 18px 40px rgba(60,40,20,0.22), 0 2px 8px rgba(60,40,20,0.14);
}
:root {
  --cs-or-1: #f76b3d; --cs-or-2: #e9532a;
  --cs-cream: #f1e6d4; --cream-2: #e2d5bf; --cs-paper-ink: #1d1814; --cs-dim: #6b6050;
  --cs-led: #ff7a45; --cs-danger: #c7402d; --cs-amber: #ffb867;
  --cs-hand: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Marker Felt", "Comic Sans MS", cursive;
  --cs-type: "Cascadia Mono", "SF Mono", "Courier New", Consolas, monospace;
  --cs-rule: rgba(70,110,160,0.20); --cs-margin: rgba(200,70,50,0.50);
  --cs-band: 42px;
}
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; min-height: 100%; }
html { color-scheme: dark; } html[data-theme="light"] { color-scheme: light; }
body { color: var(--cs-ink); background: var(--cs-shell-2); font: 13px "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body:not(.tauri-main):has(#melo-player) { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b0a09; }
[data-theme="light"] body:not(.tauri-main):has(#melo-player) { background: #c9bfaa; }

#melo-player, body.tauri-main .player-card, body.custom-skin-active .player-card {
  position: relative; width: 720px; height: 450px; min-width: 320px; min-height: 210px; overflow: hidden;
  color: var(--cs-ink); background: var(--cs-shell-2); border-radius: 18px; box-shadow: var(--cs-shadow);
}
body.tauri-main, body.tauri-main .app-shell { min-width: 0 !important; }
body.tauri-main .player-card, body.custom-skin-active .player-card {
  width: 100% !important; height: 100vh !important; min-width: 320px !important; min-height: 210px !important;
  max-width: 1000px !important; max-height: 640px !important; margin: 0 auto !important; border-radius: 18px !important; box-shadow: none !important;
}

/* the whole window is the cassette and the size container for everything inside */
.cs-face {
  position: absolute; inset: 0; overflow: hidden; container-type: size;
  --cs-hb: calc(100cqh - var(--cs-band));
  --cs-reel: min(15cqw, calc(var(--cs-hb) * 0.26));
  display: grid; grid-template-rows: var(--cs-band) minmax(0, 1fr);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.05), transparent 14%),
    radial-gradient(130% 90% at 25% 0%, var(--cs-shell-1), var(--cs-shell-2) 65%);
  box-shadow: inset 0 0 0 1px var(--cs-edge), inset 0 2px 0 rgba(255,255,255,0.08), inset 0 -3px 8px rgba(0,0,0,0.25);
}
.cs-screw { position: absolute; width: 17px; height: 17px; border-radius: 50%; z-index: 8; pointer-events: none;
  background: linear-gradient(90deg, transparent 43%, #0d0c0b 43% 57%, transparent 57%), linear-gradient(0deg, transparent 43%, #0d0c0b 43% 57%, transparent 57%), radial-gradient(circle at 35% 30%, var(--cs-screw-1), var(--cs-screw-2) 72%);
  box-shadow: 0 0 0 2px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.16); }
.cs-screw.tl { left: 14px; top: 12px; } .cs-screw.tr { right: 14px; top: 12px; transform: rotate(35deg); }
.cs-screw.bl { left: 14px; bottom: 12px; transform: rotate(70deg); } .cs-screw.br { right: 14px; bottom: 12px; transform: rotate(15deg); }

/* ── top band ── */
.cs-bar { position: relative; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 0 46px; -webkit-app-region: drag; user-select: none; }
.cs-menu { position: relative; z-index: 120; -webkit-app-region: no-drag; }
.cs-menu > input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.cs-dymo { display: inline-block; padding: 3px 10px 3px 11px; cursor: pointer; border-radius: 2px; transform: rotate(-1.2deg); transition: transform .15s ease;
  background: linear-gradient(180deg, #333, #111); color: #f6f1e5; font: 800 11px/1.2 "Segoe UI", system-ui, sans-serif; letter-spacing: 0.24em; text-shadow: 0 1px 0 rgba(0,0,0,0.7);
  box-shadow: 0 1px 2px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.22), inset 0 0 0 1px rgba(255,255,255,0.06); }
.cs-dymo:hover { transform: rotate(0) translateY(-1px); }
.cs-led { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: #3a2118; box-shadow: inset 0 1px 1px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08); transition: background .3s ease, box-shadow .3s ease; }
.cs-face:has([data-melo="pause-icon"][style*="block"]) .cs-led { background: var(--cs-led); box-shadow: 0 0 6px 1px rgba(255,122,69,0.75), 0 0 0 1px rgba(255,255,255,0.12); }
.cs-flyout { position: absolute; top: 32px; left: 0; z-index: 200; width: 176px; padding: 5px; display: none; flex-direction: column; gap: 1px;
  background: var(--cs-menu); color: var(--cs-paper-ink); border-radius: 6px; box-shadow: 0 10px 24px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.25); animation: cs-in .16s ease; }
.cs-menu > input:checked ~ .cs-flyout { display: flex; }
.cs-item { height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 10px; border-radius: 4px; font-size: 12.5px; cursor: pointer; }
.cs-item:hover { background: rgba(60,40,20,0.10); }
.cs-item svg { width: 15px; height: 15px; color: var(--cs-dim); flex: 0 0 15px; }
.cs-dismiss { position: fixed; inset: 0; z-index: 150; display: none; }
.cs-menu > input:checked ~ .cs-dismiss { display: block; }

/* stage tabs, styled like label-maker strips (the engine marks the current .stage-btn as .active) */
.cs-tabs { display: flex; gap: 5px; -webkit-app-region: no-drag; }
.cs-tabs button.stage-btn { width: auto; height: auto; padding: 4px 9px; border: 0; border-radius: 2px; display: block; cursor: pointer;
  background: rgba(255,255,255,0.05); color: var(--cs-ink-3); font: 700 10px/1.2 inherit; font-family: inherit; letter-spacing: 0.14em; text-transform: uppercase;
  box-shadow: inset 0 0 0 1px var(--cs-line); transition: color .12s ease, background .12s ease, transform .12s ease; }
.cs-tabs button.stage-btn:hover { color: var(--cs-ink); background: var(--cs-line); }
.cs-tabs button.stage-btn.active, .cs-tabs button.stage-btn.active:hover { color: var(--cs-paper-ink); background: var(--cs-cream); box-shadow: 0 1px 2px rgba(0,0,0,0.45); transform: rotate(-1deg); }
.cs-tools { margin-left: auto; display: flex; align-items: center; gap: 1px; -webkit-app-region: no-drag; }
.cs-tools button { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--cs-ink-2); cursor: pointer; transition: background .12s ease, color .12s ease; }
.cs-tools button:hover { background: var(--cs-line); color: var(--cs-ink); }
.cs-tools svg { width: 15px; height: 15px; }
.cs-tools .sep { width: 1px; height: 16px; margin: 0 6px; background: var(--cs-line); }
.cs-tools button.close:hover { background: var(--cs-danger); color: #fff; }

/* ── body: orange panel + black trapezoid ── */
.cs-body { position: relative; min-height: 0; }
.cs-body > * { position: absolute; }
.cs-panel { left: 5.5%; right: 5.5%; top: 0; height: 70.3%; border-radius: 2.4cqw 2.4cqw 2cqw 2cqw;
  background: linear-gradient(105deg, rgba(255,255,255,0.10) 0 22%, transparent 22% 100%), linear-gradient(180deg, var(--cs-or-1), var(--cs-or-2));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.30), inset 0 0.3cqw 0 rgba(255,255,255,0.28), inset 0 -0.5cqw 1cqw rgba(120,30,0,0.28), 0 0.3cqw 0.8cqw rgba(0,0,0,0.45); }
.cs-panel > * { position: absolute; }

/* label: taped cover + two ruled lines */
.cs-label { left: 1.7%; right: 2.5%; top: 4.1%; height: 28.4%; z-index: 2; display: flex; align-items: center; gap: 2.2cqw; padding: 0 2.6cqw 0 1.2cqw; border-radius: 1.6cqw; overflow: visible;
  background: linear-gradient(180deg, var(--cs-cream), var(--cream-2)); box-shadow: 0 0.3cqw 0.7cqw rgba(0,0,0,0.32), inset 0 0 0 0.2cqw rgba(0,0,0,0.08), inset 0 0.25cqw 0 rgba(255,255,255,0.6); }
.cs-badge { position: relative; flex: 0 0 auto; height: 86%; aspect-ratio: 1; }
.cs-badge::before, .cs-badge::after { content: ""; position: absolute; z-index: 2; width: 34%; height: 15%; background: rgba(238,222,170,0.72); box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
.cs-badge::before { left: -12%; top: 2%; transform: rotate(-38deg); } .cs-badge::after { right: -12%; top: 2%; transform: rotate(38deg); }
.cs-cover { position: absolute; inset: 0; border-radius: 0.5cqw; overflow: hidden; background: var(--cream-2); transform: rotate(-2deg);
  box-shadow: 0 0 0 0.3cqw #fff8ec, 0 0 0 0.45cqw rgba(0,0,0,0.22), 0 0.4cqw 0.9cqw rgba(0,0,0,0.35); }
.cs-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cs-cover-fallback { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(135deg, #e7b996, #d98a62); color: #fff8ec; }
.cs-cover-fallback svg { width: 52%; height: 52%; }
.cs-side { position: absolute; right: -9%; bottom: -9%; width: 32%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; z-index: 3;
  background: var(--cs-paper-ink); color: var(--cs-cream); font: 800 min(1.9cqw, calc(var(--cs-hb) * 0.034))/1 "Segoe UI", system-ui, sans-serif; box-shadow: 0 0 0 0.25cqw var(--cs-cream); }
.cs-lines { flex: 1 1 auto; align-self: stretch; display: grid; grid-template-rows: 1fr 1fr; gap: 0.5cqw; padding: 1.1cqw 0 0.9cqw; }
.cs-line { display: flex; align-items: flex-end; gap: 1cqw; padding-bottom: 0.25cqw; border-bottom: 1px solid rgba(29,24,20,0.8); overflow: hidden; }
.cs-title, .cs-artist, .cs-album { font-family: var(--cs-hand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs-title { font-weight: 700; font-size: min(3.5cqw, calc(var(--cs-hb) * 0.064)); line-height: 1.4; color: var(--cs-paper-ink); }
/* star rating at the right end of the title line. Melo fills .cs-rating with five .rate-star buttons (.on = filled) for the playing track and keeps
   the space while no track is loaded. Hover preview is tagged by Melo: .pv-add = would fill, .pv-remove = would empty.
   Selectors out-rank the app's own .track-rating / .rate-star rules; .pv-remove comes after .on on purpose. */
.cs-title { min-width: 0; }
.cs-label .cs-line .cs-rating { flex: 0 0 auto; align-self: center; margin: 0 0 0 auto; min-height: 0; gap: 0; }
.cs-label .cs-line .cs-rating .rate-star { width: min(2.9cqw, calc(var(--cs-hb) * 0.054)); padding: 0; background: none; border: 0; cursor: pointer; text-align: center;
  font-size: min(2.7cqw, calc(var(--cs-hb) * 0.05)); line-height: 1.4; color: var(--cs-dim); opacity: .35; transition: color .12s ease, opacity .12s ease; }
.cs-label .cs-line .cs-rating .rate-star.on { color: var(--cs-or-2); opacity: 1; }
.cs-label .cs-line .cs-rating .rate-star.pv-add { color: var(--cs-or-2); opacity: .5; }
.cs-label .cs-line .cs-rating .rate-star.pv-remove { opacity: .4; }
.cs-label .cs-line .cs-rating .rate-star:focus-visible { outline: 2px solid var(--cs-or-2); outline-offset: -2px; border-radius: 3px; }
.cs-artist { flex: 0 1 auto; font-size: min(2.45cqw, calc(var(--cs-hb) * 0.045)); line-height: 1.15; color: #3f3326; }
.cs-album { flex: 1 1 0; font-size: min(2cqw, calc(var(--cs-hb) * 0.037)); line-height: 1.2; color: var(--cs-dim); }
.cs-album:not(:empty)::before { content: "· "; }

/* reels with wound tape */
.cs-reel { z-index: 2; width: var(--cs-reel); aspect-ratio: 1; top: 55.9%; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(circle at 35% 28%, #98938f, #3b3938 75%); box-shadow: 0 0 0 0.3cqw #1d1c1b, 0 0.3cqw 0.6cqw rgba(0,0,0,0.4), inset 0 0.2cqw 0 rgba(255,255,255,0.28); }
.cs-reel::before { content: ""; position: absolute; inset: 8.5%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #262321, #050505); }
.cs-reel::after { content: ""; position: absolute; border-radius: 50%; inset: 15%;
  background: radial-gradient(circle at 38% 32%, rgba(255,255,255,0.20), transparent 45%), repeating-radial-gradient(circle, #4a3628 0 1px, #2f2219 1px 2.4px); box-shadow: 0 0 0 1px rgba(0,0,0,0.6); }
.cs-reel.r::after { inset: 22%; }
.cs-reel.l { left: 14.5%; } .cs-reel.r { left: 85.5%; }
.cs-hub { position: absolute; z-index: 1; inset: 25%; border-radius: 50%; animation: cs-spin 2.4s linear infinite; animation-play-state: paused;
  background: radial-gradient(circle, #1a1a1a 0 18%, #fbfbfb 19% 42%, transparent 43%), repeating-conic-gradient(from 15deg, #f4f4f4 0 26deg, #121212 26deg 60deg); box-shadow: 0 0 0 0.25cqw #111; }
.cs-reel.r .cs-hub { inset: 29%; animation-duration: 1.7s; }
.cs-face:has([data-melo="pause-icon"][style*="block"]) .cs-hub { animation-play-state: running; }
@keyframes cs-spin { to { transform: rotate(360deg); } }

/* tape window: glass, amber backlight while playing, spectrum in cream */
.cs-win { z-index: 2; left: 27.5%; width: 45%; top: 55.9%; height: calc(var(--cs-reel) * 0.98); transform: translateY(-50%); border-radius: 0.9cqw;
  background: linear-gradient(180deg, #5d5a58, #3d3b39); box-shadow: 0 0 0 0.25cqw rgba(0,0,0,0.55), 0 0.2cqw 0.4cqw rgba(0,0,0,0.3), inset 0 0.2cqw 0 rgba(255,255,255,0.22); }
.cs-win::after { content: ""; position: absolute; inset: 9% 3.5%; z-index: 4; border-radius: 0.6cqw; pointer-events: none; background: linear-gradient(112deg, rgba(255,255,255,0.15) 0 24%, transparent 24.5% 100%); }
.cs-win-in { position: absolute; inset: 9% 3.5%; border-radius: 0.6cqw; overflow: hidden; isolation: isolate; background: #1b1a19; box-shadow: inset 0 0.3cqw 0.7cqw rgba(0,0,0,0.75); transition: background .6s ease; }
.cs-face:has([data-melo="pause-icon"][style*="block"]) .cs-win-in { background: radial-gradient(90% 120% at 50% 100%, rgba(255,150,70,0.30), #1b1a19 70%); }
.cs-win-in::before, .cs-win-in::after { content: ""; position: absolute; top: 0; bottom: 0; width: 9%; pointer-events: none; z-index: 3; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 1px, transparent 1px 4px); }
.cs-win-in::before { left: 2%; } .cs-win-in::after { right: 2%; }
/* no z-index here: a stacking context would stop the multiply layer blending with the glass */
.cs-viz-wrap { position: absolute; left: 11%; right: 11%; top: 9%; bottom: 7%; }
.cs-viz { position: absolute !important; inset: 0 !important; width: auto !important; height: auto !important; display: block !important; overflow: hidden !important; cursor: pointer; padding: 0 !important; }
.cs-viz canvas { width: 100% !important; height: 100% !important; display: block; filter: grayscale(1) brightness(2) contrast(1.1); }
.cs-viz-wrap::after { content: ""; position: absolute; inset: 0; background: #ffe9c4; mix-blend-mode: multiply; pointer-events: none; }

/* counter line: time · seek · time · volume */
.cs-line2 { left: 4%; right: 4%; top: 77%; height: 13.5%; z-index: 2; display: flex; align-items: center; gap: 1.6cqw; --rng-fill: #1d1814; --rng-groove: rgba(29,24,20,0.30); }
.cs-time { flex: 0 0 auto; padding: 0.35cqw 1cqw; border-radius: 0.5cqw; background: #1c1713; color: #ffd8a8; font: 700 min(2.1cqw, calc(var(--cs-hb) * 0.038)) var(--cs-type); font-variant-numeric: tabular-nums;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.32); }
.cs-time.end { color: rgba(255,216,168,0.6); }
.cs-vol { flex: 0 0 auto; display: flex; align-items: center; gap: 0.6cqw; margin-left: 1.4cqw; padding-left: 1.8cqw; border-left: 1px solid rgba(29,24,20,0.28); }
.cs-vol-icon { width: 2.8cqw; min-width: 20px; aspect-ratio: 1; display: grid; place-items: center; border-radius: 4px; color: #1d1814; cursor: pointer; }
.cs-vol-icon:hover { background: rgba(29,24,20,0.12); } .cs-vol-icon.muted { color: #fff3dd; } .cs-vol-icon svg { width: 78%; height: 78%; }
.cs-vol .cs-range { width: 11cqw; }

/* pencilled lyric line (opt-in via Settings); the line fills with a pencil underline as it plays */
.cs-lyric { left: 6%; right: 6%; top: 91%; height: 8.5%; z-index: 2; display: none; align-items: center; justify-content: center; overflow: hidden; }
html.melo-lyric-skin-on .cs-lyric { display: flex; }
.cs-lyric [data-melo="current-lyric"] { max-width: 100%; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 1px; color: #1d1814;
  font: min(2.15cqw, calc(var(--cs-hb) * 0.04))/1.2 var(--cs-hand);
  background: linear-gradient(#1d1814, #1d1814) left bottom / calc(var(--melo-lyric-progress, 0) * 100%) 1.5px no-repeat; }
.cs-lyric [data-melo="next-lyric"] { display: none; }
.cs-lyric .melo-lyric-tick { animation: cs-lyric .3s ease both; }
@keyframes cs-lyric { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
html.melo-show-playlist .cs-lyric, html.melo-show-lyrics .cs-lyric { display: none !important; }

/* trapezoid: its holes are the keys */
.cs-trap { left: 15.7%; width: 67.3%; top: 72.7%; height: 27.6%; z-index: 1; clip-path: polygon(6.3% 0, 95.6% 0, 100% 100%, 0 100%); background: var(--cs-trap-edge); }
.cs-trap::after { content: ""; position: absolute; inset: 0.45cqw 0.45cqw 0 0.45cqw; clip-path: polygon(6.3% 0, 95.6% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, var(--cs-trap-1), var(--cs-trap-2)); }
.cs-keys { left: 50%; top: 87%; transform: translate(-50%, -50%); z-index: 3; display: flex; align-items: center; gap: 2.5cqw; }
.cs-key { position: relative; display: grid; place-items: center; padding: 0; border: 0; cursor: pointer; color: var(--cs-key-ink);
  background: linear-gradient(180deg, var(--cs-key-1), var(--cs-key-2));
  box-shadow: 0 0.4cqw 0 var(--cs-key-edge), 0 0.7cqw 1cqw rgba(0,0,0,0.5), inset 0 0.2cqw 0 rgba(255,255,255,0.4);
  transition: transform .06s ease, box-shadow .06s ease, filter .12s ease, background .12s ease; }
.cs-key:hover { filter: brightness(1.08); }
.cs-key svg { width: 46%; height: 46%; }
.cs-key.round { width: min(6.2cqw, calc(var(--cs-hb) * 0.118)); aspect-ratio: 1; border-radius: 50%; }
.cs-key.sq { width: min(7.2cqw, calc(var(--cs-hb) * 0.135)); height: min(5.8cqw, calc(var(--cs-hb) * 0.11)); border-radius: 1.3cqw; }
.cs-key.play { width: min(9.4cqw, calc(var(--cs-hb) * 0.172)); aspect-ratio: 1; border-radius: 50%; }
.cs-key.play svg { width: 44%; height: 44%; }
.cs-key.sq svg.stop { width: 34%; height: 34%; }
.cs-key:active, .cs-key.active, .cs-face:has([data-melo="pause-icon"][style*="block"]) .cs-key.play {
  transform: translateY(0.4cqw); box-shadow: 0 0 0 var(--cs-key-edge), 0 0.2cqw 0.5cqw rgba(0,0,0,0.5), inset 0 0.3cqw 0.6cqw rgba(0,0,0,0.28); }
.cs-key.active, .cs-face:has([data-melo="pause-icon"][style*="block"]) .cs-key.play { background: linear-gradient(180deg, #ff7e50, var(--cs-or-1)); color: #fff; }

/* J-card: typed paper over label + reels */
.cs-jcard { left: 0; right: 0; top: 0; height: 76%; z-index: 5; display: none; flex-direction: column; overflow: hidden; border-radius: 2.2cqw 2.2cqw 0.6cqw 0.6cqw;
  background: var(--cs-cream); color: var(--cs-paper-ink); box-shadow: 0 0.6cqw 1.6cqw rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0,0,0,0.08); animation: cs-in .24s ease; }
html.melo-show-playlist .cs-jcard, html.melo-show-lyrics .cs-jcard { display: flex; }
.cs-jhead { flex: 0 0 30px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 12px; border-bottom: 2px solid rgba(29,24,20,0.75); font: 700 11px/1 var(--cs-type); letter-spacing: 0.12em; text-transform: uppercase; }
.cs-jside { padding: 2px 6px; border: 1.5px solid rgba(190,60,45,0.8); border-radius: 2px; color: rgba(190,60,45,0.92); transform: rotate(-3deg); }
html.melo-show-playlist .cs-jtitle::after { content: "Track list"; } html.melo-show-lyrics .cs-jtitle::after { content: "Liner notes"; }
.cs-jbody { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.cs-jbody [data-melo="embedded-playlist"], .cs-jbody [data-melo="embedded-lyrics"] { display: none; height: 100%; }
html.melo-show-playlist .cs-jbody [data-melo="embedded-playlist"], html.melo-show-lyrics .cs-jbody [data-melo="embedded-lyrics"] { display: block; }
.cs-jbody .embedded-lyrics-title { display: none; }
.cs-jbody .embedded-playlist, .cs-jbody .embedded-lyrics { height: 100% !important; max-height: 100% !important; overflow-y: auto !important; overflow-x: hidden !important; padding: 0 8px 0 42px !important;
  background: linear-gradient(var(--cs-margin), var(--cs-margin)) 32px 0 / 1px 100% no-repeat, repeating-linear-gradient(180deg, transparent 0 25px, var(--cs-rule) 25px 26px);
  background-attachment: local; scrollbar-width: thin; scrollbar-color: var(--cs-dim) transparent; }
.cs-jbody ::-webkit-scrollbar { width: 6px; } .cs-jbody ::-webkit-scrollbar-thumb { background: var(--cs-dim); border-radius: 3px; } .cs-jbody ::-webkit-scrollbar-track { background: transparent; }
.cs-jbody .embedded-playlist { counter-reset: cs-track; }
.cs-jbody .embedded-playlist-mini .embedded-playlist-row { position: relative; display: flex; align-items: center; gap: 8px; height: 26px; min-height: 26px; padding: 0 6px !important; border-radius: 0; font: 12px/26px var(--cs-type) !important; color: var(--cs-paper-ink); counter-increment: cs-track; }
.cs-jbody .embedded-playlist-mini .embedded-playlist-row::before { content: counter(cs-track, decimal-leading-zero) "."; position: absolute; left: -36px; width: 26px; text-align: right; color: var(--cs-dim); font-size: 10.5px; }
.cs-jbody .embedded-playlist-mini .embedded-playlist-row:hover { background: rgba(29,24,20,0.06); }
.cs-jbody .embedded-playlist-mini .embedded-playlist-row .t-title { font: 12px/26px var(--cs-type) !important; color: var(--cs-paper-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs-jbody .embedded-playlist-mini .embedded-playlist-row.active, .cs-jbody .lyric-line.active { background: linear-gradient(transparent 48%, rgba(247,107,61,0.45) 48% 92%, transparent 92%); }
.cs-jbody .embedded-playlist-mini .embedded-playlist-row.active .t-title { font-weight: 700 !important; }
.cs-jbody .embedded-playlist-mini .track-cover-mini { display: none !important; }
.cs-jbody .embedded-playlist-empty { padding: 0 6px; font: 12px/26px var(--cs-type); color: var(--cs-dim); }
.cs-jbody .embedded-playlist-more { width: 100%; height: 26px; border: 0; background: transparent; color: var(--cs-dim); font: 11px var(--cs-type); text-align: left; cursor: pointer; }
.cs-jbody .lyric-line { padding: 0 6px; min-height: 26px; font: 12px/26px var(--cs-type); color: var(--cs-dim); text-align: left; white-space: normal; overflow-wrap: anywhere; }
.cs-jbody .lyric-line.active { color: var(--cs-paper-ink); font-weight: 700; }

/* sliders: the track box has the same height as the thumb and the 4px groove is centered inside it, so thumb and line share one centre */
.cs-range { -webkit-appearance: none; appearance: none; height: 20px; margin: 0; background: transparent; cursor: pointer; outline: none; }
/* the app's own stylesheet styles input[type=range].vol (4px tall, accent gradient, flex:1): out-specify it so the input really is 20px tall and the thumb is centered */
input[type="range"].cs-range { height: 20px; border-radius: 0; background: transparent; }
input[type="range"].cs-range.vol { flex: 0 0 auto; height: 20px; border-radius: 0; background: transparent; }
input[data-melo="seek"] { flex: 1 1 0; min-width: 30px; }
.cs-range::-webkit-slider-runnable-track { height: 18px; border-radius: 2px; background: linear-gradient(to right, var(--rng-fill) 0%, var(--rng-fill) var(--progress, 0%), var(--rng-groove) var(--progress, 0%), var(--rng-groove) 100%) center / 100% 4px no-repeat; }
input[type="range"].cs-range.vol::-webkit-slider-runnable-track { height: 10px; background: linear-gradient(to right, var(--rng-fill) 0%, var(--rng-fill) var(--vol, 60%), var(--rng-groove) var(--vol, 60%), var(--rng-groove) 100%) center / 100% 4px no-repeat; }
.cs-range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--rng-groove); }
.cs-range::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--rng-fill); }
.cs-range:not(.vol)::-webkit-slider-thumb { -webkit-appearance: none; width: 5px; height: 18px; margin-top: 0; border-radius: 2px; background: #fff3dd; box-shadow: 0 0 0 1px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.4); }
.cs-range:not(.vol)::-moz-range-thumb { width: 5px; height: 18px; border: 0; border-radius: 2px; background: #fff3dd; }
input[type="range"].cs-range.vol::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: 0; border-radius: 50%; background: #fff3dd; box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.4); }
.cs-range.vol::-moz-range-thumb { width: 10px; height: 10px; border: 0; border-radius: 50%; background: #fff3dd; }

.cs-hidden { display: none !important; }
button { font-family: inherit; }
button:focus-visible, .cs-dymo:focus-visible, .cs-range:focus-visible, .cs-vol-icon:focus-visible { outline: 2px solid var(--cs-led); outline-offset: 2px; }

@container (max-width: 640px) { .cs-tools [data-melo="toggle-playlist"], .cs-tools [data-melo="toggle-lyrics"] { display: none; } }
@container (max-width: 560px) { .cs-tools [data-melo="toggle-library"], .cs-tools [data-melo="toggle-eq"] { display: none; } .cs-bar { gap: 6px; } }
@container (max-width: 440px) { .cs-tabs button.stage-btn { padding: 4px 6px; letter-spacing: 0.08em; } .cs-led { display: none; } .cs-vol .cs-range { width: 9cqw; } .cs-bar { padding: 0 40px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } .cs-hub { animation: none; } }
@keyframes cs-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Waveform seek bar (optional: Settings → Waveform seek bar; see skins/README.md §5.7b) */
[data-melo="waveform"] { --melo-wave-played: #1d1814; --melo-wave-rest: rgba(29,24,20,0.30); display: none; position: relative; flex: 1 1 0; min-width: 0; width: 100%; height: 85%; align-self: center; cursor: pointer; touch-action: none; -webkit-app-region: no-drag; }
html.melo-wave-on [data-melo="waveform"] { display: block; }
html.melo-wave-on #seekBar, html.melo-wave-on [data-melo="seek"] { position: absolute !important; width: 1px !important; height: 1px !important; opacity: 0 !important; pointer-events: none !important; }
</style>
</head>
<body data-window-width="720" data-window-height="450" data-min-width="480" data-min-height="310" data-max-width="1000" data-max-height="640" data-resizable="true">
<div id="melo-player">
  <div class="cs-face">
    <i class="cs-screw tl"></i><i class="cs-screw tr"></i><i class="cs-screw bl"></i><i class="cs-screw br"></i>

    <header class="cs-bar" data-tauri-drag-region>
      <div class="cs-menu">
        <input id="csMenuToggle" type="checkbox">
        <label class="cs-dymo" for="csMenuToggle" title="Menu">MELO</label>
        <div class="cs-flyout">
          <label class="cs-item" for="csMenuToggle" data-melo="add-files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 11v6M9 14h6"/></svg>Add files</label>
          <label class="cs-item" for="csMenuToggle" data-melo="add-folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10v5M9.5 12.5h5"/></svg>Add folder</label>
          <label class="cs-item" for="csMenuToggle" data-melo="theme-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Switch theme</label>
        </div>
        <label class="cs-dismiss" for="csMenuToggle" aria-label="Close menu"></label>
      </div>
      <i class="cs-led" aria-hidden="true"></i>

      <nav class="cs-tabs" aria-label="Stage">
        <button type="button" class="stage-btn active" data-melo="toggle-embedded-viz" title="Cassette">Tape</button>
        <button type="button" class="stage-btn" data-melo="toggle-embedded-lyrics" title="Lyrics">Lyrics</button>
        <button type="button" class="stage-btn" data-melo="toggle-embedded-playlist" title="Queue">Queue</button>
      </nav>

      <div class="cs-tools">
        <button type="button" data-melo="toggle-library" title="Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M10 6v14M15 4.5l4 15"/></svg></button>
        <button type="button" data-melo="toggle-playlist" title="Playlist window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg></button>
        <button type="button" data-melo="toggle-eq" title="Equalizer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="14" r="2" fill="var(--cs-shell-2)"/><circle cx="12" cy="8" r="2" fill="var(--cs-shell-2)"/><circle cx="18" cy="15" r="2" fill="var(--cs-shell-2)"/></svg></button>
        <button type="button" data-melo="toggle-lyrics" title="Lyrics window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6l-4 3v-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M8 10h8M8 13h5"/></svg></button>
        <button type="button" data-melo="toggle-settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
        <span class="sep"></span>
        <button type="button" data-melo="minimize" aria-label="minimize" title="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
        <button type="button" class="close" data-melo="close" aria-label="close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </header>

    <main class="cs-body">
      <div class="cs-panel">

        <div class="cs-label">
          <div class="cs-badge">
            <div class="cs-cover">
              <img data-melo="cover" alt="Cover" style="display:none">
              <div class="cs-cover-fallback" data-melo="cover-fallback" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 35V12l20-4v22"/><circle cx="13" cy="35" r="5"/><circle cx="33" cy="30" r="5"/></svg></div>
            </div>
            <span class="cs-side">A</span>
          </div>
          <div class="cs-lines">
            <div class="cs-line"><span class="cs-title" data-melo="title">No tape loaded</span><div class="cs-rating" data-melo="rating"></div></div>
            <div class="cs-line"><span class="cs-artist" data-melo="artist">Add music to begin</span><span class="cs-album" data-melo="album"></span></div>
          </div>
        </div>

        <div class="cs-reel l"><i class="cs-hub"></i></div>
        <div class="cs-win">
          <div class="cs-win-in">
            <div class="cs-viz-wrap"><div class="cs-viz" data-melo="visualizer" data-bars="36"></div></div>
          </div>
        </div>
        <div class="cs-reel r"><i class="cs-hub"></i></div>

        <div class="cs-line2">
          <span class="cs-time" data-melo="current-time">0:00</span>
          <div data-melo="waveform"></div>
          <input class="cs-range" type="range" data-melo="seek" min="0" max="100" value="0" aria-label="Seek">
          <span class="cs-time end" data-melo="duration">0:00</span>
          <div class="cs-vol">
            <span class="cs-vol-icon" data-melo="volume-icon" title="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19zM15.5 9.5a4 4 0 0 1 0 5M18.5 7a8 8 0 0 1 0 10"/></svg></span>
            <input class="cs-range vol" type="range" data-melo="volume" min="0" max="100" value="60" aria-label="Volume">
          </div>
        </div>

        <div class="cs-lyric">
          <div data-melo="current-lyric" aria-live="polite" title="Click to seek"></div>
          <div data-melo="next-lyric"></div>
        </div>

        <div class="cs-jcard">
          <div class="cs-jhead"><span class="cs-jside">Side A</span><span class="cs-jtitle"></span></div>
          <div class="cs-jbody">
            <div data-melo="embedded-playlist"></div>
            <div data-melo="embedded-lyrics"></div>
          </div>
        </div>
      </div>

      <div class="cs-trap"></div>

      <div class="cs-keys">
        <button type="button" class="cs-key round" data-melo="shuffle" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button type="button" class="cs-key sq" data-melo="prev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="2.6" height="14" rx="1.2"/><path d="M20 6.4v11.2a.8.8 0 0 1-1.2.7L10 12.7a.8.8 0 0 1 0-1.4l8.8-5.6A.8.8 0 0 1 20 6.4z"/></svg></button>
        <button type="button" class="cs-key play" data-melo="play" title="Play / Pause">
          <svg data-melo="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>
          <svg data-melo="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7.2 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 7.2 5.5z"/></svg>
        </button>
        <button type="button" class="cs-key sq" data-melo="stop" title="Stop"><svg class="stop" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2.5"/></svg></button>
        <button type="button" class="cs-key sq" data-melo="next" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="17.4" y="5" width="2.6" height="14" rx="1.2"/><path d="M4 6.4v11.2a.8.8 0 0 0 1.2.7L14 12.7a.8.8 0 0 0 0-1.4L5.2 5.7A.8.8 0 0 0 4 6.4z"/></svg></button>
        <button type="button" class="cs-key round" data-melo="repeat" title="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>

      <!-- hooks the engine fills but this skin does not show -->
      <span class="cs-hidden" data-melo="codec"></span><span class="cs-hidden" data-melo="specs"></span><span class="cs-hidden" data-melo="volume-pct">60%</span>
    </main>
  </div>
</div>
</body>
</html>
