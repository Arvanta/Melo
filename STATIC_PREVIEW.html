<!doctype html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melo - Static Preview (Screenshot)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#e8eef6 0%,#dbe6f0 45%,#c8d6e8 100%);min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:16px;box-shadow:0 16px 48px rgba(30,50,80,.15),0 2px 8px rgba(30,50,80,.08);width:min(970px,100%);padding:18px 20px 16px;position:relative}
.titlebar{position:absolute;top:0;left:0;right:0;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px;font-size:13px;font-weight:500}
.win{display:flex;gap:4px}.win span{width:32px;height:28px;display:grid;place-items:center;border-radius:6px}
.main{display:flex;gap:20px;margin-top:28px}
.cover{width:152px;height:152px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#e6ebf2;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.cover img{width:100%;height:100%;object-fit:cover}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.title{font-size:18px;font-weight:700}.artist,.album{font-size:13.5px;color:#6b7a8f;margin-top:3px}
.format{display:flex;gap:8px;margin-top:8px;font-size:11.5px;color:#8a9bb2}.badge{background:#e9eef3;color:#6e7f96;padding:2px 6px;border-radius:5px;font-weight:700;font-size:10.5px;border:1px solid rgba(0,0,0,.07)}
.transport{display:flex;align-items:center;gap:16px;justify-content:center;margin:6px 0}
.tbtn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;cursor:pointer}
.play{width:56px;height:56px;border-radius:50%;border:1px solid rgba(0,0,0,.06);background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.12);display:grid;place-items:center}
.seek{display:flex;align-items:center;gap:12px;font-size:12px;color:#6b7a8f}
.seek input{flex:1;height:4px;-webkit-appearance:none;background:linear-gradient(to right,#2a7bd6 35%,#e6ebf2 35%);border-radius:999px}
.right{width:220px;flex-shrink:0;border-left:1px solid rgba(0,0,0,.07);padding-left:20px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.vol{display:flex;align-items:center;gap:10px}.vol input{flex:1;height:4px;-webkit-appearance:none;background:linear-gradient(to right,#2a7bd6 60%,#e6ebf2 60%);border-radius:999px}
.bars{display:flex;align-items:flex-end;gap:5px;height:36px}
.bar{flex:1;background:#6aa6e6;border-radius:999px 999px 3px 3px;min-width:4px}
.actions{display:flex;justify-content:flex-end;gap:6px;color:#6b7a8f}
@media(max-width:860px){.main{flex-direction:column}.cover{width:100%;height:200px}.right{width:100%;border-left:none;border-top:1px solid rgba(0,0,0,.07);padding-left:0;padding-top:14px;flex-direction:row;justify-content:space-between}}
</style>
</head>
<body>
<div class="card">
  <div class="titlebar"><div style="display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h2l1-7 2 14 3-10 2 6h2l2-9 2 14 2-7h2"/></svg>Melo</div><div class="win"><span>—</span><span>□</span><span>×</span></div></div>
  <div class="main">
    <div class="cover"><img src="https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?w=400&q=80" alt="cover"></div>
    <div class="meta">
      <div>
        <div class="title">The Horizon</div>
        <div class="artist">Tycho</div>
        <div class="album">Simulcast</div>
        <div class="format"><span class="badge">FLAC</span><span>44.1 kHz · 16 bit · Stereo</span></div>
      </div>
      <div class="transport">
        <button class="tbtn">⤨</button>
        <button class="tbtn">⏮</button>
        <button class="play">⏸</button>
        <button class="tbtn">⏭</button>
        <button class="tbtn">↻</button>
      </div>
      <div class="seek"><span>1:24</span><input type="range" value="35"><span>4:36</span></div>
    </div>
    <div class="right">
      <div class="vol"><span>🔊</span><input type="range" value="60"><span>60%</span></div>
      <div style="flex:1">
        <div class="actions"><span>≡♫</span><span>⚙</span></div>
        <div class="bars"><div class="bar" style="height:8px;opacity:.55"></div><div class="bar" style="height:14px;opacity:.7"></div><div class="bar" style="height:22px;opacity:.85"></div><div class="bar" style="height:28px"></div><div class="bar" style="height:32px"></div><div class="bar" style="height:12px"></div><div class="bar" style="height:18px;opacity:.8"></div><div class="bar" style="height:24px"></div><div class="bar" style="height:10px;opacity:.65"></div><div class="bar" style="height:6px;opacity:.45"></div></div>
      </div>
    </div>
  </div>
</div>
<p style="margin-top:16px;color:#6b7a8f;font-size:13px;text-align:center">↑ این پیش‌نمایش ایستاست — برای نسخه تعاملی، LIVE PREVIEW بالا یا اجرای محلی را ببینید</p>
</body>
</html>
